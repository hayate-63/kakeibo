let COLMAP = null, colLayer = null;
async function drawCollectionMap() {
  const el = document.getElementById('colMap');
  if (!el) return;
  if (typeof L === 'undefined') { el.innerHTML = '<div class="map-fallback">地図を読み込めません（オフライン？）</div>'; return; }
  if (COLMAP && COLMAP.getContainer() !== el) { COLMAP.remove(); COLMAP = null; }
  if (!COLMAP) {
    COLMAP = L.map(el, { zoomControl: false }).setView([36.2, 138.2], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(COLMAP);
    colLayer = L.layerGroup().addTo(COLMAP);
  }
  colLayer.clearLayers();
  const pts = [];
  const pins = Object.values(S.spots).filter(s => s.status === 'visited' && s.lat != null).map(s => ({ id: s.id, name: s.name, lat: s.lat, lng: s.lng, photo: spotPhoto(s.id) }));
  // スポット帳に無い（旅帳だけの）行った場所
  collectionTrips().forEach(t => t.items.filter(i => i.visited && !i.spotId && i.lat != null).forEach(i => pins.push({ id: 'i' + i.id, name: i.name, lat: i.lat, lng: i.lng, photo: null })));
  const need = pins.filter(p => p.photo && !TH.has(thumbKey(p.photo.fileId, 200))).map(p => p.photo.fileId);
  for (let i = 0; i < need.length; i += 12) {
    try { const r = await api('mediaThumbs', { ids: need.slice(i, i + 12), size: 200 }); Object.keys(r.thumbs || {}).forEach(id => TH.set(thumbKey(id, 200), r.thumbs[id].thumb || '')); } catch (e) { break; }
  }
  pins.forEach(p => {
    const th = p.photo ? TH.get(thumbKey(p.photo.fileId, 200)) : '';
    const icon = th ? L.divIcon({ className: 'mk', html: `<span class="mk-photo"><img src="${th}" alt=""></span>`, iconSize: [44, 44], iconAnchor: [22, 22] })
      : L.divIcon({ className: 'mk', html: '<span class="mk-pin done">✓</span>', iconSize: [20, 20], iconAnchor: [10, 10] });
    L.marker([p.lat, p.lng], { icon }).bindPopup(`<b>${esc(p.name)}</b>`).addTo(colLayer);
    pts.push([p.lat, p.lng]);
  });
  setTimeout(() => COLMAP.invalidateSize(), 50);
  if (pts.length) COLMAP.fitBounds(pts, { padding: [24, 24], maxZoom: 12 });
}

// 年別レポートの書き出し（9:16・1080×1920）
async function renderYearCanvas(y) {
  const W = 1080, H = 1920, th = VTHEME;
  const ts = collectionTrips().filter(t => (t.startDate || '').startsWith(y)).sort(tripSort);
  const s = statsOf(ts);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = th.paper; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = th.accent; ctx.font = `600 36px ${th.sans}`; ctx.letterSpacing = '8px'; ctx.fillText('MY TRAVEL YEAR', 80, 150); ctx.letterSpacing = '0px';
  ctx.fillStyle = th.ink; ctx.font = `700 220px ${th.serif}`; ctx.fillText(y, 70, 380);
  const stats = [[s.trips, 'TRIPS'], [s.days, 'DAYS'], [s.spots, 'SPOTS'], [s.km ? s.km.toLocaleString() : '—', 'KM']];
  stats.forEach(([v, k], i) => { const x = 80 + i * 240; ctx.fillStyle = th.ink; ctx.font = `700 64px ${th.serif}`; ctx.fillText(String(v), x, 520); ctx.fillStyle = th.sub; ctx.font = `600 26px ${th.sans}`; ctx.fillText(k, x, 560); });
  const list = ts.slice(0, 9);
  const cols = 3, gap = 24, cw = (W - 160 - gap * (cols - 1)) / cols, ch = cw * 1.25;
  for (let i = 0; i < list.length; i++) {
    const t = list[i]; const x = 80 + (i % cols) * (cw + gap), yy = 640 + Math.floor(i / cols) * (ch + 90);
    const cm = coverOrFirst(t);
    const img = cm ? await mediaImage(cm) : (isImageUrl(t.coverLink) ? await loadImg(t.coverLink) : null);
    if (img) drawCoverFit(ctx, img, x, yy, cw, ch);
    else { ctx.fillStyle = '#e7e0d3'; ctx.fillRect(x, yy, cw, ch); ctx.font = `80px ${th.sans}`; ctx.fillText(tripEmoji(t), x + cw / 2 - 40, yy + ch / 2 + 28); }
    ctx.fillStyle = th.ink; ctx.font = `700 28px ${th.sans}`;
    ctx.fillText(wrapText(ctx, t.title, cw)[0] || '', x, yy + ch + 40);
    ctx.fillStyle = th.sub; ctx.font = `400 24px ${th.sans}`; ctx.fillText(fmtDate(t.startDate), x, yy + ch + 72);
  }
  if (ts.length > 9) { ctx.fillStyle = th.sub; ctx.font = `500 30px ${th.sans}`; ctx.fillText(`ほか ${ts.length - 9} 件`, 80, H - 120); }
  ctx.fillStyle = th.accent; ctx.font = `600 28px ${th.sans}`; ctx.fillText('旅帳', W - 140, H - 70);
  return c;
}
ACT.yearExport = async (el) => {
  el.disabled = true;
  try {
    await ensureFonts();
    const c = await renderYearCanvas(el.dataset.y);
    openModal(`<div id="instaOut"></div>`, { title: el.dataset.y + ' 年別レポート' });
    await exportCanvases([c], 'TABICHO_' + el.dataset.y);
  } catch (e) { toast('書き出しに失敗：' + e.message); }
  el.disabled = false;
};

// ---- 99_main.js ----
// ============================================================================
// 99 描画・タブ切替・イベント委譲・起動
// ============================================================================
const TABS = [
  { id: 'home', icon: '🏠', label: 'ホーム' },
  { id: 'shiori', icon: '📒', label: 'しおり' },
  { id: 'drive', icon: '🚗', label: 'ドライブ' },
  { id: 'money', icon: '💴', label: 'お金' },
  { id: 'record', icon: '📷', label: '記録' }
];

function switchTab(id) {
  S.tab = id;
  if (id === 'shiori') loadSpots(false);
  window.scrollTo(0, 0);
  render();
}
ACT.tab = (el) => switchTab(el.dataset.tab);

// 画面上部の帯：デモモードは全画面で明示。GAS から開かれていない本番は赤で知らせる
function renderModeBanner() {
  const el = document.getElementById('modeBanner');
  if (!el) return;
  if (IS_GAS) { el.innerHTML = ''; return; }
  el.innerHTML = IS_DEMO
    ? '<div class="mode-banner demo">🧪 デモモード（GAS 未接続）：データはこのブラウザにだけ保存されます。本番の旅帳ではありません</div>'
    : '<div class="mode-banner bad">⚠️ GAS の接続部品が読み込めていません。旅帳は GAS のウェブアプリ URL から開いてください（デモへの切り替えはしません）</div>';
}
function render() {
  try { renderInner(); }
  catch (e) {
    console.error(e);
    if (window.__TB && !window.__TB.started) window.__TB.fail('画面の描画', e);
    else toast('表示中にエラー：' + e.message);
  }
}
function renderInner() {
  renderModeBanner();
  const trip = curTrip();
  // ヘッダー
  const ht = $('#headTrip');
  if (ht) ht.innerHTML = trip ? `<span class="ht-emoji">${esc(tripEmoji(trip))}</span><span class="ht-title">${esc(trip.title)}</span>${statusBadge(tripStatus(trip))}` : '<span class="ht-title">旅帳</span>';
  // ナビ
  const nav = $('#nav');
  if (nav) {
    const ddrive = trip ? (hasVehicle(trip, 'car') ? '🚗' : (VEHICLES[trip.vehicles[0]] || VEHICLES.car).icon) : '🚗';
    nav.innerHTML = TABS.map(t => `<button class="nav-item ${S.tab === t.id ? 'active' : ''}" data-act="tab" data-tab="${t.id}"><span class="icon">${t.id === 'drive' ? ddrive : t.icon}</span><span>${t.id === 'drive' && trip && !hasVehicle(trip, 'car') ? '移動' : t.label}</span></button>`).join('');
  }
  TABS.concat([{ id: 'collection' }]).forEach(t => { const p = $('#page-' + t.id); if (p) p.classList.toggle('active', S.tab === t.id); });
  const page = $('#page-' + S.tab);
  if (!page) return;
  try {
    if (S.tab === 'home') { page.innerHTML = renderHome(); setTimeout(() => loadThumbs(page), 0); return; }
    if (S.tab === 'collection') { page.innerHTML = renderCollection(); return; }
    if (!trip) {
      if (S.tab === 'shiori') { $('#shioriTop').innerHTML = ''; $('#shioriMapWrap').style.display = 'none'; $('#shioriBody').innerHTML = noTripHTML(); }
      else page.innerHTML = noTripHTML();
      return;
    }
    if (S.tab === 'shiori') renderShiori(trip);
    else if (S.tab === 'drive') page.innerHTML = renderDrive(trip);
    else if (S.tab === 'money') page.innerHTML = renderMoney(trip);
    else if (S.tab === 'record') page.innerHTML = renderRecord(trip);
  } catch (e) {
    console.error(e);
    page.innerHTML = `<div class="warn-box">表示中にエラーが起きました：${esc(e.message)}</div>`;
  }
}
function noTripHTML() { return emptyHTML('🧳', '旅が選ばれていません', '<button class="btn primary mt" data-act="tripNew">＋ 新しい旅</button>'); }

// ---- イベント委譲 ----
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const f = ACT[el.dataset.act];
  if (!f) return;
  if (el.tagName === 'A') return;
  if (el.disabled) return;
  e.preventDefault();
  try { const r = f(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast('エラー：' + err.message); }); }
  catch (err) { console.error(err); toast('エラー：' + err.message); }
});
document.addEventListener('input', (e) => { const el = e.target; const f = el.dataset && ON_INPUT[el.dataset.input]; if (f) f(el, e); });
document.addEventListener('change', (e) => {
  const el = e.target; const f = el.dataset && ON_CHANGE[el.dataset.change];
  if (f) { try { const r = f(el, e); if (r && r.catch) r.catch(err => toast('エラー：' + err.message)); } catch (err) { console.error(err); toast('エラー：' + err.message); } }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalStack.length) closeModal(); });

function isTyping() { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !modalStack.length; }
// ホーム・ドライブは時刻で表示が変わるので定期的に描き直す
setInterval(() => { if (!modalStack.length && !isTyping() && (S.tab === 'home' || S.tab === 'drive')) render(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { loadSpots(true); if (!modalStack.length && !isTyping()) render(); }
});

// 起動の各段階を個別に守る（どこかで失敗しても画面は出し、原因を起動ガードに残す）
function bootStep(name, fn) {
  try { return fn(); }
  catch (e) { console.error(name, e); if (window.__TB) window.__TB.errors.push(name + '：' + (e && e.message || e)); return undefined; }
}
async function init() {
  bootStep('端末データの読み込み', loadCache);
  bootStep('送信キューの読み込み', mqLoad);
  bootStep('予約と工程の同期', () => Object.values(S.trips).forEach(t => syncBookingItems(t)));
  bootStep('表示する旅の選択', pickDefaultTrip);
  render();
  if (window.__TB) {
    window.__TB.started = true;
    if (window.__TB.errors.length) window.__TB.show('旅帳は起動しましたが、起動中に問題がありました');
  }
  startGeo();
  ensureFx();
  await bootstrapFromServer();
  Object.values(S.trips).forEach(t => { if (syncBookingItems(t)) commitTrip(t, { silent: true }); });
  pickDefaultTrip();
  render();
  await loadSpots(true);
  retryVisitWrites();
}
document.addEventListener('DOMContentLoaded', init);

})();
