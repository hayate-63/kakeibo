<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅帳">
<title>旅帳</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #f4f5f7; --card: #fff; --primary: #1e293b; --accent: #6366f1; --accent-l: #e0e7ff;
  --ok: #059669; --ok-bg: #d1fae5; --ng: #dc2626; --ng-bg: #fee2e2; --warn: #b45309; --warn-bg: #fef3c7;
  --info: #0369a1; --info-bg: #e0f2fe; --text: #0f172a; --sub: #64748b; --border: #e2e8f0; --muted-bg: #f1f5f9;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--bg); color: var(--text);
  max-width: 768px; margin: 0 auto; padding-bottom: calc(78px + var(--safe-b)); font-size: 15px; line-height: 1.5; }
body.modal-open { overflow: hidden; }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: #fff; font-size: 16px; min-width: 0; width: 100%; }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); transform: scale(1.15); }
textarea { resize: vertical; }
a { color: var(--accent); }
.app-head { background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(8px + var(--safe-t)) 12px 8px; position: sticky; top: 0; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.head-trip { background: none; border: none; color: #fff; display: flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer; text-align: left; }
.ht-title { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.ht-emoji { font-size: 20px; }
.head-right { display: flex; align-items: center; gap: 6px; }
.sync-badge { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.15); white-space: nowrap; }
.sync-badge:empty { display: none; }
.sync-badge { color: #fff; } .sync-badge.sb-ok { background: #059669; } .sync-badge.sb-saving { background: #d97706; } .sync-badge.sb-error, .sync-badge.sb-offline { background: #b91c1c; }
.icon-btn { border: none; background: transparent; font-size: 18px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
.icon-btn.light { background: rgba(255,255,255,.12); }
.page { display: none; padding: 12px; }
.page.active { display: block; animation: fade .15s ease-in; }
#page-shiori { padding: 0; } #shioriTop, #shioriBody { padding: 12px; } #shioriTop { padding-bottom: 0; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 768px; background: rgba(255,255,255,.97);
  border-top: 1px solid var(--border); display: flex; padding: 6px 6px calc(6px + var(--safe-b)); z-index: 600; backdrop-filter: blur(8px); }
.nav-item { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 700; color: var(--sub); padding: 4px 0; border-radius: 10px; cursor: pointer; }
.nav-item .icon { font-size: 20px; line-height: 1.2; }
.nav-item.active { color: var(--primary); background: var(--muted-bg); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.ok-card { background: var(--ok-bg); border-color: #a7f3d0; } .muted-card { opacity: .6; }
.h2 { font-size: 19px; font-weight: 800; line-height: 1.3; } .h3 { font-size: 17px; font-weight: 800; } .b { font-weight: 700; }
.muted { color: var(--sub); } .small { font-size: 12.5px; } .center { text-align: center; } .pad { padding: 12px 4px; }
.ok { color: var(--ok); } .ng { color: var(--ng); } .warn { color: var(--warn); }
.mt { margin-top: 10px; } .grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; } .row.gap { gap: 8px; } .row.between { justify-content: space-between; gap: 8px; } .row.wrap, .wrap { flex-wrap: wrap; }
.section-title { font-weight: 800; font-size: 15px; margin: 14px 2px 8px; }
.group-label { font-size: 12px; font-weight: 700; color: var(--sub); margin: 12px 2px 6px; }
.btn { border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--text); white-space: nowrap; font-size: 14px; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.xl { padding: 16px; font-size: 18px; border-radius: 14px; }
.btn.block { display: flex; width: 100%; }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { background: var(--ng-bg); color: var(--ng); border-color: #fecaca; }
.btn.ghost { background: transparent; color: var(--sub); }
.btn.visit { background: var(--ok-bg); color: var(--ok); border-color: #a7f3d0; }
.btn:disabled { opacity: .45; cursor: default; }
.link-btn { border: none; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px 0; font-size: 13px; text-decoration: none; }
.chip-btn { border: 1px solid var(--border); background: #fff; border-radius: 99px; padding: 5px 11px; font-size: 13px; cursor: pointer; margin: 2px; font-weight: 600; }
.chip-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.op { border: 1px solid var(--border); background: #fff; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; }
.op:disabled { opacity: .3; } .op.on { background: var(--ok-bg); }
.seg { display: flex; background: #e2e8f0; border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 10px; }
.seg-btn { flex: 1; border: none; background: transparent; padding: 8px 6px; border-radius: 9px; font-weight: 700; color: var(--sub); cursor: pointer; font-size: 13.5px; }
.seg-btn.on { background: #fff; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.dot-badge { background: var(--ng); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 6px; }
.badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; white-space: nowrap; background: var(--muted-bg); color: var(--sub); }
.st-idea { background: #f3e8ff; color: #7e22ce; } .st-plan { background: var(--info-bg); color: var(--info); } .st-fixed { background: var(--accent-l); color: var(--accent); }
.st-go { background: #dcfce7; color: #15803d; } .st-settle { background: var(--warn-bg); color: var(--warn); } .st-done { background: #e2e8f0; color: #334155; } .st-cancel { background: #f1f5f9; color: #94a3b8; text-decoration: line-through; }
.bk-要予約 { background: var(--warn-bg); color: var(--warn); } .bk-予約済 { background: var(--ok-bg); color: var(--ok); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--accent-l); color: var(--accent); margin: 1px 2px; font-weight: 700; }
.tag.gray { background: #e2e8f0; color: var(--sub); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.must { background: #fef3c7; color: #92400e; }
.alert { border-radius: 10px; padding: 9px 12px; margin-top: 8px; font-size: 13.5px; cursor: pointer; }
.alert.warn { background: var(--warn-bg); color: #78350f; } .alert.err { background: var(--ng-bg); color: #7f1d1d; } .alert.info { background: var(--info-bg); color: #0c4a6e; } .alert.ok { background: var(--ok-bg); color: #064e3b; cursor: default; }
.info-box { background: var(--info-bg); color: #0c4a6e; border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; }
.warn-box { background: var(--warn-bg); color: #78350f; border-radius: 10px; padding: 9px 12px; margin: 8px 0; }
.memo { background: #fffbeb; border-radius: 8px; padding: 6px 9px; margin-top: 6px; white-space: pre-wrap; }
.empty { text-align: center; color: var(--sub); padding: 34px 12px; }
.empty-icon { font-size: 42px; margin-bottom: 6px; }
.progress { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-top: 6px; }
.progress > div { height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.progress.over > div { background: var(--ng); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
.check.big { font-size: 17px; font-weight: 800; }
.req { font-size: 10px; color: var(--ng); margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 99px; padding: 5px 11px; background: #fff; cursor: pointer; font-size: 13.5px; font-weight: 600; }
.chip input { transform: none; }
.chip:has(input:checked) { background: var(--accent-l); border-color: var(--accent); color: var(--accent); }
.chips.disabled { opacity: .45; pointer-events: none; }
.chip.mem { padding: 3px 4px 3px 4px; } .chip.mem.me { background: var(--accent-l); border-color: var(--accent); }
.chip-x { border: none; background: none; cursor: pointer; font-size: 12px; padding: 2px 5px; color: var(--sub); }
.presets { margin-top: 6px; }
.form-grid { display: grid; grid-template-columns: 96px 1fr; gap: 9px 10px; align-items: center; }
.form-grid > label { font-size: 13px; font-weight: 700; color: #334155; }
.form-grid .span2 { grid-column: 1 / -1; }
@media (max-width: 380px) { .form-grid { grid-template-columns: 1fr; gap: 4px; } .form-grid > label { margin-top: 6px; } }
.list-row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; }
.list-row:last-child { border-bottom: none; }
.tbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.tbl th, .tbl td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: right; } .tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--sub); font-size: 11.5px; }

/* ホーム */
.home-actions { display: flex; gap: 8px; margin-bottom: 12px; }
.trip-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.trip-row.cur { border: 2px solid var(--accent); }
.trip-emoji { font-size: 24px; width: 34px; text-align: center; } .trip-emoji.big { font-size: 34px; width: 44px; }
.cur-trip .meta-grid { display: grid; gap: 4px; margin-top: 10px; font-size: 13.5px; }
.next-mini { background: var(--muted-bg); border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 13.5px; cursor: pointer; }

/* しおり */
.mode-bar .seg { margin-bottom: 8px; }
.map-wrap { position: relative; height: 230px; margin: 10px 12px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #e5e7eb; z-index: 1; }
#leafletMap { width: 100%; height: 100%; }
.map-fallback { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--sub); font-size: 13px; }
.map-overlay { position: absolute; top: 8px; right: 8px; z-index: 450; display: flex; gap: 6px; }
.map-btn { border: none; background: rgba(255,255,255,.95); border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 13px; box-shadow: 0 1px 6px rgba(0,0,0,.2); cursor: pointer; }
.mk { background: none; border: none; }
.mk-num { display: flex; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 13px; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.mk-num.done { background: var(--ok); }
.mk-pin { display: flex; width: 20px; height: 20px; border-radius: 50%; background: #94a3b8; color: #fff; font-size: 11px; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.mk-pin.must { background: #f59e0b; } .mk-pin.done { background: var(--ok); }
.day-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; }
.day-tab { flex: 0 0 auto; border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 6px 14px; font-weight: 800; font-size: 13px; cursor: pointer; line-height: 1.25; }
.day-tab span { font-size: 11px; font-weight: 600; color: var(--sub); }
.day-tab.on { background: var(--primary); color: #fff; border-color: var(--primary); } .day-tab.on span { color: #cbd5e1; }
.day-tab.today { box-shadow: inset 0 -3px 0 #22c55e; }
.zone-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 12px 0 6px; font-weight: 800; font-size: 14px; flex-wrap: wrap; }
.zone-head select.sm { width: auto; padding: 5px 8px; font-size: 13px; }
.list-head { border-top: 2px dashed var(--border); padding-top: 12px; }
.add-row { margin: 8px 0; }
.wx { font-size: 12.5px; font-weight: 600; color: #334155; white-space: nowrap; }

.timeline { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 6px 8px; }
.tl-line { position: absolute; left: 75px; width: 4px; margin-left: -2px; background: #cbd5e1; border-radius: 2px; }
.tl-fill { position: absolute; left: 75px; width: 4px; margin-left: -2px; background: var(--accent); border-radius: 2px; height: 0; transition: height .6s; }
.tl-emoji { position: absolute; left: 75px; transform: translate(-50%, -50%); font-size: 26px; z-index: 3; transition: top .6s; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); pointer-events: none; }
.tl-row { position: relative; display: grid; grid-template-columns: 52px 26px 1fr auto; gap: 6px; align-items: start; padding: 8px 0; }
.tl-time { font-size: 13px; text-align: right; line-height: 1.2; padding-top: 4px; } .tl-time span { display: block; font-size: 11px; color: var(--sub); }
.tl-dotcol { display: flex; justify-content: center; position: relative; z-index: 2; padding-top: 1px; }
.tl-dot { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.tl-dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.tl-row.fixed .tl-dot { border-color: #f59e0b; color: #b45309; } .tl-row.move .tl-dot { border-color: #0ea5e9; color: #0369a1; border-radius: 6px; }
.tl-body { cursor: pointer; min-width: 0; } .tl-name { font-weight: 700; }
.tl-row.visited .tl-name { color: var(--ok); }
.tl-ops { display: flex; flex-direction: column; gap: 4px; } .tl-ops .op { width: 30px; height: 28px; font-size: 12px; }
.tl-move { margin-left: 86px; font-size: 12px; color: var(--sub); padding: 2px 8px; border-radius: 8px; background: var(--muted-bg); display: inline-block; cursor: pointer; position: relative; z-index: 2; }
.tl-status { font-size: 13px; color: #334155; margin: 6px 4px; min-height: 1em; }
.warns { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.wbadge { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.wbadge.err { background: var(--ng-bg); color: var(--ng); } .wbadge.warn { background: var(--warn-bg); color: var(--warn); } .wbadge.info { background: var(--info-bg); color: var(--info); }

.lcard { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.lcard.must { border-left: 4px solid #f59e0b; }
.lc-head { display: flex; gap: 8px; align-items: flex-start; }
.lc-title { font-weight: 800; cursor: pointer; }
.pri { border: none; border-radius: 8px; padding: 3px 8px; font-size: 11.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.pri.must { background: #fef3c7; color: #92400e; } .pri.maybe { background: var(--muted-bg); color: var(--sub); }
.lc-line { margin-top: 4px; font-size: 13.5px; }
.lc-line .ok { font-weight: 700; } .lc-line .ng { font-weight: 700; } .lc-line .warn { font-weight: 700; }
.day-badges { display: flex; flex-wrap: wrap; gap: 4px; }
.dbadge { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--muted-bg); color: var(--sub); }
.dbadge.open { background: var(--ok-bg); color: var(--ok); } .dbadge.closed { background: var(--ng-bg); color: var(--ng); }
.extras .sep { color: #cbd5e1; margin: 0 2px; }
.lc-ops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.done-zone { opacity: .85; }
.done-row { display: flex; align-items: center; gap: 6px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
.bk { cursor: pointer; }
.pack-cat { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.pack-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--muted-bg); }
.pack-row.done .check { color: var(--sub); text-decoration: line-through; }
.pack-row .owner { width: auto; max-width: 96px; font-size: 12px; padding: 4px; }
.pack-cat .row.gap { margin-top: 6px; }

/* ドライブ */
.drive-main { border: 2px solid var(--primary); }
.drive-name { font-size: 26px; font-weight: 900; line-height: 1.25; margin: 4px 0; word-break: break-word; }
.drive-route { font-size: 16px; font-weight: 700; margin: 6px 0; }
.countdown { background: var(--primary); color: #fff; border-radius: 14px; padding: 12px; text-align: center; margin: 10px 0; }
.countdown .muted { color: #cbd5e1; }
.cd-big { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.cd-big.soon { color: #fde047; } .cd-big.late { color: #fca5a5; font-size: 26px; }
.park { margin-top: 12px; } .park textarea { margin-top: 4px; }
.transit { border: 2px solid #0ea5e9; }

/* お金 */
.fx-row { display: grid; grid-template-columns: 104px 1fr 44px; gap: 6px; margin-top: 8px; }
.fx-out { font-size: 18px; margin-top: 8px; }
.amount-row { display: grid; grid-template-columns: 96px 1fr 44px; gap: 6px; align-items: center; }
.amount-in { font-size: 24px; font-weight: 800; text-align: right; }
.amount-in.small { font-size: 18px; }
.amount-in.calc { background: #f5f7ff; border-color: var(--accent); cursor: pointer; }
.amount-field { display: grid; grid-template-columns: 1fr 44px; gap: 6px; }
.mode-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; height: 100%; min-height: 40px; font-size: 18px; cursor: pointer; }
.cur-sel { font-size: 13px; padding: 8px 4px; }
.sub-actions { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 6px; }
.rate-row { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; }
.rate-row .rate-in { width: 110px; }
.card-jpy { margin: 8px 0; font-size: 13px; } .card-jpy input { margin-top: 3px; }
.money-ed .form-grid { margin: 6px 0; }
.split-box { background: var(--muted-bg); border-radius: 10px; padding: 9px; margin-top: 6px; }
.split-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; margin-bottom: 6px; gap: 6px; flex-wrap: wrap; }
.solo { font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.per-person { margin-top: 8px; font-size: 13.5px; } .per-person .big { font-size: 18px; }
.budget-nums { display: flex; gap: 18px; margin-top: 6px; flex-wrap: wrap; }
.cat-bars { margin-top: 10px; }
.cat-bar { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; margin-top: 4px; }
.cat-bar .bar { height: 8px; background: var(--muted-bg); border-radius: 99px; overflow: hidden; } .cat-bar .bar div { height: 100%; background: var(--accent); }
.ex-row { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; margin-bottom: 6px; cursor: pointer; }
.ex-icon { font-size: 22px; } .ex-amt { text-align: right; white-space: nowrap; }
.tx.done { background: var(--ok-bg); }
.tx .form-grid { margin-top: 8px; grid-template-columns: 80px 1fr; }
.tx select { width: 92px; flex: 0 0 auto; font-size: 12px; }
.breakdown { background: #f8fafc; border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 13px; }

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseYmd(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function dateRange(a, b) { const out = []; if (!a) return out; b = b || a; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }

  if (!a || !b || a.lat == null || b.lat == null) return null;

  const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;

// 安全な電卓式評価（+ − × ÷ と括弧）
function evalExpr(src) {
  const s = String(src).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '').replace(/\s/g, '');
  let i = 0;
  function peek() { return s[i]; }
  function number() {
    let st = i;
    while (i < s.length && /[0-9.]/.test(s[i])) i++;
    if (st === i) throw new Error('式が不正です');
    return parseFloat(s.slice(st, i));
  }
  function factor() {
    if (peek() === '-') { i++; return -factor(); }
    if (peek() === '+') { i++; return factor(); }
    if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw new Error('括弧が閉じていません'); i++; return v; }
    let v = number();
    if (peek() === '%') { i++; v = v / 100; }
    return v;
  }
  function term() {
    let v = factor();
    while (peek() === '*' || peek() === '/') {
      const op = s[i++]; const r = factor();
      v = op === '*' ? v * r : v / r;
    }
    return v;
  }
  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') {
      const op = s[i++]; const r = term();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  if (!s) return 0;
  const v = expr();
  if (i !== s.length) throw new Error('式が不正です');
  if (!isFinite(v)) throw new Error('計算できません');
  return v;
}

// ---------------------------------------------------------------------------
function pendingBookingCount(trip) {
  let n = trip.bookings.filter(b => b.status === '要予約').length;
  n += trip.items.filter(it => it.needsBooking && !(it.bookingId && trip.bookings.some(b => b.id === it.bookingId && b.status === '予約済'))
    && !(it.bookingId && trip.bookings.some(b => b.id === it.bookingId && b.status === '要予約'))).length;
  return n;
}
function tripStatus(trip, today) {
  today = today || todayStr();
  if (trip.manualStatus === '中止') return '中止';
  if (trip.manualStatus === '完了') return '完了';
  if (!trip.startDate) return '検討中';
  const end = trip.endDate || trip.startDate;
  if (today < trip.startDate) {
    const booked = trip.bookings.some(b => b.status === '予約済');
    return (pendingBookingCount(trip) === 0 && booked) ? '確定' : '計画中';
  }
  if (today <= end) return '旅行中';
  return '精算・記録中';
}

async function loadSpots(force) {
  if (S.spotsState === 'loading') return;
  if (!force && S.spotsState === 'ok' && Date.now() - S.spotsAt < 60 * 1000) return;
  S.spotsState = 'loading';
  try {
    const r = await api('spotList');
    const map = {};
    (r.spots || []).forEach(s => { map[String(s.id)] = normalizeSpot(s); });
    S.spots = map; S.spotsState = 'ok'; S.spotsAt = Date.now(); S.spotsError = '';
    reconcileVisits();
  } catch (e) {
    S.spotsState = 'error'; S.spotsError = e.message || String(e);
  }
  render();
}
function normalizeSpot(s) {
  const o = Object.assign({}, s);
  o.id = String(o.id);
  o.lat = o.lat === '' || o.lat == null ? null : Number(o.lat);
  o.lng = o.lng === '' || o.lng == null ? null : Number(o.lng);
  if (typeof o.tags === 'string') o.tags = o.tags.split(/[,、\s#]+/).filter(Boolean);
  o.tags = o.tags || [];
  if (o.priority === '絶対行きたい') o.priority = 'must';
  if (o.priority === '行けたら') o.priority = 'maybe';
  if (o.status === '行った') o.status = 'visited';
  if (o.status === '行きたい') o.status = 'want';
  if (typeof o.parking === 'string') o.parking = /有|あり|○|true|yes/i.test(o.parking) ? true : (/無|なし|×|false|no/i.test(o.parking) ? false : o.parking);
  o.stayMin = o.stayMin != null && o.stayMin !== '' ? Number(o.stayMin) : null;
  o.price = o.price != null && o.price !== '' ? Number(o.price) : null;
  o.visits = o.visits || [];
  return o;
}

// 旅帳側の「行った」とスポット帳側の訪問記録の食い違いは新しい更新時刻を正とする
function reconcileVisits() {
  Object.values(S.trips).forEach(trip => {
    let changed = false;
    trip.items.forEach(it => {
      if (!it.spotId) return;
      const sp = S.spots[it.spotId];
      if (!sp) return;
      it.nameCache = sp.name || it.nameCache;
      const remote = (sp.visits || []).find(v => v.tripId === trip.id);
      const local = it.visited;
      if (remote && (!local || (remote.at || '') > (local.at || ''))) {
        if (JSON.stringify(remote) !== JSON.stringify(local)) {
          it.visited = { date: remote.date, rating: Number(remote.rating) || 0, comment: remote.comment || '', companions: remote.companions || [], at: remote.at || '' };
          changed = true;
        }
      } else if (!remote && local && local.at && (sp.updatedAt || '') > local.at) {
        it.visited = null; changed = true;           // スポット帳側で取り消された
      }
    });
    if (changed) commitTrip(trip, { silent: true });
  });
}

// ---------------------------------------------------------------------------
// 保存：ローカルキャッシュ（オフライン可）→ サーバへ遅延保存（他端末更新の衝突検知つき）
// ---------------------------------------------------------------------------
function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      settings: S.settings, trips: S.trips, curTripId: S.curTripId, dirty: S.dirty, settingsDirty: S.settingsDirty, ui: { listSort: S.ui.listSort }
    }));
  } catch (e) { console.warn(e); }
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (!c) return false;
    S.settings = Object.assign(DEFAULT_SETTINGS(), c.settings || {});
    S.trips = c.trips || {};
    S.curTripId = c.curTripId || null;
    S.dirty = c.dirty || {};
    S.settingsDirty = !!c.settingsDirty;
    if (c.ui && c.ui.listSort) S.ui.listSort = c.ui.listSort;
    Object.values(S.trips).forEach(migrateTrip);
    return true;
  } catch (e) { return false; }
}
function migrateTrip(t) {
  const d = newTrip({});
  Object.keys(d).forEach(k => { if (t[k] === undefined) t[k] = clone(d[k]); });
  t.items = (t.items || []).map(i => Object.assign(newItem(), i));
  if (!t.record.days) t.record.days = {};
  return t;
}

function commitTrip(trip, opt) {
  opt = opt || {};
  S.trips[trip.id] = trip;
  // 精算チェック後の支出変更検知（どの画面で変えても）
  if (typeof reconcileSettlement === 'function') reconcileSettlement(trip);
  trip._rev = (trip._rev || 0) + 1;
  S.dirty[trip.id] = true;
  saveCache();
  queueSave();
  if (!opt.silent && !opt.noRender) render();
}
function commitSettings() {
  S.settingsDirty = true; saveCache(); queueSave(); render();
}

const queueSave = debounce(flushSaves, 900);
let saving = false;
async function flushSaves() {
  if (saving) { setTimeout(flushSaves, 800); return; }
  const ids = Object.keys(S.dirty);
  if (!ids.length && !S.settingsDirty) return;
  saving = true; setSync('saving');
  let failed = false;
  try {
    if (S.settingsDirty) {
      await api('saveSettings', { settings: S.settings });
      S.settingsDirty = false;
    }
    for (const id of ids) {
      const trip = S.trips[id];
      if (!trip) { delete S.dirty[id]; continue; }
      if (trip._deleted) {
        await api('deleteTrip', { id });
        delete S.trips[id]; delete S.dirty[id];
        continue;
      }
      const rev = trip._rev;
      const payload = stripPrivate(trip);
      const r = await api('saveTrip', { trip: payload, baseUpdatedAt: trip._base || '' });
      if (r.conflict) {
        const useMine = await confirmDialog(`「${trip.title}」は他の端末で更新されています。\n\nOK＝この端末の内容で上書き\nキャンセル＝他の端末の最新を読み込む`);
        if (useMine) {
          const r2 = await api('saveTrip', { trip: payload, force: true });
          trip.updatedAt = r2.updatedAt; trip._base = r2.updatedAt;
        } else {
          const t = migrateTrip(r.trip); t._base = t.updatedAt; S.trips[id] = t;
          delete S.dirty[id]; render(); continue;
        }
      } else {
        trip.updatedAt = r.updatedAt; trip._base = r.updatedAt;
      }
      // 保存中にさらに編集されていなければ dirty を外す
      if (S.trips[id] && S.trips[id]._rev === rev) delete S.dirty[id];
    }
  } catch (e) {
    failed = true; console.warn('save failed', e);
  }
  saving = false;
  saveCache();
  setSync(failed ? (navigator.onLine === false ? 'offline' : 'error') : 'ok');
}
function stripPrivate(trip) {
  const o = {};
  Object.keys(trip).forEach(k => { if (k[0] !== '_') o[k] = trip[k]; });
  return clone(o);
}
function setSync(s) {
  S.sync = s;
  const b = document.getElementById('syncBadge');
  if (!b) return;
  const label = { idle: '', saving: '⬆️ 保存中', ok: '☁️ 保存済', offline: '📴 オフライン（端末に保存）', error: '⚠️ 未保存・再試行します' }[s] || '';
  b.textContent = label;
  b.className = 'sync-badge sb-' + s;
}
window.addEventListener('online', () => { if (Object.keys(S.dirty).length || S.settingsDirty) flushSaves(); loadSpots(true); });
setInterval(() => { if ((Object.keys(S.dirty).length || S.settingsDirty) && !saving) flushSaves(); }, 60000);

async function bootstrapFromServer() {
  try {
    const r = await api('bootstrap');
    S.serverMock = !!r.mock;
    if (r.settings) {
      if (!S.settingsDirty) S.settings = Object.assign(DEFAULT_SETTINGS(), r.settings);
    } else {
      S.settingsDirty = true;
    }
    const serverIds = new Set();
    (r.trips || []).forEach(t => {
      serverIds.add(t.id);
      const local = S.trips[t.id];
      if (local && S.dirty[t.id]) return;   // 未送信のローカル変更を優先し、送信時に衝突判定
      const m = migrateTrip(t); m._base = m.updatedAt; S.trips[t.id] = m;
    });
    // サーバに無く、ローカルでも未送信でない旅は他端末で削除されたもの
    Object.keys(S.trips).forEach(id => { if (!serverIds.has(id) && !S.dirty[id]) delete S.trips[id]; });
    if (S.curTripId && !S.trips[S.curTripId]) S.curTripId = null;
    saveCache();
    setSync(Object.keys(S.dirty).length || S.settingsDirty ? 'saving' : 'ok');
    if (Object.keys(S.dirty).length || S.settingsDirty) flushSaves();
  } catch (e) {
    setSync(navigator.onLine === false ? 'offline' : 'error');
    toast('サーバに接続できません。端末に保存された内容で表示しています');
  }
}

function pickDefaultTrip() {
  if (S.curTripId && S.trips[S.curTripId] && !S.trips[S.curTripId]._deleted) return;
  const list = Object.values(S.trips).filter(t => !t._deleted);
  const order = ['旅行中', '確定', '計画中', '精算・記録中', '検討中'];
  for (const st of order) {
    const c = list.filter(t => tripStatus(t) === st).sort((a, b) => (a.startDate || '9') < (b.startDate || '9') ? -1 : 1);
    if (c.length) { S.curTripId = c[0].id; return; }
  }
  S.curTripId = list[0] ? list[0].id : null;
}

// ---- 04_schedule.js ----
// ============================================================================
// 04 営業時間の解釈・工程計算・警告・絵文字の連続位置
// ============================================================================
const WD_CHARS = '日月火水木金土';

function daysFromSpec(spec) {
  const out = new Set();
  if (!spec) return out;
  if (/毎日|全日|年中/.test(spec)) { for (let i = 0; i < 7; i++) out.add(i); return out; }
  if (/平日/.test(spec)) [1, 2, 3, 4, 5].forEach(d => out.add(d));
  if (/土日/.test(spec)) { out.add(0); out.add(6); }
  spec = spec.replace(/平日|土日|祝日?|休日|営業日?|定休日?/g, ' ');
  const re = /([日月火水木金土])(?:曜日?)?\s*(?:[-~〜～ー–－]\s*([日月火水木金土])(?:曜日?)?)?/g;
  let m;
  while ((m = re.exec(spec))) {
    const a = WD_CHARS.indexOf(m[1]);
    if (m[2]) {
      const b = WD_CHARS.indexOf(m[2]);
      let i = a; for (let k = 0; k < 7; k++) { out.add(i); if (i === b) break; i = (i + 1) % 7; }
    } else out.add(a);
  }
  return out;
}

function parseTimeRanges(seg) {
  const out = [];
  const re = /(\d{1,2})(?:[:時](\d{2})?分?)?\s*[-~〜～ー–—－]\s*(翌)?(\d{1,2})(?:[:時](\d{2})?分?)?/g;
  let m;
  while ((m = re.exec(seg))) {
    const h1 = Number(m[1]), h2 = Number(m[4]);
    if (h1 > 30 || h2 > 30) continue;
    let a = h1 * 60 + Number(m[2] || 0);
    let b = h2 * 60 + Number(m[5] || 0);
    if (m[3]) b += 1440;
    if (b <= a) b += 1440;
    out.push([a, b]);
  }
  return out;
}

// 営業時間：テキスト（例「9:00-17:00 水曜定休」「平日10:00-18:00／土日9:00-17:00」）または
// 構造化 {0:[["09:00","17:00"]], ...} / {mon:"9:00-17:00", ...} を週次マップに正規化
function parseHours(src) {
  const res = { week: [null, null, null, null, null, null, null], text: '', irregular: false, known: false };
  if (src == null || src === '') return res;
  if (typeof src === 'object') {
    const keyMap = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
    Object.keys(src).forEach(k => {
      const d = /^\d$/.test(k) ? Number(k) : keyMap[String(k).toLowerCase()];
      if (d == null) return;
      const v = src[k];
      let ranges = [];
      if (v === false || v === null || v === 'closed' || v === '定休') ranges = [];
      else if (typeof v === 'string') ranges = parseTimeRanges(v.normalize('NFKC'));
      else if (Array.isArray(v)) ranges = v.map(r => { const a = toMin(r[0]), b = toMin(r[1]); return [a, b <= a ? b + 1440 : b]; });
      res.week[d] = ranges; res.known = true;
    });
    res.text = Object.keys(src).map(k => k + ':' + JSON.stringify(src[k])).join(' ');
    return res;
  }
  let t = String(src).normalize('NFKC');
  res.text = t;
  if (/不定休/.test(t)) res.irregular = true;
  const closed = new Set();
  const closeRes = [
    /定休日?\s*[:：]?\s*((?:[日月火水木金土](?:曜日?)?[\s・、,と及び~〜～\-]*)+)/g,
    /((?:[日月火水木金土](?:曜日?)?[\s・、,と]*)+)(?:定休|休業|休館|休み|休(?!憩))/g
  ];
  closeRes.forEach(re => {
    let m; while ((m = re.exec(t))) daysFromSpec(m[1]).forEach(d => closed.add(d));
  });
  let body = t.replace(closeRes[0], ' ').replace(closeRes[1], ' ');
  if (/24時間/.test(body)) {
    for (let i = 0; i < 7; i++) res.week[i] = closed.has(i) ? [] : [[0, 1440]];
    res.known = true; return res;
  }
  const segs = body.split(/[\n\/／;；|]|、(?=\s*(?:平日|土日|[日月火水木金土]曜|[日月火水木金土]\s*[-~〜～]))/);
  let def = null; const spec = {};
  segs.forEach(seg => {
    const ranges = parseTimeRanges(seg);
    if (!ranges.length) return;
    const firstDigit = seg.search(/\d/);
    const head = firstDigit > 0 ? seg.slice(0, firstDigit) : '';
    const days = daysFromSpec(head);
    if (days.size) days.forEach(d => { spec[d] = (spec[d] || []).concat(ranges); });
    else def = (def || []).concat(ranges);
  });
  for (let d = 0; d < 7; d++) {
    if (closed.has(d)) res.week[d] = [];
    else if (spec[d]) res.week[d] = spec[d];
    else if (def) res.week[d] = def;
  }
  res.known = res.week.some(w => w !== null);
  if (closed.size && !res.known) res.known = true;
  return res;
}

function hoursOn(hours, date) { return hours.week[weekday(date)]; }
// 'open' | 'closed'(定休) | 'unknown'
function dayAvailability(hours, date) {
  const r = hoursOn(hours, date);
  if (r === null) return hours.irregular ? 'unknown' : (hours.known ? 'unknown' : 'unknown');
  return r.length ? 'open' : 'closed';
}
function rangesLabel(r) { return r.map(x => fmtMinLabel(x[0]) + '–' + fmtMinLabel(x[1])).join(', '); }
function dayHoursLabel(hours, date) {
  const r = hoursOn(hours, date);
  if (r === null) return hours.text ? '要確認' : '情報なし';
  if (!r.length) return '定休日';
  return rangesLabel(r) + (hours.irregular ? '（不定休あり）' : '');
}
// ある日時点の状態と閉店までの残り
function openStateAt(hours, date, minute) {
  const r = hoursOn(hours, date);
  // 前日の深夜営業分
  const prev = hours.week[(weekday(date) + 6) % 7];
  if (prev && prev.some(x => x[1] > 1440 && minute < x[1] - 1440)) {
    const x = prev.find(x => x[1] > 1440 && minute < x[1] - 1440);
    return { state: 'open', closeIn: x[1] - 1440 - minute };
  }
  if (r === null) return { state: 'unknown' };
  if (!r.length) return { state: 'closed' };
  const cur = r.find(x => minute >= x[0] && minute < x[1]);
  if (cur) return { state: 'open', closeIn: cur[1] - minute, closeAt: cur[1] };
  const next = r.filter(x => x[0] > minute).sort((a, b) => a[0] - b[0])[0];
  if (next) return { state: 'before', opensAt: next[0], opensIn: next[0] - minute };
  return { state: 'after' };
}
function withinHours(hours, date, a, b) {
  const r = hoursOn(hours, date);
  if (r === null) return null;
  if (!r.length) return false;
  return r.some(x => a >= x[0] && b <= x[1]);
}

// ---------------------------------------------------------------------------
// 工程（しおり）計算
// ---------------------------------------------------------------------------
function isScheduled(it, trip) {
  if (!it.date || it.hiddenTime) return false;
  if (trip && trip.startDate) {
    const days = tripDays(trip);
    if (!days.includes(it.date)) return false;
  }
  return true;
}
function dayItems(trip, date) {
  return trip.items.filter(it => it.date === date && isScheduled(it, trip)).sort((a, b) => a.order - b.order);
}
function unscheduledItems(trip) {
  return trip.items.filter(it => !isScheduled(it, trip));
}

function daySchedule(trip, date) {
  const items = dayItems(trip, date);
  const dayStart = toMin(S.settings.dayStart) || 540;
  const rows = [];
  let cursor = null, prevEnd = null;
  items.forEach((it, i) => {
    const manualStart = toMin(it.start);
    let start;
    if (i === 0) start = manualStart != null ? manualStart : dayStart;
    else if ((it.locked || it.startManual) && manualStart != null) start = manualStart;
    else start = cursor;
    const stay = Math.max(0, num(it.stay, 0));
    const end = start + stay;
    const move = it.moveAfter != null && it.moveAfter !== '' ? num(it.moveAfter, 0) : 0;
    const info = itemInfo(trip, it);
    const warns = [];
    if (i > 0 && cursor != null && start < cursor - 0.5) {
      if (it.locked) warns.push({ lv: 'err', t: `間に合いません（${Math.round(cursor - start)}分不足）` });
      else warns.push({ lv: 'warn', t: `前の予定と${Math.round(cursor - start)}分重なり` });
    }
    if (i > 0 && prevEnd != null && start < prevEnd - 0.5 && !(cursor != null && start < cursor - 0.5)) warns.push({ lv: 'warn', t: '時間が重なっています' });
    if (it.kind !== 'move') {
      const r = hoursOn(info.hours, date);
      if (r !== null) {
        if (!r.length) warns.push({ lv: 'err', t: '定休日です' });
        else if (withinHours(info.hours, date, start, Math.max(end, start + 1)) === false) warns.push({ lv: 'warn', t: '営業時間外（' + rangesLabel(r) + '）' });
      } else if (info.hours.irregular) warns.push({ lv: 'info', t: '不定休あり・要確認' });
    }
    if (it.needsBooking) {
      const b = it.bookingId && trip.bookings.find(x => x.id === it.bookingId);
      if (!b || b.status !== '予約済') warns.push({ lv: 'warn', t: '要予約（未予約）' });
    }
    if (info.deleted) warns.push({ lv: 'info', t: 'スポット帳で削除済み' });
    rows.push({ it, info, start, end, stay, move, suggested: i === 0 ? null : cursor, warns, index: i });
    prevEnd = end;
    cursor = end + move;
  });
  return rows;
}

// 線全体を時間軸として、現在時刻がどの区間（滞在＋移動の時間枠）の何％かを返す
function progressOnRows(rows, nowMin) {
  if (!rows.length) return null;
  const n = rows.length;
  if (nowMin < rows[0].start) return { index: 0, frac: 0, state: 'before', minsTo: rows[0].start - nowMin };
  for (let i = 0; i < n; i++) {
    const s = rows[i].start;
    const e = i < n - 1 ? rows[i + 1].start : rows[i].end;
    if (nowMin >= s && nowMin < e) {
      const frac = e > s ? (nowMin - s) / (e - s) : 1;
      const staying = nowMin < rows[i].end;
      return { index: i, frac: clamp(frac, 0, 1), state: staying ? 'stay' : 'move', remain: staying ? rows[i].end - nowMin : e - nowMin };
    }
  }
  return { index: n - 1, frac: 1, state: 'after' };
}

// 予約（時刻あり）→ しおりの固定枠として工程に入れる
function syncBookingItems(trip) {
  let changed = false;
  trip.bookings.forEach(b => {
    let it = trip.items.find(x => x.bookingId === b.id);
    const hasTime = b.date && b.time && b.status !== 'キャンセル';
    if (!hasTime) {
      if (it && it.fromBooking) { trip.items = trip.items.filter(x => x !== it); changed = true; }
      else if (it && it.locked && b.status === 'キャンセル') { it.locked = false; changed = true; }
      return;
    }
    if (!it) {
      it = newItem({ kind: b.type === '交通' ? 'move' : 'fixed', fromBooking: true, bookingId: b.id, name: b.title, spotId: b.spotId || null, nameCache: b.title, stay: num(b.durationMin, 60), order: 0 });
      if (b.type === '交通') it.transport = { mode: b.transportMode || '', from: b.place || '', to: b.placeTo || '', number: b.number || '', platform: '' };
      trip.items.push(it);
      changed = true;
    }
    const fields = { date: b.date, start: b.time, locked: true, startManual: true };
    if (it.fromBooking) Object.assign(fields, { name: b.title, nameCache: b.title, spotId: b.spotId || it.spotId, stay: num(b.durationMin, it.stay || 60) });
    Object.keys(fields).forEach(k => { if (it[k] !== fields[k]) { it[k] = fields[k]; changed = true; } });
    if (it.hiddenTime && trip.mode === 'shiori') { it.hiddenTime = null; changed = true; }
    if (it.fromBooking && it._placed !== b.date + b.time) { placeByTime(trip, it); it._placed = b.date + b.time; changed = true; }
  });
  // 削除された予約から作られた枠を掃除
  const ids = new Set(trip.bookings.map(b => b.id));
  const before = trip.items.length;
  trip.items = trip.items.filter(x => !(x.fromBooking && !ids.has(x.bookingId)));
  trip.items.forEach(x => { if (x.bookingId && !ids.has(x.bookingId)) { x.bookingId = null; x.locked = false; } });
  return changed || before !== trip.items.length;
}

// 時刻に合わせて工程の並び位置（order）を決める
function placeByTime(trip, it) {
  const sameDay = dayItems(trip, it.date).filter(x => x !== it);
  const rows = daySchedule(Object.assign({}, trip, { items: sameDay }), it.date);
  const t = toMin(it.start);
  let order;
  const after = rows.filter(r => r.start <= t);
  const nextRow = rows.find(r => r.start > t);
  if (!after.length) order = (nextRow ? nextRow.it.order : Date.now()) - 1000;
  else if (!nextRow) order = after[after.length - 1].it.order + 1000;
  else order = (after[after.length - 1].it.order + nextRow.it.order) / 2;
  it.order = order;
}

function reorderDay(trip, date, ids) {
  ids.forEach((id, i) => { const it = trip.items.find(x => x.id === id); if (it) it.order = (i + 1) * 1000; });
}

// ---- 05_money.js ----
// ============================================================================
// 05 お金：支出の統合・割り勘・精算・多通貨・実効レート・家計簿連携
// ============================================================================
function newMoney(trip, o) {
  const me = meMember(trip);
  return Object.assign({
    amount: null, currency: trip.currency || 'JPY', rate: 1, rateAuto: true,
    payer: me ? me.id : null, split: trip.members.map(m => m.id), solo: false,
    method: 'cash', payState: '支払済', cardJpy: null
  }, o || {});
}
function payMethod(id) { return (S.settings.payMethods || []).find(p => p.id === id) || null; }
function isCardMethod(id) { const p = payMethod(id); return !!(p && p.isCard); }
function isCashMethod(id) { const p = payMethod(id); return id === 'cash' || !!(p && (p.isCash || p.name === '現金')); }

function participants(trip, m) {
  const ids = new Set(trip.members.map(x => x.id));
  if (m.solo) return m.payer && ids.has(m.payer) ? [m.payer] : [];
  const sp = (m.split || []).filter(id => ids.has(id));
  return sp.length ? sp : trip.members.map(x => x.id);
}

// 支出・予約の事前支払い・給油を1本の明細リストに統合（予約・給油は自動で流れ、二重入力させない）
function allExpenses(trip) {
  const out = [];
  trip.expenses.forEach(e => out.push({ key: 'e:' + e.id, source: 'expense', ref: e, date: e.date, desc: e.desc || '（内容なし）', cat: e.cat || 'その他', memo: e.memo || '', money: e.money }));
  trip.bookings.forEach(b => {
    if (b.status === 'キャンセル' || !b.money || b.money.amount == null || b.money.amount === '') return;
    out.push({ key: 'b:' + b.id, source: 'booking', ref: b, date: b.payDate || b.date || trip.startDate || todayStr(), desc: (BOOKING_ICON[b.type] || '') + ' ' + (b.title || '予約') + '（事前支払い）', cat: BOOKING_TO_EXPENSE_CAT[b.type] || 'その他', memo: b.memo || '', money: b.money });
  });
  trip.fuel.forEach(f => {
    if (!f.money || f.money.amount == null || f.money.amount === '') return;
    out.push({ key: 'f:' + f.id, source: 'fuel', ref: f, date: f.date, desc: '⛽ 給油' + (f.liters ? ' ' + f.liters + 'L' : '') + (f.station ? '（' + f.station + '）' : ''), cat: '給油', memo: f.memo || '', money: f.money });
  });
  out.sort((a, b) => (a.date || '') < (b.date || '') ? -1 : (a.date || '') > (b.date || '') ? 1 : 0);
  return out;
}

function settleUnit(trip) { return Math.pow(10, curDec(trip.currency)); }
function toSettle(trip, m) {
  const amt = num(m.amount, 0);
  const rate = m.currency === trip.currency ? 1 : num(m.rate, 1);
  return Math.round(amt * rate * settleUnit(trip)); // 最小通貨単位の整数
}

// 1件の割り勘：割り切れない端数は払った人が負担し、その人の負担額に乗る
function sharesOf(trip, m) {
  const total = toSettle(trip, m);
  const ps = participants(trip, m);
  const shares = {};
  if (!ps.length) return { total, shares, ps };
  const sign = total < 0 ? -1 : 1;
  const abs = Math.abs(total);
  const base = Math.floor(abs / ps.length);
  const rem = abs - base * ps.length;
  ps.forEach(id => { shares[id] = sign * base; });
  if (rem) shares[m.payer] = (shares[m.payer] || 0) + sign * rem;
  return { total, shares, ps, remainder: rem };
}
function perPersonPreview(trip, m) {
  const ps = participants(trip, m);
  if (!ps.length || m.amount == null || m.amount === '') return null;
  const amt = num(m.amount, 0);
  const cur = m.currency || trip.currency;
  const p = Math.pow(10, curDec(cur));
  const tot = Math.round(amt * p);
  const base = Math.floor(Math.abs(tot) / ps.length);
  const rem = Math.abs(tot) - base * ps.length;
  return { n: ps.length, each: base / p, rem: rem / p, cur, solo: !!m.solo || ps.length === 1 };
}

function computeBalances(trip) {
  const unit = settleUnit(trip);
  const ex = allExpenses(trip);
  const bal = {};
  trip.members.forEach(m => { bal[m.id] = { paid: 0, owed: 0, paidItems: [], owedItems: [] }; });
  ex.forEach(e => {
    const { total, shares } = sharesOf(trip, e.money);
    if (bal[e.money.payer]) {
      bal[e.money.payer].paid += total;
      bal[e.money.payer].paidItems.push({ e, total, others: total - (shares[e.money.payer] || 0) });
    }
    Object.keys(shares).forEach(id => {
      if (!bal[id]) return;
      bal[id].owed += shares[id];
      bal[id].owedItems.push({ e, share: shares[id], self: id === e.money.payer });
    });
  });
  Object.values(bal).forEach(b => { b.diff = b.paid - b.owed; });
  return { bal, unit, ex };
}

// 受け取り最大の人へ、払う側を大きい順に当てる（送金回数を最小化、n人で最大n−1回）
function computeTransfers(trip) {
  const { bal, unit } = computeBalances(trip);
  const cred = [], debt = [];
  Object.keys(bal).forEach(id => {
    const d = bal[id].diff;
    if (d > 0) cred.push({ id, v: d });
    else if (d < 0) debt.push({ id, v: -d });
  });
  const out = [];
  let guard = 0;
  while (cred.length && debt.length && guard++ < 100) {
    cred.sort((a, b) => b.v - a.v);
    debt.sort((a, b) => b.v - a.v);
    const c = cred[0], d = debt[0];
    const v = Math.min(c.v, d.v);
    out.push({ from: d.id, to: c.id, amount: v / unit, key: d.id + '>' + c.id });
    c.v -= v; d.v -= v;
    if (!c.v) cred.shift();
    if (!d.v) debt.shift();
  }
  return { transfers: out, bal, unit };
}

// 精算済みチェック後に支出が変わったらリセットして再計算した旨を出す
function reconcileSettlement(trip) {
  const { transfers } = computeTransfers(trip);
  const sig = hashStr(transfers.map(t => t.key + ':' + t.amount).join('|') + '#' + trip.currency);
  const st = trip.settlement || (trip.settlement = { signature: '', transfers: {}, notice: '' });
  if (st.signature !== sig) {
    const hadChecks = Object.values(st.transfers || {}).some(x => x.checked || x.actualRecv != null || x.actualPaid != null);
    if (st.signature && hadChecks) {
      st.transfers = {};
      st.notice = '支出が変更されたため精算を再計算しました（精算済みチェックをリセットしました）';
    }
    st.signature = sig;
    return { transfers, changed: true };
  }
  return { transfers, changed: false };
}
function transferState(trip, t) {
  const st = (trip.settlement.transfers || {})[t.key] || {};
  const rcv = st.actualRecv != null && st.actualRecv !== '' ? convert(num(st.actualRecv), st.actualRecvCur || trip.currency, trip.currency) : null;
  const pay = st.actualPaid != null && st.actualPaid !== '' ? convert(num(st.actualPaid), st.actualPaidCur || trip.currency, trip.currency) : null;
  const basis = rcv != null ? rcv : pay;
  const remain = basis != null ? roundCur(Math.max(0, t.amount - basis), trip.currency) : t.amount;
  const adjust = basis != null ? roundCur(basis - t.amount, trip.currency) : 0;
  return { st, rcv, pay, remain, adjust };
}
function settlementComplete(trip) {
  const { transfers } = computeTransfers(trip);
  if (!transfers.length) return true;
  return transfers.every(t => ((trip.settlement.transfers || {})[t.key] || {}).checked);
}

// 通貨換算（市場レート。S.fx.toJpy：1単位が何円か）
function marketToJpy(cur) {
  if (cur === 'JPY') return 1;
  return S.fx && S.fx.toJpy && S.fx.toJpy[cur] ? S.fx.toJpy[cur] : null;
}
function convert(v, from, to) {
  if (from === to) return v;
  const a = marketToJpy(from), b = marketToJpy(to);
  if (a == null || b == null) return v;
  return v * a / b;
}
function settleToJpy(trip) {
  if (trip.currency === 'JPY') return 1;
  return num(trip.settleJpyRate, 0) || marketToJpy(trip.currency) || null;
}

// ---------------------------------------------------------------------------
// 実効レート：（両替で払った円 − 戻して得た円 − 繰越分×取得レート）÷ 使った外貨現金
// ---------------------------------------------------------------------------
function foreignCurrencies(trip) {
  const set = new Set();
  allExpenses(trip).forEach(e => { if (e.money.currency && e.money.currency !== 'JPY') set.add(e.money.currency); });
  trip.exchanges.forEach(x => { if (x.currency && x.currency !== 'JPY') set.add(x.currency); });
  return [...set];
}
function cashUsedForeign(trip, cur) {
  const me = meMember(trip);
  return sum(allExpenses(trip).filter(e => e.money.currency === cur && e.money.payer === (me && me.id) && isCashMethod(e.money.method) && e.money.payState !== '現地で払う予定'), e => num(e.money.amount, 0));
}
function effectiveRate(trip, cur) {
  const xs = trip.exchanges.filter(x => x.currency === cur);
  const buys = xs.filter(x => x.dir === 'buy'), sells = xs.filter(x => x.dir === 'sell');
  const jpyBuy = sum(buys, x => num(x.jpy)), fBuy = sum(buys, x => num(x.amount));
  const jpySell = sum(sells, x => num(x.jpy)), fSell = sum(sells, x => num(x.amount));
  const used = cashUsedForeign(trip, cur);
  const close = (trip.fxClose || {})[cur] || 'open';
  const buyRate = fBuy ? jpyBuy / fBuy : null;
  const left = fBuy - fSell - used;
  const r = { cur, jpyBuy, fBuy, jpySell, fSell, used, close, buyRate, left, rate: null, final: false, note: '' };
  if (!fBuy) { r.note = '両替の記録がありません'; r.rate = marketToJpy(cur); return r; }
  if (!used) { r.note = '外貨現金の支出がまだありません'; r.rate = buyRate; return r; }
  if (close === 'open') { r.rate = buyRate; r.note = '暫定（両替レート）。戻し両替を入力して確定してください'; return r; }
  const carry = close === 'carry' ? Math.max(0, left) : 0;
  r.carry = carry;
  r.rate = (jpyBuy - jpySell - carry * buyRate) / used;
  r.final = true;
  if (close === 'returned' && Math.abs(left) > 0.009) r.note = '外貨の残高が ' + fmtMoney(left, cur) + ' 合いません（戻し両替・支出の入力漏れ？）';
  return r;
}

// ---------------------------------------------------------------------------
// 家計簿へ送る明細：自分の負担分だけを支出明細ごとに。自分がカードで払った分は
// 「支出＝引落額（全額）」＋「収入＝割り勘分（自分以外の負担分）」の2本
// ---------------------------------------------------------------------------
function kakeiboEntries(trip) {
  const me = meMember(trip);
  if (!me) return [];
  const out = [];
  const stj = settleToJpy(trip);
  const tag = '#' + trip.title;
  const usage = S.settings.kakeiboUsage, budget = S.settings.kakeiboBudget;
  allExpenses(trip).forEach(e => {
    const m = e.money;
    const { total, shares } = sharesOf(trip, m);
    const unit = settleUnit(trip);
    const myS = (shares[me.id] || 0);
    const iPaid = m.payer === me.id;
    const row = { e, entries: [], disabled: '', note: '' };
    const memo = e.desc.replace(/（事前支払い）/, '') + ' ' + tag;
    const date = e.date || trip.startDate || todayStr();
    const sentInfo = e.ref.kakeibo || null;
    if (m.payState === '現地で払う予定') row.disabled = '未払い（現地で払う予定）';
    if (!iPaid && !myS) return;
    if (iPaid && isCardMethod(m.method)) {
      const pm = payMethod(m.method);
      let full = m.currency === 'JPY' ? num(m.amount) : (m.cardJpy != null && m.cardJpy !== '' ? num(m.cardJpy) : null);
      if (full == null) { row.disabled = row.disabled || 'カード明細の円額（引落額）を入力してください'; full = 0; }
      const ratio = total ? myS / total : 1;
      const others = Math.round(full * (1 - ratio));
      row.entries.push({ sourceKey: e.key + ':exp', date, amount: -Math.round(full), memo, category: pm ? pm.kakeiboCategory : 'その他（支出）', usage, budget, tag, kind: '支出（引落額）' });
      if (others > 0) row.entries.push({ sourceKey: e.key + ':inc', date, amount: others, memo: memo + '（割り勘分）', category: S.settings.kakeiboIncomeCategory || '割り勘', usage: '', budget: '精算・移動', tag, kind: '収入（割り勘分）' });
      row.note = 'カード払い：引落額 ' + fmtMoney(full) + '／自分の負担 ' + fmtMoney(full - others);
    } else {
      let jpy;
      if (iPaid && m.currency !== 'JPY' && isCashMethod(m.method)) {
        const er = effectiveRate(trip, m.currency);
        const myForeign = total ? num(m.amount) * myS / total : 0;
        if (!er.final) { row.disabled = row.disabled || '外貨現金：戻し両替（または繰越）を入力して実効レートを確定してから送れます'; }
        jpy = er.rate ? Math.round(myForeign * er.rate) : 0;
        row.note = '実効レート ' + (er.rate ? er.rate.toFixed(3) : '—') + '円/' + m.currency + (er.final ? '' : '（暫定）');
      } else if (iPaid && m.currency !== 'JPY' && !isCashMethod(m.method)) {
        // 現金でもカードでもない外貨払い（電子決済など）：引落円額があれば比率で
        if (m.cardJpy != null && m.cardJpy !== '') jpy = Math.round(num(m.cardJpy) * (total ? myS / total : 1));
        else { jpy = stj ? Math.round(myS / unit * stj) : 0; row.note = '市場レート換算'; }
      } else {
        jpy = stj ? Math.round(myS / unit * stj) : 0;
        if (!stj) row.disabled = row.disabled || '精算通貨の円換算レートがありません';
      }
      if (!jpy && !row.disabled) return;
      const pm = iPaid ? payMethod(m.method) : null;
      row.entries.push({ sourceKey: e.key + ':exp', date, amount: -jpy, memo, category: pm ? pm.kakeiboCategory : (S.settings.kakeiboSettleCategory || 'その他（支出）'), usage, budget, tag, kind: iPaid ? '支出（自分の負担分）' : '支出（立替てもらった自分の負担分）' });
    }
    const sig = hashStr(JSON.stringify(row.entries.map(x => [x.sourceKey, x.amount, x.date, x.category])));
    row.sig = sig;
    row.sent = sentInfo;
    row.changedAfterSend = !!(sentInfo && sentInfo.sig !== sig);
    out.push(row);
  });
  return out;
}

function budgetSummary(trip) {
  const ex = allExpenses(trip);
  const unit = settleUnit(trip);
  const byCat = {};
  EXPENSE_CATS.forEach(c => byCat[c] = 0);
  let total = 0, planned = 0;
  ex.forEach(e => {
    const v = toSettle(trip, e.money) / unit;
    byCat[e.cat] = (byCat[e.cat] || 0) + v;
    total += v;
    if (e.money.payState === '現地で払う予定') planned += v;
  });
  const budget = trip.budget != null && trip.budget !== '' ? num(trip.budget) : null;
  return { total, byCat, planned, budget, remain: budget != null ? budget - total : null };
}

function totalDistance(trip) {
  return sum(trip.odometer || [], o => (o.arrive != null && o.depart != null && o.arrive !== '' && o.depart !== '') ? Math.max(0, num(o.arrive) - num(o.depart)) : 0);
}

// 電卓パッド
function openCalculator(input) {
  let expr = input.value ? String(input.value) : '';
  const keys = ['C', '⌫', '(', ')', '7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '00', '.', '+'];
  openModal(`<div class="calc">
    <div class="calc-expr" id="calcExpr"></div><div class="calc-res" id="calcRes"></div>
    <div class="calc-keys">${keys.map(k => `<button class="ck ${/[÷×−+]/.test(k) ? 'op' : ''} ${k === 'C' ? 'clr' : ''}" data-k="${k}">${k}</button>`).join('')}</div>
    <button class="btn primary block" id="calcOk">＝ この金額にする</button></div>`, {
    title: '🧮 電卓', cls: 'calc-modal',
    onMount(body) {
      const ex = $('#calcExpr', body), rs = $('#calcRes', body);
      const upd = () => {
        ex.textContent = expr || '0';
        try { const v = evalExpr(expr); rs.textContent = '= ' + v.toLocaleString('ja-JP', { maximumFractionDigits: 4 }); rs.classList.remove('err'); }
        catch (e) { rs.textContent = '…'; rs.classList.add('err'); }
      };
      upd();
      $$('.ck', body).forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.k;
        if (k === 'C') expr = '';
        else if (k === '⌫') expr = expr.slice(0, -1);
        else expr += k;
        upd();
      }));
      $('#calcOk', body).addEventListener('click', () => {
        try {
          const v = evalExpr(expr);
          input.value = Math.round(v * 10000) / 10000;
          closeModal();
          input.dispatchEvent(new Event('input', { bubbles: true }));
        } catch (e) { toast(e.message); }
      });
    }
  });
}

// ---------------------------------------------------------------------------
// 為替・天気・経路のキャッシュ取得
// ---------------------------------------------------------------------------
let fxPromise = null;
function ensureFx(force) {
  if (S.fx && !force && Date.now() - (S.fx._t || 0) < 3600e3) return Promise.resolve(S.fx);
  if (fxPromise) return fxPromise;
  fxPromise = api('fxRates').then(r => { S.fx = { toJpy: r.toJpy, at: r.at, _t: Date.now(), mock: r.mock }; fxPromise = null; return S.fx; })
    .catch(e => { fxPromise = null; return S.fx; });
  return fxPromise;
}
const weatherPending = {};
function weatherKey(p) { return p.lat.toFixed(1) + ',' + p.lng.toFixed(1); }
function weatherFor(p, date) {
  if (!p || p.lat == null) return null;
  const k = weatherKey(p);
  const w = S.weatherCache[k];
  if (!w) { requestWeather([p]); return undefined; }
  return w.find(x => x.date === date) || null;
}
const requestWeather = (() => {
  let queue = [];
  const flush = debounce(async () => {
    const pts = queue.filter(p => !S.weatherCache[weatherKey(p)] && !weatherPending[weatherKey(p)]);
    queue = [];
    const uniq = {}; pts.forEach(p => { uniq[weatherKey(p)] = { lat: Math.round(p.lat * 10) / 10, lng: Math.round(p.lng * 10) / 10 }; });
    const list = Object.values(uniq).slice(0, 20);
    if (!list.length) return;
    list.forEach(p => weatherPending[weatherKey(p)] = true);
    try {
      const r = await api('weather', { points: list });
      Object.keys(r.weather || {}).forEach(k => { S.weatherCache[k] = r.weather[k]; });
      render();
    } catch (e) { /* 天気は任意 */ }
    list.forEach(p => delete weatherPending[weatherKey(p)]);
  }, 300);
  return (pts) => { queue = queue.concat(pts); flush(); };
})();
function weatherHTML(w) {
  if (w === undefined) return '<span class="muted small">天気…</span>';
  if (!w) return '';
  return `<span class="wx">${WEATHER_ICON(w.code)} ${Math.round(w.tmax)}°/${Math.round(w.tmin)}°${w.pop != null ? ' ☔' + w.pop + '%' : ''}</span>`;
}

// 経路（サーバ側 Maps）。結果はキャッシュし、無い間は直線距離からの概算を表示
function routeKey(from, to, mode, opt) {
  const r = (v) => Math.round(v * 200) / 200;
  return [r(from.lat), r(from.lng), r(to.lat), r(to.lng), mode, opt && opt.highway === false ? 'nh' : 'h', opt && opt.toll === false ? 'nt' : 't'].join('|');
}
const routePending = {};
function routeFor(from, to, mode, opt) {
  if (!from || !to || from.lat == null || to.lat == null) return null;
  const k = routeKey(from, to, mode, opt);
  if (S.routeCache[k]) return S.routeCache[k];
  const km = haversineKm(from, to);
  requestRoutes([{ from, to, mode, opt, k }]);
  return { km: Math.round(km * 1.35 * 10) / 10, min: estimateMinutes(km, mode), estimated: true, pending: true };
}
const requestRoutes = (() => {
  let queue = [];
  const flush = debounce(async () => {
    const list = queue.filter(q => !S.routeCache[q.k] && !routePending[q.k]).slice(0, 25);
    queue = [];
    if (!list.length) return;
    list.forEach(q => routePending[q.k] = true);
    try {
      const r = await api('routes', { list: list.map(q => ({ from: { lat: q.from.lat, lng: q.from.lng }, to: { lat: q.to.lat, lng: q.to.lng }, mode: q.mode, opt: q.opt })) });
      (r.results || []).forEach((res, i) => { if (res) S.routeCache[list[i].k] = res; });
      render();
    } catch (e) { /* 概算のまま */ }
    list.forEach(q => delete routePending[q.k]);
  }, 400);
  return (qs) => { queue = queue.concat(qs); flush(); };
})();

// しおり：隣り合う工程の移動時間を自動計算（手動上書きしたものは除く）
async function autoMoveTimes(trip, date, force) {
  const items = dayItems(trip, date);
  const mode = trip.vehicles.includes('car') ? 'car' : (trip.vehicles[0] || 'car');
  const qs = [];
  for (let i = 0; i < items.length - 1; i++) {
    const a = items[i], b = items[i + 1];
    if (!force && !a.moveAuto) continue;
    const pa = itemPoint(trip, a), pb = itemPoint(trip, b);
    if (!pa || !pb) continue;
    qs.push({ a, from: pa, to: pb });
  }
  if (!qs.length) return;
  try {
    const r = await api('routes', { list: qs.map(q => ({ from: q.from, to: q.to, mode, opt: { highway: trip.listTransport.highway, toll: trip.listTransport.toll } })) });
    (r.results || []).forEach((res, i) => {
      if (!res) return;
      const a = qs[i].a;
      a.moveAfter = Math.ceil(res.min / 5) * 5;
      a.moveAuto = true;
      a.moveInfo = { km: res.km, min: res.min, mode, estimated: !!res.estimated, toll: res.toll || null };
    });
    commitTrip(trip);
  } catch (e) { toast('移動時間の自動計算に失敗：' + e.message); }
}

  }

// ---------------------------------------------------------------------------
// モード切替（どちらの向きでもデータは失われない）
//  しおり→リスト：時刻情報は保持したまま隠す（固定枠・予約は日時が決まっているので工程に残る）
//  リスト→しおり：スポットは「未配置」プールへ。保持していた時刻はワンタップで復元できる
// ---------------------------------------------------------------------------
function switchMode(trip, mode) {
  if (trip.mode === mode) return;
  if (mode === 'list') {
    trip.items.forEach(it => {
      if (it.date && !it.hiddenTime && !it.locked) {
        it.hiddenTime = { date: it.date, start: it.start, startManual: it.startManual, order: it.order };
      }
    });
  }
  trip.mode = mode;
}
function restoreHiddenTime(trip, it) {
  if (!it.hiddenTime) return;
  Object.assign(it, { date: it.hiddenTime.date, start: it.hiddenTime.start, startManual: it.hiddenTime.startManual, order: it.hiddenTime.order });
  it.hiddenTime = null;
}

function positionEmoji() {
  const tl = $('#timeline');
  if (!tl || !S._tlRows) return;
  const rowsEl = $$('.tl-row', tl);
  if (!rowsEl.length) return;
  const base = tl.getBoundingClientRect().top;
  const ys = rowsEl.map(r => { const d = $('.tl-dot', r).getBoundingClientRect(); return d.top + d.height / 2 - base; });
  const yEnd = rowsEl[rowsEl.length - 1].getBoundingClientRect().bottom - base - 6;
  const line = $('#tlLine'); line.style.top = ys[0] + 'px'; line.style.height = Math.max(0, yEnd - ys[0]) + 'px';
  const em = $('#tlEmoji'), fill = $('#tlFill'), stEl = $('#tlStatus');
  if (!em) { fill.style.height = '0px'; stEl.textContent = ''; return; }
  const rows = S._tlRows.rows;
  const p = progressOnRows(rows, nowMinutes());
  if (!p) return;
  const i = p.index;
  const y1 = ys[i], y2 = i < ys.length - 1 ? ys[i + 1] : yEnd;
  const y = y1 + (y2 - y1) * p.frac;
  em.style.top = y + 'px';
  fill.style.top = ys[0] + 'px'; fill.style.height = Math.max(0, y - ys[0]) + 'px';
  const name = rows[i].info.name;
  stEl.innerHTML = p.state === 'before' ? `出発前：最初の予定まで ${fmtDuration(p.minsTo)}`
    : p.state === 'stay' ? `いま <b>${esc(name)}</b> に滞在中（残り ${fmtDuration(p.remain)}）`
    : p.state === 'move' ? `<b>${esc(rows[i + 1] ? rows[i + 1].info.name : '')}</b> へ移動中（到着予定まで ${fmtDuration(p.remain)}）`
    : '本日の工程はすべて終了しました';
}

function sortListItems(trip, list) {
  const o = originPoint(trip);
  const today = todayStr(), nm = nowMinutes();
  const dist = it => { const p = itemPoint(trip, it); return p && o ? haversineKm(o, p) : 9e9; };
  const closing = it => {
    const s = openStateAt(itemInfo(trip, it).hours, today, nm);
    if (s.state === 'open') return s.closeIn;
    if (s.state === 'before') return 5000 + s.opensIn;
    return 9e9;
  };
  const pri = it => (itemInfo(trip, it).priority || it.priority) === 'must' ? 0 : 1;
  const arr = list.slice();
  if (S.ui.listSort === 'closing') arr.sort((a, b) => closing(a) - closing(b) || dist(a) - dist(b));
  else if (S.ui.listSort === 'priority') arr.sort((a, b) => pri(a) - pri(b) || dist(a) - dist(b));
  else arr.sort((a, b) => dist(a) - dist(b) || pri(a) - pri(b));
  return arr;
}

    <button class="btn sm" data-act="driveTarget" data-id="${it.id}">🚩 次に行く</button>
  </div></div>`;
  return h;

let MAP = null, mapLayer = null, mapSig = '';
function ensureMap() {
  if (typeof L === 'undefined') { const el = $('#leafletMap'); if (el && !el.dataset.msg) { el.innerHTML = '<div class="map-fallback">地図を読み込めません（オフライン？）</div>'; el.dataset.msg = 1; } return null; }
  if (!MAP) {
    MAP = L.map('leafletMap', { zoomControl: false, attributionControl: true }).setView([34.86, 136.45], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(MAP);
    mapLayer = L.layerGroup().addTo(MAP);
  }
  return MAP;
}
function updateMap(trip) {
  const ov = $('#mapOverlay');
  if (ov) ov.innerHTML = `<button class="map-btn" data-act="transportModal">${VEHICLES[trip.listTransport.mode].icon} 乗り物設定</button>
    <button class="map-btn" data-act="mapFit">⤢</button>`;
  const map = ensureMap(); if (!map) return;
  setTimeout(() => map.invalidateSize(), 50);
  mapLayer.clearLayers();
  const day = shioriDay(trip);
  const pts = [];
  if (day) {
    const rows = daySchedule(trip, day);
    const line = [];
    rows.forEach((r, i) => {
      const p = itemPoint(trip, r.it); if (!p) return;
      line.push([p.lat, p.lng]); pts.push([p.lat, p.lng]);
      L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'mk', html: `<span class="mk-num ${r.it.visited ? 'done' : ''}">${i + 1}</span>`, iconSize: [26, 26], iconAnchor: [13, 13] }) })
        .bindPopup(`<b>${esc(r.info.name)}</b><br>${fromMin(r.start)}〜${fromMin(r.end)}`).addTo(mapLayer);
    });
    if (line.length > 1) L.polyline(line, { color: '#6366f1', weight: 4, opacity: 0.75 }).addTo(mapLayer);
  }
  unscheduledItems(trip).forEach(it => {
    const p = itemPoint(trip, it); if (!p) return;
    pts.push([p.lat, p.lng]);
    const must = it.priority === 'must';
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'mk', html: `<span class="mk-pin ${it.visited ? 'done' : must ? 'must' : ''}">${it.visited ? '✓' : must ? '★' : '•'}</span>`, iconSize: [20, 20], iconAnchor: [10, 10] }) })
      .bindPopup(`<b>${esc(itemInfo(trip, it).name)}</b>`).addTo(mapLayer);
  });
  if (S.geo) L.circleMarker([S.geo.lat, S.geo.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#2563eb', fillOpacity: 1 }).addTo(mapLayer);
  const sig = trip.id + day + JSON.stringify(pts);
  if (sig !== mapSig) {
    mapSig = sig;
    if (pts.length === 1) map.setView(pts[0], 13);
    else if (pts.length) map.fitBounds(pts, { padding: [24, 24], maxZoom: 14 });
    else if (trip.origin && trip.origin.lat != null) map.setView([trip.origin.lat, trip.origin.lng], 10);
  }
}
ACT.mapFit = () => { mapSig = ''; updateMap(curTrip()); };

  const tmpl = PACK_TEMPLATE.map(([cat, name, when]) => ({ cat, name, when })).concat(S.settings.packCustom || []);
  let added = 0;
  tmpl.forEach(x => {
    if (!ok(x.when || 'all')) return;
    if (trip.packing.some(p => p.name === x.name)) return;

}
function renderPacking(trip) {

    <div class="row gap wrap mt"><select id="pkKind">${[['day', '日帰り'], ['one', '1泊'], ['multi', '2泊以上']].map(([v, l]) => `<option value="${v}" ${packTemplateKind(trip) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>

    h += `<div class="pack-cat"><div class="row between"><b>${PACK_ICON[cat]} ${cat}</b><span class="muted small">${items.filter(i => i.done).length}/${items.length}</span></div>

        <label class="check grow"><input type="checkbox" data-change="packToggle" data-id="${p.id}" ${p.done ? 'checked' : ''}> ${esc(p.name)}</label>
        <select class="owner" data-change="packOwner" data-id="${p.id}"><option value="">誰の？</option>${trip.members.map(m => `<option value="${m.id}" ${p.owner === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}<option value="all" ${p.owner === 'all' ? 'selected' : ''}>共用</option></select>
        <button class="op" data-act="packDel" data-id="${p.id}">✕</button></div>`).join('')}
      <div class="row gap"><input class="grow pack-new" data-cat="${cat}" placeholder="＋ 追加"><button class="btn sm" data-act="packAdd" data-cat="${cat}">追加</button></div></div>`;

ACT.packGen = () => { const t = curTrip(); const n = generatePacking(t, $('#pkKind').value, $('#pkCar').checked); commitTrip(t); toast(n + '件追加しました'); };

// ---- 09_drive.js ----
// ============================================================================
// 09 ドライブタブ：次の目的地・出発カウントダウン・ナビ・走行距離・給油・駐車場
//    車以外の旅では次の駅・空港・港の情報表示に切り替わる
// ============================================================================
function driveCandidates(trip) {
  const today = todayStr();
  const days = tripDays(trip);
  let rows = [];
  // 今日（旅行中）→ 今後の工程、旅行前 → 1日目の工程
  const day = days.includes(today) ? today : (days.find(d => d >= today) || days[0]);
  if (day) rows = daySchedule(trip, day).map(r => Object.assign({ day }, r));
  const now = day === today ? nowMinutes() : -1;
  const sched = rows.filter(r => !r.it.visited && (day !== today || r.end > now));
  const list = sortListItems(trip, unscheduledItems(trip).filter(i => !i.visited)).map(it => ({ it, info: itemInfo(trip, it), start: null, day: null }));
  return { day, sched, list, all: sched.concat(list) };
}
function renderDrive(trip) {
  const c = driveCandidates(trip);
  let target = null;
  if (trip.driveTargetId) target = c.all.find(x => x.it.id === trip.driveTargetId) || null;
  if (!target) target = c.all[0] || null;
  const carTrip = hasVehicle(trip, 'car');
  let h = '';
  if (!carTrip) h += renderTransit(trip, c);
  if (target && carTrip) h += driveTargetCard(trip, target, c);
  else if (!target && carTrip) h += emptyHTML('🚗', '次の目的地がありません。しおりやリストにスポットを入れてください。');
  if (carTrip) {
    // 車旅でも次の移動が船・飛行機などなら案内を出す
    const tr = c.sched.find(r => r.it.kind === 'move' && r.it.transport && r.it.transport.mode !== 'car');
    if (tr) h += transitCard(trip, tr);
    h += odometerCard(trip);
    h += fuelCard(trip);
  } else if (target) {
    h += `<div class="card"><div class="muted small">次に行くスポット</div><div class="h2">${esc(target.info.name)}</div>
      <a class="btn primary block mt" href="${mapsDirUrl(itemPoint(trip, target.it) || target.info, 'train')}" target="_blank" rel="noopener">🧭 乗換案内（Googleマップ）</a></div>`;
  }
  return h;
}
function driveTargetCard(trip, t, c) {
  const p = itemPoint(trip, t.it);
  const o = S.geo ? { lat: S.geo.lat, lng: S.geo.lng, name: '現在地' } : originPoint(trip);
  const r = p && o ? routeFor(o, p, 'car', trip.listTransport) : null;
  const margin = num(S.settings.departMarginMin, 10);
  let cd = '';
  if (t.start != null && r) {
    const dep = t.start - r.min - margin;
    const at = parseYmd(t.day).getTime() + dep * 60000;
    cd = `<div class="countdown"><div class="muted small">出発まで（${fromMin(t.start)}着 − 所要${r.estimated ? '約' : ''}${fmtDuration(r.min)} − 余裕${margin}分）</div>
      <div class="cd-big" id="cdown" data-at="${at}">--:--</div><div class="muted small">出発目安 ${fmtDate(t.day)} ${fmtMinLabel(dep)}</div></div>`;
  }
  const idx = c.all.indexOf(t);
  const next2 = c.all[idx + 1];
  const info = t.info;
  return `<div class="card drive-main">
    <div class="row between"><span class="muted small">${t.start != null ? '次の目的地（' + fmtDate(t.day) + ' ' + fromMin(t.start) + '〜）' : '次に行く（リストから）'}</span>
      <span class="row gap"><button class="btn sm" data-act="drivePrev" ${idx <= 0 ? 'disabled' : ''}>◀</button><button class="btn sm" data-act="driveNext" ${idx >= c.all.length - 1 ? 'disabled' : ''}>▶</button></span></div>
    <div class="drive-name">${esc(info.name)}</div>
    <div class="muted">${esc(info.address || '')}</div>
    ${r ? `<div class="drive-route">🚗 ${fmtKm(r.km)}・${r.estimated ? '約' : ''}${fmtDuration(r.min)}${r.toll ? '・高速 約' + fmtMoney(r.toll) : ''}<span class="muted small">（${esc(o.name)}から）</span></div>` : (p ? '' : '<div class="warn-box small">座標がないためナビ・所要時間を出せません</div>')}
    ${cd}
    <a class="btn primary xl block" href="${p ? mapsDirUrl(p, 'car') : mapsSearchUrl(info)}" target="_blank" rel="noopener">🧭 ナビ開始</a>
    <div class="row gap mt"><button class="btn grow" data-act="driveArrived" data-id="${t.it.id}">✅ 着いた（行った）</button></div>
    <div class="park"><div class="b">🅿️ 駐車場</div>
      <div class="muted small">${info.parking === true ? 'スポット帳：駐車場あり' : info.parking === false ? 'スポット帳：駐車場なし' : info.parking ? 'スポット帳：' + esc(info.parking) : 'スポット帳：情報なし'}</div>
      <textarea rows="2" data-change="parkMemo" data-id="${t.it.id}" placeholder="駐車場メモ（場所・料金・停めた位置など）">${esc(t.it.parkingMemo || '')}</textarea></div>
    ${next2 ? `<div class="next-mini">その次：<b>${esc(next2.info.name)}</b>${next2.start != null ? ' ' + fromMin(next2.start) + '〜' : ''}</div>` : ''}
  </div>`;
}
ACT.driveNext = () => shiftDrive(1);
ACT.drivePrev = () => shiftDrive(-1);
function shiftDrive(d) {
  const t = curTrip(); const c = driveCandidates(t);
  let idx = c.all.findIndex(x => x.it.id === t.driveTargetId); if (idx < 0) idx = 0;
  const n = c.all[clamp(idx + d, 0, c.all.length - 1)];
  if (n) { t.driveTargetId = n.it.id; commitTrip(t); }
}
ACT.driveArrived = async (el) => {

};
ON_CHANGE.parkMemo = (el) => { const t = curTrip(); const it = t.items.find(i => i.id === el.dataset.id); it.parkingMemo = el.value; commitTrip(t, { noRender: true }); toast('駐車場メモを保存しました'); };

setInterval(() => {
  const el = document.getElementById('cdown');
  if (!el) return;
  const ms = Number(el.dataset.at) - Date.now();
  if (ms <= 0) { el.textContent = ms > -3600e3 ? '出発時刻です！' : '出発時刻を過ぎています'; el.classList.add('late'); return; }
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  el.textContent = (h ? h + ':' : '') + pad2(m) + ':' + pad2(ss);
  el.classList.toggle('soon', ms < 15 * 60000);
}, 1000);

// ---- 車以外：次の駅・空港・港 ----
function nextTransport(trip, c) {
  const moves = c.sched.filter(r => r.it.kind === 'move');
  if (moves.length) return moves[0];
  const bk = trip.bookings.filter(b => b.type === '交通' && b.status !== 'キャンセル' && b.date && (b.date > todayStr() || (b.date === todayStr() && toMin(b.time || '23:59') > nowMinutes())))
    .sort((a, b) => (a.date + (a.time || '')) < (b.date + (b.time || '')) ? -1 : 1)[0];
  if (bk) return { it: { kind: 'move', transport: { mode: bk.transportMode || 'train', from: bk.place, to: bk.placeTo, number: bk.number }, bookingId: bk.id, id: 'bk' }, info: { name: bk.title }, start: toMin(bk.time), day: bk.date };
  return null;
}
function renderTransit(trip, c) {

  if (!t) return `<div class="card"><div class="b">🚃 次の移動</div><div class="muted small">工程に「移動」か、予約に「交通」を入れると、次の駅・空港・港の情報がここに出ます。</div></div>`;

}

// ---- 走行距離（出発／到着のメーター） ----

  const today = days.includes(todayStr()) ? todayStr() : (days[0] || todayStr());
  const rec = (trip.odometer || []).find(o => o.date === today) || { date: today, depart: '', arrive: '' };
  const dist = rec.arrive !== '' && rec.depart !== '' && rec.arrive != null && rec.depart != null ? num(rec.arrive) - num(rec.depart) : null;
  return `<div class="card"><div class="row between"><b>🛣 走行距離（${fmtDate(today)}）</b><span class="muted small">旅の合計 ${totalDistance(trip).toLocaleString()}km</span></div>
    <div class="form-grid">
      <label>出発メーター</label><div class="row gap"><input inputmode="numeric" data-change="odo" data-f="depart" data-d="${today}" value="${esc(rec.depart)}" placeholder="km"><span>km</span></div>
      <label>到着メーター</label><div class="row gap"><input inputmode="numeric" data-change="odo" data-f="arrive" data-d="${today}" value="${esc(rec.arrive)}" placeholder="km"><span>km</span></div>
    </div>${dist != null ? `<div class="b">この日の走行：${dist.toLocaleString()}km</div>` : ''}
    ${(trip.odometer || []).filter(o => o.date !== today).map(o => `<div class="muted small">${fmtDate(o.date)}：${o.depart || '—'} → ${o.arrive || '—'}km</div>`).join('')}</div>`;

function fxCalcCardHTML(trip, inModal) {

}

ACT.fxDetect = async (el) => {

  try {

  h += `<div class="card"><b>👥 メンバーごとの集計</b><table class="tbl"><tr><th>メンバー</th><th>払った合計</th><th>負担合計</th><th>差額</th></tr>

      <div class="form-grid small">

        <label>実受取額</label><div class="row gap"><input inputmode="decimal" data-change="txAmt" data-f="actualRecv" data-key="${t.key}" value="${s.st.actualRecv != null ? esc(s.st.actualRecv) : ''}" placeholder="${t.amount}"><select data-change="txAmt" data-f="actualRecvCur" data-key="${t.key}">${currencyOptions(s.st.actualRecvCur || cur)}</select></div>
      </div>

    <div class="bd-row total"><span>${esc(memberName(trip, t.to))}さんの受け取り合計</span><span>${fmtMoney(B.diff / unit, cur)}</span></div>

function renderKakeibo(trip) {
