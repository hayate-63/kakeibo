ACT.msAdd = async () => {
  const b = topModalBody(); const m = topModal(); const { trip, target } = m.data;
  const name = $('#msName', b).value.trim();
  if (!name) return toast('名前を入れてください');
  const lat = $('#msLat', b).value !== '' ? num($('#msLat', b).value, null) : null;
  const lng = $('#msLng', b).value !== '' ? num($('#msLng', b).value, null) : null;
  const o = {
    name, nameCache: name, address: $('#msAddr', b).value.trim(), lat, lng, hoursText: $('#msHours', b).value.trim(),
    stayEst: $('#msStay', b).value ? num($('#msStay', b).value) : null, priceEst: $('#msPrice', b).value ? num($('#msPrice', b).value) : null,
    priority: $('#msPri', b).value
  };
  if ($('#msReg', b).checked) {
    try {
      const r = await api('spotCreate', { spot: { name, address: o.address, lat, lng, hours: o.hoursText, stayMin: o.stayEst, price: o.priceEst, priority: o.priority, status: 'want', area: trip.area || '' } });
      const sp = normalizeSpot(r.spot); S.spots[sp.id] = sp;
      o.spotId = sp.id;
      toast('スポット帳にも登録しました');
    } catch (e) { toast('スポット帳への登録に失敗（旅帳だけに追加します）：' + e.message); }
  }
  addSpotItem(trip, o, target);
  closeModal();
};

function addSpotItem(trip, o, target) {
  const it = newItem(o);
  const info = itemInfo(trip, it);
  it.stay = info.stay || 60;
  if (target && target.date) {
    it.date = target.date;
    const last = dayItems(trip, target.date).slice(-1)[0];
    it.order = last ? last.order + 1000 : 1000;
  }
  trip.items.push(it);
  commitTrip(trip);
  if (target && target.date) autoMoveTimes(trip, target.date);
  return it;
}

// ---------------------------------------------------------------------------
// 「行った」：スポット帳の訪問記録（visits）へ即時書き戻し、取り消しも即時
//   スポット帳 v3.1 と同じく 訪問日＋評価（😫😞😐😋🤩）が必須。旅帳は作った visit_id を覚えておく
// ---------------------------------------------------------------------------
const RATING_FACES = ['', '😫', '😞', '😐', '😋', '🤩'];
const RATING_LABELS = ['', 'もう行かない', 'いまいち', 'ふつう', 'よかった', '最高'];
function faceHTML(n) { return n ? `<span title="${RATING_LABELS[n]}">${RATING_FACES[n]}</span>` : '<span class="muted small">評価なし</span>'; }
function faceButtonsHTML(sel, act) {
  return `<div class="faces">${[1, 2, 3, 4, 5].map(n => `<button class="face ${n === sel ? 'on' : ''}" data-act="${act}" data-v="${n}">${RATING_FACES[n]}<small>${RATING_LABELS[n]}</small></button>`).join('')}</div>`;
}
async function markVisited(trip, it, visit) {
  const prev = it.visited;
  const v = Object.assign({ date: todayStr(), rating: 0, comment: '', companions: trip.members.map(m => m.name), people: trip.members.length }, prev || {}, visit || {}, { at: new Date().toISOString() });
  if (prev && prev.visitId) v.visitId = prev.visitId;
  it.visited = v;
  commitTrip(trip);
  if (!it.spotId) return;
  try {
    const r = await api('spotSetVisited', { spotId: it.spotId, visitId: v.visitId || '', visit: v });
    if (r.visitId) it.visited.visitId = r.visitId;
    if (r.spot) S.spots[it.spotId] = normalizeSpot(r.spot);
    it._visitPending = false;
    commitTrip(trip, { noRender: true });
  } catch (e) {
    toast('スポット帳への書き戻しに失敗：' + e.message + '（旅帳には記録済み・次回再送）');
    it._visitPending = true; commitTrip(trip, { noRender: true });
  }
}
async function unmarkVisited(trip, it) {
  const v = it.visited;
  if (it.spotId && v && v.visitId) {
    try {
      const r = await api('spotSetVisited', { spotId: it.spotId, visitId: v.visitId, visit: null });
      if (r.spot) S.spots[it.spotId] = normalizeSpot(r.spot);
    } catch (e) { toast(e.message); return; }   // 取り消せなかった時は旅帳側も「行った」のまま
  }
  it.visited = null; it._visitPending = false;
  commitTrip(trip);
  toast('「行った」を取り消しました');
}
// 書き戻し失敗分の再送
async function retryVisitWrites() {
  for (const trip of Object.values(S.trips)) {
    for (const it of trip.items.filter(i => i._visitPending && i.spotId && i.visited)) {
      try {
        const r = await api('spotSetVisited', { spotId: it.spotId, visitId: it.visited.visitId || '', visit: it.visited });
        if (r.visitId) it.visited.visitId = r.visitId;
        it._visitPending = false; commitTrip(trip, { noRender: true });
      } catch (e) { return; }
    }
  }
}

let fxPromise = null;
function ensureFx(force) {
  if (S.fx && !force && Date.now() - (S.fx._t || 0) < 3600e3) return Promise.resolve(S.fx);
  if (fxPromise) return fxPromise;
  fxPromise = api('fxRates').then(r => { S.fx = { toJpy: r.toJpy, at: r.at, _t: Date.now(), mock: r.mock }; fxPromise = null; return S.fx; })
    .catch(e => { fxPromise = null; return S.fx; });
  return fxPromise;
}
const weatherPending = {};
function weatherKey(p) { return p.lat.toFixed(1) + ',' + p.lng.toFixed(1); }
function weatherFor(p, date) {
  if (!p || p.lat == null) return null;
  const k = weatherKey(p);
  const w = S.weatherCache[k];
  if (!w) { requestWeather([p]); return undefined; }
  return w.find(x => x.date === date) || null;
}
const requestWeather = (() => {
  let queue = [];
  const flush = debounce(async () => {
    const pts = queue.filter(p => !S.weatherCache[weatherKey(p)] && !weatherPending[weatherKey(p)]);
    queue = [];
    const uniq = {}; pts.forEach(p => { uniq[weatherKey(p)] = { lat: Math.round(p.lat * 10) / 10, lng: Math.round(p.lng * 10) / 10 }; });
    const list = Object.values(uniq).slice(0, 20);
    if (!list.length) return;
    list.forEach(p => weatherPending[weatherKey(p)] = true);
    try {
      const r = await api('weather', { points: list });
      Object.keys(r.weather || {}).forEach(k => { S.weatherCache[k] = r.weather[k]; });
      render();
    } catch (e) { /* 天気は任意 */ }
    list.forEach(p => delete weatherPending[weatherKey(p)]);
  }, 300);
  return (pts) => { queue = queue.concat(pts); flush(); };
})();
function weatherHTML(w) {
  if (w === undefined) return '<span class="muted small">天気…</span>';
  if (!w) return '';
  return `<span class="wx">${WEATHER_ICON(w.code)} ${Math.round(w.tmax)}°/${Math.round(w.tmin)}°${w.pop != null ? ' ☔' + w.pop + '%' : ''}</span>`;
}

// 経路（サーバ側 Maps）。結果はキャッシュし、無い間は直線距離からの概算を表示
function routeKey(from, to, mode, opt) {
  const r = (v) => Math.round(v * 200) / 200;
  return [r(from.lat), r(from.lng), r(to.lat), r(to.lng), mode, opt && opt.highway === false ? 'nh' : 'h', opt && opt.toll === false ? 'nt' : 't'].join('|');
}
const routePending = {};
function routeFor(from, to, mode, opt) {
  if (!from || !to || from.lat == null || to.lat == null) return null;
  const k = routeKey(from, to, mode, opt);
  if (S.routeCache[k]) return S.routeCache[k];
  const km = haversineKm(from, to);
  requestRoutes([{ from, to, mode, opt, k }]);
  return { km: Math.round(km * 1.35 * 10) / 10, min: estimateMinutes(km, mode), estimated: true, pending: true };
}
const requestRoutes = (() => {
  let queue = [];
  const flush = debounce(async () => {
    const list = queue.filter(q => !S.routeCache[q.k] && !routePending[q.k]).slice(0, 25);
    queue = [];
    if (!list.length) return;
    list.forEach(q => routePending[q.k] = true);
    try {
      const r = await api('routes', { list: list.map(q => ({ from: { lat: q.from.lat, lng: q.from.lng }, to: { lat: q.to.lat, lng: q.to.lng }, mode: q.mode, opt: q.opt })) });
      (r.results || []).forEach((res, i) => { if (res) S.routeCache[list[i].k] = res; });
      render();
    } catch (e) { /* 概算のまま */ }
    list.forEach(q => delete routePending[q.k]);
  }, 400);
  return (qs) => { queue = queue.concat(qs); flush(); };
})();

// しおり：隣り合う工程の移動時間を自動計算（手動上書きしたものは除く）
async function autoMoveTimes(trip, date, force) {
  const items = dayItems(trip, date);
  const mode = trip.vehicles.includes('car') ? 'car' : (trip.vehicles[0] || 'car');
  const qs = [];
  for (let i = 0; i < items.length - 1; i++) {
    const a = items[i], b = items[i + 1];
    if (!force && !a.moveAuto) continue;
    const pa = itemPoint(trip, a), pb = itemPoint(trip, b);
    if (!pa || !pb) continue;
    qs.push({ a, from: pa, to: pb });
  }
  if (!qs.length) return;
  try {
    const r = await api('routes', { list: qs.map(q => ({ from: q.from, to: q.to, mode, opt: { highway: trip.listTransport.highway, toll: trip.listTransport.toll } })) });
    (r.results || []).forEach((res, i) => {
      if (!res) return;
      const a = qs[i].a;
      a.moveAfter = Math.ceil(res.min / 5) * 5;
      a.moveAuto = true;
      a.moveInfo = { km: res.km, min: res.min, mode, estimated: !!res.estimated, toll: res.toll || null };
    });
    commitTrip(trip);
  } catch (e) { toast('移動時間の自動計算に失敗：' + e.message); }
}

function currentTripCard(trip) {
  const st = tripStatus(trip);
  const today = todayStr();
  const days = tripDays(trip);
  let when = '日程未定';
  if (trip.startDate) {
    const d = diffDays(today, trip.startDate);
    if (st === '旅行中') when = `旅行中 ${days.indexOf(today) + 1}日目／${days.length}日`;
    else if (d > 0) when = `出発まで あと${d}日`;
    else when = fmtDate(trip.startDate) + (isDayTrip(trip) ? '（日帰り）' : '〜' + fmtDate(trip.endDate));
  }
  const pend = pendingBookingCount(trip);
  const pk = trip.packing.length ? Math.round(trip.packing.filter(p => p.done).length / trip.packing.length * 100) : null;
  const bs = budgetSummary(trip);
  const canComplete = (st === '精算・記録中' || st === '旅行中') && settlementComplete(trip) && trip.record.done;
  let warnings = '';
  if (pend) warnings += `<div class="alert warn" data-act="goBookings">⚠️ 未予約が <b>${pend}件</b> あります（しおりで「要予約」にしたもの）</div>`;
  const conflicts = trip.startDate ? days.reduce((n, d) => n + daySchedule(trip, d).filter(r => r.warns.some(w => w.lv === 'err')).length, 0) : 0;
  if (conflicts) warnings += `<div class="alert err" data-act="goTab" data-tab="shiori">⛔ 工程に問題が ${conflicts}件（間に合わない・定休日など）</div>`;
  if (trip.settlement.notice) warnings += `<div class="alert info" data-act="goTab" data-tab="money">ℹ️ ${esc(trip.settlement.notice)}</div>`;
  if (canComplete) warnings += `<div class="alert ok">🎉 精算と記録が揃いました。<b>完了にできます</b> <button class="btn sm primary" data-act="tripComplete">完了にする</button></div>`;
  else if (st === '精算・記録中') {
    const need = [];
    if (!settlementComplete(trip)) need.push('精算');
    if (!trip.record.done) need.push('記録完了チェック');
    warnings += `<div class="alert info">📝 完了まで：${need.join('・')}</div>`;
  }
  const next = st === '旅行中' ? nextScheduled(trip) : null;
  return `<div class="card cur-trip">
    <div class="row between"><div class="row gap"><span class="trip-emoji big">${esc(tripEmoji(trip))}</span>
      <div><div class="h2">${esc(trip.title)}</div><div class="muted small">${esc(when)}</div></div></div>
      ${statusBadge(st)}</div>
    <div class="meta-grid">
      <div>🗓 ${trip.startDate ? fmtDateFull(trip.startDate) + (isDayTrip(trip) ? '' : ' 〜 ' + fmtDateFull(trip.endDate)) : '未定'}</div>
      <div>👥 ${trip.members.map(m => esc(m.name) + (m.isMe ? '👤' : '')).join('・')}</div>
      <div>${trip.vehicles.map(v => VEHICLES[v].icon + VEHICLES[v].label).join(' ')} ・ ${trip.mode === 'shiori' ? '📒 しおり' : '📝 リスト'}</div>
      ${trip.area ? `<div>📍 ${esc(trip.area)}</div>` : ''}
      ${bs.budget != null ? `<div>💰 予算 ${fmtMoney(bs.budget, trip.currency)} ／ 実績 ${fmtMoney(bs.total, trip.currency)}</div>` : (bs.total ? `<div>💰 支出 ${fmtMoney(bs.total, trip.currency)}</div>` : '')}
      ${pk != null ? `<div>🎒 持ち物 ${pk}%</div>` : ''}
    </div>
    ${next ? `<div class="next-mini" data-act="goTab" data-tab="drive">次：<b>${esc(next.info.name)}</b> ${fromMin(next.start)}〜</div>` : ''}
    ${warnings}
    <div class="row gap mt wrap">
      <button class="btn" data-act="tripEdit">✏️ 編集</button>

    </div>
    ${trip.memo ? `<div class="memo">${esc(trip.memo)}</div>` : ''}

//  リスト→しおり：スポットは「未配置」プールへ。保持していた時刻はワンタップで復元できる

function switchMode(trip, mode) {
  if (trip.mode === mode) return;
  if (mode === 'list') {
    trip.items.forEach(it => {
      if (it.date && !it.hiddenTime && !it.locked) {
        it.hiddenTime = { date: it.date, start: it.start, startManual: it.startManual, order: it.order };
      }
    });
  }
  trip.mode = mode;
}
function restoreHiddenTime(trip, it) {
  if (!it.hiddenTime) return;
  Object.assign(it, { date: it.hiddenTime.date, start: it.hiddenTime.start, startManual: it.hiddenTime.startManual, order: it.hiddenTime.order });
  it.hiddenTime = null;
}

function positionEmoji() {
  const tl = $('#timeline');
  if (!tl || !S._tlRows) return;
  const rowsEl = $$('.tl-row', tl);
  if (!rowsEl.length) return;
  const base = tl.getBoundingClientRect().top;
  const ys = rowsEl.map(r => { const d = $('.tl-dot', r).getBoundingClientRect(); return d.top + d.height / 2 - base; });
  const yEnd = rowsEl[rowsEl.length - 1].getBoundingClientRect().bottom - base - 6;
  const line = $('#tlLine'); line.style.top = ys[0] + 'px'; line.style.height = Math.max(0, yEnd - ys[0]) + 'px';
  const em = $('#tlEmoji'), fill = $('#tlFill'), stEl = $('#tlStatus');
  if (!em) { fill.style.height = '0px'; stEl.textContent = ''; return; }
  const rows = S._tlRows.rows;
  const p = progressOnRows(rows, nowMinutes());
  if (!p) return;
  const i = p.index;
  const y1 = ys[i], y2 = i < ys.length - 1 ? ys[i + 1] : yEnd;
  const y = y1 + (y2 - y1) * p.frac;
  em.style.top = y + 'px';
  fill.style.top = ys[0] + 'px'; fill.style.height = Math.max(0, y - ys[0]) + 'px';
  const name = rows[i].info.name;
  stEl.innerHTML = p.state === 'before' ? `出発前：最初の予定まで ${fmtDuration(p.minsTo)}`
    : p.state === 'stay' ? `いま <b>${esc(name)}</b> に滞在中（残り ${fmtDuration(p.remain)}）`
    : p.state === 'move' ? `<b>${esc(rows[i + 1] ? rows[i + 1].info.name : '')}</b> へ移動中（到着予定まで ${fmtDuration(p.remain)}）`
    : '本日の工程はすべて終了しました';
}

function sortListItems(trip, list) {
  const o = originPoint(trip);
  const today = todayStr(), nm = nowMinutes();
  const dist = it => { const p = itemPoint(trip, it); return p && o ? haversineKm(o, p) : 9e9; };
  const closing = it => {
    const s = openStateAt(itemInfo(trip, it).hours, today, nm);
    if (s.state === 'open') return s.closeIn;
    if (s.state === 'before') return 5000 + s.opensIn;
    return 9e9;
  };
  const pri = it => (itemInfo(trip, it).priority || it.priority) === 'must' ? 0 : 1;
  const arr = list.slice();
  if (S.ui.listSort === 'closing') arr.sort((a, b) => closing(a) - closing(b) || dist(a) - dist(b));
  else if (S.ui.listSort === 'priority') arr.sort((a, b) => pri(a) - pri(b) || dist(a) - dist(b));
  else arr.sort((a, b) => dist(a) - dist(b) || pri(a) - pri(b));
  return arr;
}

  let h = `<div class="lcard ${pri === 'must' ? 'must' : ''}" data-id="${it.id}">
    <div class="lc-head"><div class="grow lc-title" data-act="editItem" data-id="${it.id}">
      ${it.kind === 'fixed' ? '📌 ' : ''}${esc(info.name)} ${info.deleted ? '<span class="tag gray">スポット帳で削除済み</span>' : ''}${!p ? '<span class="tag gray">座標なし</span>' : ''}${it.hiddenTime ? `<span class="tag">🕘 保持中 ${fmtDate(it.hiddenTime.date)} ${esc(it.hiddenTime.start || '')}</span>` : ''}</div>
      <button class="pri ${pri}" data-act="togglePri" data-id="${it.id}">${pri === 'must' ? '⭐ 絶対行きたい' : '☆ 行けたら'}</button></div>`;
  // ② 今日行けるか＋閉店まで
  const sNow = openStateAt(info.hours, today, nowMinutes());
  const todayLabel = sNow.state === 'open' ? `<span class="ok">今日 営業中・閉店まであと${fmtDuration(sNow.closeIn)}</span>`
    : sNow.state === 'before' ? `<span class="warn">今日 ${fmtMinLabel(sNow.opensAt)}開店（あと${fmtDuration(sNow.opensIn)}）</span>`
    : sNow.state === 'after' ? '<span class="ng">今日の営業は終了</span>'
    : sNow.state === 'closed' ? '<span class="ng">今日は定休日</span>' : '<span class="muted">今日の営業：情報なし</span>';
  h += `<div class="lc-line">${todayLabel}</div>`;
  // ① 行ける日バッジ＋期間中の営業時間
  if (days.length) {
    h += `<div class="lc-line day-badges">${days.map(d => { const a = dayAvailability(info.hours, d); return `<span class="dbadge ${a}">${fmtDate(d, false)} ${a === 'open' ? '○' : a === 'closed' ? '×' : '?'}</span>`; }).join('')}</div>`;
    const labels = days.map(d => dayHoursLabel(info.hours, d));
    const same = labels.every(l => l === labels[0]);
    h += `<div class="lc-line small">🕘 期間中の営業時間：${same ? esc(labels[0]) : days.map((d, i) => fmtDate(d) + ' ' + esc(labels[i])).join(' ／ ')}</div>`;
  } else if (info.hoursText) h += `<div class="lc-line small">🕘 ${esc(info.hoursText)}</div>`;
  // 距離・所要時間（乗り物はモーダル指定）
  if (p && o) {
    const r = routeFor(o, p, tr.mode, tr);
    h += `<div class="lc-line">${VEHICLES[tr.mode].icon} ${esc(o.name)}から <b>${fmtKm(r.km)}</b>・<b>${r.estimated ? '約' : ''}${fmtDuration(r.min)}</b>${tr.mode === 'car' && r.toll ? ` ・高速 約${fmtMoney(r.toll)}` : ''}${tr.mode === 'train' && r.fare ? ` ・運賃 ${r.estimated ? '約' : ''}${fmtMoney(r.fare)}` : ''}</div>`;
  }
  // ④ スポット同士の距離
  if (p) {
    const others = trip.items.filter(x => x !== it && !x.visited).map(x => ({ x, q: itemPoint(trip, x) })).filter(o2 => o2.q).map(o2 => ({ ...o2, km: haversineKm(p, o2.q) })).sort((a, b) => a.km - b.km);
    if (others.length) {
      const n = others[0];
      h += `<div class="lc-line small">↔️ 近くのスポット：${esc(itemInfo(trip, n.x).name)} ${fmtKm(n.km * 1.3)}・約${fmtDuration(estimateMinutes(n.km, tr.mode))}</div>`;
    }
  }
  // ⑤ 滞在目安・料金目安 ⑥ 駐車場／最寄り駅 ⑦ 天気
  const extra = [];
  if (info.stay) extra.push('⏳ 滞在目安 ' + fmtDuration(info.stay));
  if (info.price != null && info.price !== '') extra.push('💴 ' + (info.price ? '約' + fmtMoney(info.price) : '無料'));
  if (tr.mode === 'car') extra.push('🅿️ 駐車場 ' + (info.parking === true ? 'あり' : info.parking === false ? 'なし' : (info.parking ? esc(info.parking) : '不明')));
  if (tr.mode === 'train') extra.push('🚉 最寄り駅 ' + (info.station ? esc(info.station) : '不明'));
  const wDay = days.includes(today) ? today : (days[0] || today);
  if (p) { const w = weatherFor(p, wDay); const wh = weatherHTML(w); if (wh) extra.push((wDay === today ? '今日 ' : fmtDate(wDay) + ' ') + wh); }
  if (extra.length) h += `<div class="lc-line small extras">${extra.join('<span class="sep">・</span>')}</div>`;
  if (it.memo) h += `<div class="memo small">${esc(it.memo)}</div>`;
  // ⑧ 行ったボタン＋操作
  h += `<div class="lc-ops">
    <button class="btn sm visit" data-act="visitNow" data-id="${it.id}">✅ 行った</button>
    ${days.length ? `<button class="btn sm" data-act="placeItem" data-id="${it.id}">${trip.mode === 'shiori' ? '🗓 工程へ配置' : '🗓 日時を入れる'}</button>` : ''}
    ${p ? `<a class="btn sm" href="${mapsDirUrl({ lat: p.lat, lng: p.lng }, tr.mode)}" target="_blank" rel="noopener">🧭 ナビ</a>` : ''}
    <button class="btn sm" data-act="driveTarget" data-id="${it.id}">🚩 次に行く</button>
  </div></div>`;
  return h;
}

async function readItemEditor() {
  const b = topModalBody(); const { trip, it, isNew } = topModal().data;
  const g = id => $(id, b) ? $(id, b).value : undefined;
  it.kind = segValue(b, 'ieKind') || it.kind;
  if (!it.spotId) {
    it.name = g('#ieName').trim(); it.nameCache = it.name; it.address = g('#ieAddr').trim();
    it.lat = g('#ieLat') !== '' ? num(g('#ieLat'), null) : null; it.lng = g('#ieLng') !== '' ? num(g('#ieLng'), null) : null;
    it.hoursText = g('#ieHours').trim();
    if (!it.name) { toast('名前を入れてください'); return null; }
  }
  const date = g('#ieDate') || null;
  // 未定を選んでも、モード切替で保持している時刻（hiddenTime）は消さない
  if (date) { it.date = date; it.hiddenTime = null; } else if (!it.hiddenTime) { it.date = null; }
  it.start = g('#ieStart') || null;
  it.locked = $('#ieLock', b).checked;
  it.startManual = $('#ieManual', b).checked || it.locked;
  if (it.startManual && !it.start) { toast('開始時刻を入れてください'); return null; }
  it.stay = g('#ieStay') !== '' ? num(g('#ieStay'), 60) : 60;
  it.moveAuto = $('#ieMoveAuto', b).checked;
  it.moveAfter = g('#ieMove') !== '' ? num(g('#ieMove'), null) : (it.moveAuto ? it.moveAfter : null);
  it.priority = g('#iePri');
  it.stayEst = g('#ieStayEst') !== '' ? num(g('#ieStayEst'), null) : null;
  it.priceEst = g('#iePriceEst') !== '' ? num(g('#iePriceEst'), null) : null;
  it.needsBooking = $('#ieNeedBook', b).checked;
  it.parkingMemo = g('#iePark');
  it.memo = g('#ieMemo');
  if (it.kind === 'move') it.transport = { mode: g('#ieTpMode'), from: g('#ieTpFrom'), to: g('#ieTpTo'), number: g('#ieTpNo'), platform: g('#ieTpPf') };
  if (!it.spotId && $('#ieReg', b) && $('#ieReg', b).checked) {
    try {
      const r = await api('spotCreate', { spot: { name: it.name, address: it.address, lat: it.lat, lng: it.lng, hours: it.hoursText, stayMin: it.stayEst, price: it.priceEst, priority: it.priority, status: 'want', area: trip.area || '' } });

  if (isNew && !trip.items.includes(it)) {
    const last = it.date ? dayItems(trip, it.date).slice(-1)[0] : null;
    it.order = last ? last.order + 1000 : 1000;
    trip.items.push(it);
  }
  if (it.date && it.startManual && it.start) placeByTime(trip, it);
  return { trip, it };
}

// 地図（スポット帳「地図」タブの配置を踏襲：上に地図、下に工程表）

let MAP = null, mapLayer = null, mapSig = '';
function ensureMap() {
  if (typeof L === 'undefined') { const el = $('#leafletMap'); if (el && !el.dataset.msg) { el.innerHTML = '<div class="map-fallback">地図を読み込めません（オフライン？）</div>'; el.dataset.msg = 1; } return null; }
  if (!MAP) {
    MAP = L.map('leafletMap', { zoomControl: false, attributionControl: true }).setView([34.86, 136.45], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(MAP);
    mapLayer = L.layerGroup().addTo(MAP);
  }
  return MAP;
}
function updateMap(trip) {
  const ov = $('#mapOverlay');
  if (ov) ov.innerHTML = `<button class="map-btn" data-act="transportModal">${VEHICLES[trip.listTransport.mode].icon} 乗り物設定</button>
    <button class="map-btn" data-act="mapFit">⤢</button>`;
  const map = ensureMap(); if (!map) return;
  setTimeout(() => map.invalidateSize(), 50);
  mapLayer.clearLayers();
  const day = shioriDay(trip);
  const pts = [];
  if (day) {
    const rows = daySchedule(trip, day);
    const line = [];
    rows.forEach((r, i) => {
      const p = itemPoint(trip, r.it); if (!p) return;
      line.push([p.lat, p.lng]); pts.push([p.lat, p.lng]);
      L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'mk', html: `<span class="mk-num ${r.it.visited ? 'done' : ''}">${i + 1}</span>`, iconSize: [26, 26], iconAnchor: [13, 13] }) })
        .bindPopup(`<b>${esc(r.info.name)}</b><br>${fromMin(r.start)}〜${fromMin(r.end)}`).addTo(mapLayer);
    });
    if (line.length > 1) L.polyline(line, { color: '#6366f1', weight: 4, opacity: 0.75 }).addTo(mapLayer);
  }
  unscheduledItems(trip).forEach(it => {
    const p = itemPoint(trip, it); if (!p) return;
    pts.push([p.lat, p.lng]);
    const must = it.priority === 'must';
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'mk', html: `<span class="mk-pin ${it.visited ? 'done' : must ? 'must' : ''}">${it.visited ? '✓' : must ? '★' : '•'}</span>`, iconSize: [20, 20], iconAnchor: [10, 10] }) })
      .bindPopup(`<b>${esc(itemInfo(trip, it).name)}</b>`).addTo(mapLayer);
  });
  if (S.geo) L.circleMarker([S.geo.lat, S.geo.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#2563eb', fillOpacity: 1 }).addTo(mapLayer);
  const sig = trip.id + day + JSON.stringify(pts);
  if (sig !== mapSig) {
    mapSig = sig;

function driveCandidates(trip) {
  const today = todayStr();
  const days = tripDays(trip);
  let rows = [];
  // 今日（旅行中）→ 今後の工程、旅行前 → 1日目の工程
  const day = days.includes(today) ? today : (days.find(d => d >= today) || days[0]);
  if (day) rows = daySchedule(trip, day).map(r => Object.assign({ day }, r));
  const now = day === today ? nowMinutes() : -1;
  const sched = rows.filter(r => !r.it.visited && (day !== today || r.end > now));
  const list = sortListItems(trip, unscheduledItems(trip).filter(i => !i.visited)).map(it => ({ it, info: itemInfo(trip, it), start: null, day: null }));
  return { day, sched, list, all: sched.concat(list) };
}
function renderDrive(trip) {

  if (!target) target = c.all[0] || null;
  const carTrip = hasVehicle(trip, 'car');
  let h = '';
  if (!carTrip) h += renderTransit(trip, c);
  if (target && carTrip) h += driveTargetCard(trip, target, c);
  else if (!target && carTrip) h += emptyHTML('🚗', '次の目的地がありません。しおりやリストにスポットを入れてください。');
  if (carTrip) {
    // 車旅でも次の移動が船・飛行機などなら案内を出す
    const tr = c.sched.find(r => r.it.kind === 'move' && r.it.transport && r.it.transport.mode !== 'car');
    if (tr) h += transitCard(trip, tr);
    h += odometerCard(trip);
    h += fuelCard(trip);

}

  let h = '';
  if (trip.settlement.notice) h += `<div class="alert info">ℹ️ ${esc(trip.settlement.notice)} <button class="btn sm" data-act="dismissNotice">OK</button></div>`;

  if (planned.length) h += `<div class="alert warn small">「現地で払う予定」の支出が ${planned.length}件 含まれています（払う人が決まっている前提で計算）</div>`;
  h += `<div class="card"><b>👥 メンバーごとの集計</b><table class="tbl"><tr><th>メンバー</th><th>払った合計</th><th>負担合計</th><th>差額</th></tr>
    ${trip.members.map(m => { const b = bal[m.id]; return `<tr><td>${esc(m.name)}${m.isMe ? '👤' : ''}</td><td>${fmtMoney(b.paid / unit, cur)}</td><td>${fmtMoney(b.owed / unit, cur)}</td><td class="${b.diff > 0 ? 'ok' : b.diff < 0 ? 'ng' : ''}">${b.diff > 0 ? '+' : ''}${fmtMoney(b.diff / unit, cur)}</td></tr>`; }).join('')}</table>
    <div class="muted small">差額＋は受け取る人、−は払う人。割り勘の端数は払った人が負担しています</div></div>`;
  h += `<div class="section-title">💸 送金リスト（${transfers.length}件・最小回数）</div>`;
  if (!transfers.length) h += `<div class="card ok-card">✅ 精算の必要はありません</div>`;
  transfers.forEach(t => {
    const s = transferState(trip, t);
    const open = S.ui['tx_' + t.key];
    h += `<div class="card tx ${s.st.checked ? 'done' : ''}">
      <div class="row between"><label class="check"><input type="checkbox" data-change="txCheck" data-key="${t.key}" ${s.st.checked ? 'checked' : ''}> <b>${esc(memberName(trip, t.from))}</b> → <b>${esc(memberName(trip, t.to))}</b></label><b class="h3">${fmtMoney(t.amount, cur)}</b></div>

function renderKakeibo(trip) {
  let h = '';
  // 精算通貨が円以外の場合の円換算
  if (trip.currency !== 'JPY') {
    h += `<div class="card"><b>精算通貨（${trip.currency}）の円換算</b><div class="row gap"><span>1${trip.currency}＝</span><input inputmode="decimal" data-change="settleJpy" value="${esc(trip.settleJpyRate || '')}" placeholder="${(marketToJpy(trip.currency) || '').toString().slice(0, 7)}"><span>円</span></div><div class="muted small">空欄なら市場レートを使います（他の人が払った分の自分の負担を家計簿へ送る時に使用）</div></div>`;
  }
  // 両替
  const fcs = foreignCurrencies(trip);
  h += `<div class="row between"><div class="section-title">💴 両替の記録</div><button class="btn sm primary" data-act="exchNew">＋ 両替</button></div>`;
  if (trip.exchanges.length) h += `<div class="card">${trip.exchanges.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(x => `<div class="list-row" data-act="exchEdit" data-id="${x.id}"><span>${fmtDate(x.date)} ${x.dir === 'buy' ? '円→' + x.currency : x.currency + '→円（戻し）'}</span><span>${fmtMoney(num(x.jpy), 'JPY')} ⇄ ${fmtMoney(num(x.amount), x.currency)} <span class="muted small">(${(num(x.jpy) / Math.max(1e-9, num(x.amount))).toFixed(3)}円)</span></span></div>`).join('')}</div>`;
  else h += `<div class="muted small pad">外貨現金を使う旅では、円→外貨の両替と、帰国後の外貨→円の戻し両替を入れると実効レートが確定します。</div>`;
  fcs.forEach(c => {
    const r = effectiveRate(trip, c);
    h += `<div class="card"><div class="row between"><b>${c} の実効レート</b><b class="h3">${r.rate ? r.rate.toFixed(4) + '円' : '—'}</b></div>
      <div class="small">両替 ${fmtMoney(r.jpyBuy)}→${fmtMoney(r.fBuy, c)} ／ 戻し ${fmtMoney(r.fSell, c)}→${fmtMoney(r.jpySell)} ／ 外貨現金の支出 ${fmtMoney(r.used, c)}</div>
      <div class="row gap mt"><span class="small">外貨の残り：</span><select data-change="fxClose" data-cur="${c}">
        <option value="open" ${r.close === 'open' ? 'selected' : ''}>まだ旅行中（暫定）</option>
        <option value="returned" ${r.close === 'returned' ? 'selected' : ''}>戻し両替した（確定）</option>
        <option value="carry" ${r.close === 'carry' ? 'selected' : ''}>次回用に残す（取得レートで確定）</option></select></div>
      ${r.close === 'carry' ? `<div class="small">繰越残高：<b>${fmtMoney(r.carry || 0, c)}</b>（取得レート ${r.buyRate ? r.buyRate.toFixed(4) : '—'}円）</div>` : ''}
      ${r.note ? `<div class="muted small">${esc(r.note)}</div>` : ''}
      <div class="muted small">※ 自分の両替と、自分が外貨現金で払った支出だけで計算します（他の人が払った分は精算で円になるため対象外）</div>
      ${r.final ? '<div class="ok small">✅ 確定。現金分を家計簿へ送れます</div>' : ''}</div>`;
  });
  // 家計簿
  const rows = kakeiboEntries(trip);
  const me = meMember(trip);
  h += `<div class="section-title mt">📒 家計簿へ送る（${esc(me ? me.name : '')}の負担分）</div>
    <div class="muted small">自分の負担分だけを支出明細ごとに送ります（用途：${esc(S.settings.kakeiboUsage)}、タグ #${esc(trip.title)}）。自分がカードで払った分は「支出＝引落額（全額）」と「収入＝割り勘分」の2本で送ります。</div>`;
  if (!rows.length) return h + emptyHTML('📒', '送る明細はありません');
  const sendable = rows.filter(r => !r.disabled && !r.sent);
  h += `<div class="row gap mt"><label class="check"><input type="checkbox" data-change="kkAll" ${sendable.length ? 'checked' : 'disabled'}> 未送信をすべて選択</label><span class="grow"></span><button class="btn primary sm" data-act="kkSend" ${sendable.length ? '' : 'disabled'}>選択した明細を送信</button></div>`;
  rows.forEach(r => {
    h += `<div class="kk-row ${r.sent ? 'sent' : ''} ${r.disabled ? 'disabled' : ''}">
      <div class="row gap">${!r.sent && !r.disabled ? `<input type="checkbox" class="kk-chk" data-key="${r.e.key}" checked>` : r.sent ? '✅' : '⏸'}
        <div class="grow"><div>${fmtDate(r.e.date)} ${esc(r.e.desc)}</div>
        ${r.entries.map(x => `<div class="small">${esc(x.kind)}：<b class="${x.amount < 0 ? 'ng' : 'ok'}">${x.amount < 0 ? '−' : '+'}${fmtMoney(Math.abs(x.amount))}</b> <span class="muted">［${esc(x.category)}］</span></div>`).join('')}
        ${r.note ? `<div class="muted small">${esc(r.note)}</div>` : ''}
        ${r.disabled ? `<div class="warn small">⏸ ${esc(r.disabled)}</div>` : ''}
        ${r.sent ? `<div class="muted small">送信済み ${esc(new Date(r.sent.sentAt).toLocaleString('ja-JP'))}${r.changedAfterSend ? ' <span class="warn">⚠️ 送信後に金額が変わっています（家計簿側を直してください）</span>' : ''} <button class="link-btn" data-act="kkUnsend" data-key="${r.e.key}">送信済みを解除</button></div>` : ''}</div></div></div>`;
  });
  return h;
}
ON_CHANGE.settleJpy = (el) => { const t = curTrip(); t.settleJpyRate = el.value === '' ? null : num(el.value, null); commitTrip(t); };
ON_CHANGE.fxClose = (el) => { const t = curTrip(); t.fxClose[el.dataset.cur] = el.value; commitTrip(t); };
ON_CHANGE.kkAll = (el) => { $$('.kk-chk').forEach(c => c.checked = el.checked); };
ACT.kkSend = async (el) => {
  const t = curTrip();
  const keys = new Set($$('.kk-chk').filter(c => c.checked).map(c => c.dataset.key));
  const rows = kakeiboEntries(t).filter(r => keys.has(r.e.key) && !r.disabled && !r.sent);
  if (!rows.length) return toast('送る明細を選んでください');
  const logs = [];
  rows.forEach(r => r.entries.forEach(x => logs.push({ sourceKey: t.id + ':' + x.sourceKey, date: x.date, amount: x.amount, memo: x.memo, category: x.category, usage: x.usage, budget: x.budget, tag: x.tag, source: 'tabicho' })));
  if (!(await confirmDialog(`${rows.length}件（${logs.length}行）を家計簿へ送信します。よろしいですか？`))) return;
  el.disabled = true;
  try {
    const res = await api('kakeiboSend', { logs });
    const ok = new Set(res.keys || logs.map(l => l.sourceKey));
    const at = new Date().toISOString();
    rows.forEach(r => {
      if (r.entries.every(x => ok.has(t.id + ':' + x.sourceKey))) r.e.ref.kakeibo = { sentAt: at, sig: r.sig, keys: r.entries.map(x => x.sourceKey) };
    });
    commitTrip(t);
    toast('家計簿へ送信しました（' + (res.sent != null ? res.sent : logs.length) + '行' + (res.skipped ? '、重複' + res.skipped + '行はスキップ' : '') + '）');
  } catch (e) { el.disabled = false; toast('送信に失敗：' + e.message); }
};
ACT.kkUnsend = async (el) => {
  const t = curTrip(); const e = allExpenses(t).find(x => x.key === el.dataset.key);
  if (!e || !(await confirmDialog('送信済みの印を外します（家計簿側の明細は消えません）。再送すると二重になる可能性があります。よろしいですか？'))) return;
  e.ref.kakeibo = null; commitTrip(t);
};

function renderRecord(trip) {
  const rec = trip.record;
  const bs = budgetSummary(trip);
  const visited = trip.items.filter(i => i.visited);
  const days = tripDays(trip);
  const km = totalDistance(trip);
  const nPhoto = trip.media.filter(m => m.kind === 'photo').length, nVideo = trip.media.length - nPhoto;
  let h = `<div class="card summary"><div class="row between"><b>📊 旅のまとめ（自動集計）</b><button class="btn sm accent" data-act="openVisual">📖 ビジュアル</button></div>
    <div class="sum-grid">
      <div><div class="muted small">総額</div><div class="h3">${fmtMoney(bs.total, trip.currency)}</div></div>
      <div><div class="muted small">1人あたり</div><div class="h3">${fmtMoney(bs.total / Math.max(1, trip.members.length), trip.currency)}</div></div>
      <div><div class="muted small">総走行距離</div><div class="h3">${km ? km.toLocaleString() + 'km' : '—'}</div></div>
      <div><div class="muted small">行ったスポット</div><div class="h3">${visited.length}件</div></div>
      <div><div class="muted small">日数</div><div class="h3">${days.length ? days.length + '日' + (nights(trip) ? '（' + nights(trip) + '泊）' : '（日帰り）') : '—'}</div></div>
      <div><div class="muted small">写真・動画</div><div class="h3">${nPhoto}・${nVideo}</div></div>
    </div></div>`;
  h += `<div class="card"><b>⭐ 旅全体の評価</b><div>${stars(rec.rating || 0, 'recStar')}</div>
    <textarea rows="2" data-change="recComment" placeholder="ひとこと感想">${esc(rec.comment || '')}</textarea></div>`;

  // ---- メディア ----
  h += `<div class="section-title row between"><span>📷 写真・動画</span><button class="btn sm primary" data-act="mediaAdd">＋ 追加</button></div>
    <input type="file" id="mediaPick" accept="image/*,video/*" multiple style="display:none">
    ${albumsHTML(trip)}
    ${trip.driveFolderName ? `<div class="muted small">保存先：Drive「${esc(trip.driveFolderName)}」</div>` : ''}
    ${queueHTML(trip)}`;
  const { by, unset } = mediaByDay(trip);
  days.forEach((d, i) => {
    const list = by[d];
    const key = trip.id + d;
    const closed = S.ui.dayClosed && S.ui.dayClosed[key];
    const np = list.filter(m => m.kind === 'photo').length, nv = list.length - np;
    h += `<div class="card day-sec"><div class="row between day-head" data-act="dayToggle" data-k="${key}">
        <b>${closed ? '▶' : '▼'} ${i + 1}日目 ${fmtDateFull(d)}</b><span class="muted small">${np ? '📷' + np : ''} ${nv ? '🎬' + nv : ''}</span></div>
      ${closed ? '' : `<textarea rows="3" data-change="recDay" data-d="${d}" placeholder="この日の出来事・感想">${esc(rec.days[d] || '')}</textarea>
        ${mediaGridHTML(trip, list)}
        <button class="btn sm mt" data-act="mediaAdd" data-date="${d}">＋ この日に写真・動画</button>`}</div>`;
  });
  if (unset.length || !days.length) {
    h += `<div class="card day-sec"><div class="row between"><b>📂 日付未設定</b><span class="muted small">${unset.length}件</span></div>
      <div class="muted small">撮影日時が取れない・日程の外のものはここに入ります。タップして日付を変えると日別に移ります</div>
      ${mediaGridHTML(trip, unset)}</div>`;
  }

  h += `<div class="section-title">✅ この旅で「行った」にしたスポット（${visited.length}）</div>`;
  if (visited.length) h += visited.map(it => {
    const info = itemInfo(trip, it); const v = it.visited;
    const nMedia = trip.media.filter(m => (it.spotId && m.spotId === it.spotId) || m.itemId === it.id).length;
    return `<div class="card visit-card" data-act="visitEdit" data-id="${it.id}"><div class="row between"><b>${esc(info.name)}</b><span class="face-big">${faceHTML(v.rating)}</span></div>
      <div class="muted small">${fmtDateFull(v.date)} ・ ${esc((v.companions || []).join('・'))}${it.spotId ? '' : ' ・ スポット帳未登録'}${nMedia ? ' ・ 📷' + nMedia : ''}</div>${v.comment ? `<div>${esc(v.comment)}</div>` : ''}</div>`;
  }).join('');
  else h += `<div class="muted small pad">しおり・リスト・ドライブの「行った」ボタンで記録されます</div>`;
  const settled = settlementComplete(trip);
  h += `<div class="card ${rec.done ? 'ok-card' : ''}"><label class="check big"><input type="checkbox" data-change="recDone" ${rec.done ? 'checked' : ''}> 記録完了</label>
    <div class="muted small">精算の全件完了（${settled ? '✅ 済' : '未'}）と記録完了が揃うと、ホームに「完了にできます」が出ます</div></div>`;
  setTimeout(() => loadThumbs(document.getElementById('page-record')), 0);
  return h;
}

const SEASON_TAGS = {
  '春': [3, 4, 5], '夏': [6, 7, 8], '秋': [9, 10, 11], '冬': [12, 1, 2],
  '桜': [3, 4], '花見': [3, 4], '新緑': [4, 5], '紫陽花': [6], 'あじさい': [6], '海水浴': [7, 8], '花火': [7, 8], '海': [6, 7, 8, 9],
  '紅葉': [10, 11, 12], 'もみじ': [10, 11], '雪': [12, 1, 2], 'スキー': [12, 1, 2, 3], 'イルミネーション': [11, 12, 1, 2], '梅': [2, 3], '菜の花': [2, 3, 4], 'ひまわり': [7, 8], 'コスモス': [9, 10]
};
function seasonMonths(tags) {
  const ms = new Set();
  (tags || []).forEach(t => {
    const m = String(t).match(/^(\d{1,2})月$/);
    if (m) ms.add(Number(m[1]));
    if (SEASON_TAGS[t]) SEASON_TAGS[t].forEach(x => ms.add(x));
  });
  return ms;
}

  } catch (e) { out.innerHTML = `<div class="warn-box">${esc(e.message)}</div>`; }

async function computeSuggestions(cond) {
  const home = S.settings.home;
  const people = Math.max(1, cond.members.length);
  const days = cond.kind === 'day' ? 1 : cond.kind === 'one' ? 2 : 3;
  const candDays = cond.start ? dateRange(cond.start, cond.end || cond.start) : [];
  const month = cond.start ? parseYmd(cond.start).getMonth() + 1 : ((new Date().getMonth() + 1) % 12) + 1;
  let spots = Object.values(S.spots).filter(s => s.status !== 'visited' && s.lat != null);
  // その時期に行けないもの（候補日すべて定休）は落とす、旬でないものは順位を下げる
  spots = spots.map(s => {
    const h = parseHours(S.hours[s.id] ? S.hours[s.id].week : null);
    const closedAll = candDays.length && candDays.every(d => dayAvailability(h, d) === 'closed');
    const sm = seasonMonths(s.tags);
    const season = sm.size ? (sm.has(month) ? 1 : -1) : 0;
    const mood = cond.moods.length ? (s.tags || []).filter(t => cond.moods.includes(t)).length : 0;
    return Object.assign({}, s, { _closedAll: closedAll, _season: season, _mood: mood });
  }).filter(s => !s._closedAll);
  // エリア単位に束ねる（スポット帳のエリア名、無ければ半径25kmで集める）
  const groups = {};
  const noArea = [];
  spots.forEach(s => { if (s.area) (groups[s.area] = groups[s.area] || []).push(s); else noArea.push(s); });
  noArea.sort((a, b) => (b.priority === 'must') - (a.priority === 'must'));
  const used = new Set();
  noArea.forEach(seed => {
    if (used.has(seed.id)) return;
    const g = noArea.filter(s => !used.has(s.id) && haversineKm(seed, s) <= 25);
    g.forEach(s => used.add(s.id));
    const label = (seed.address || '').match(/^(.+?[都道府県])?(.+?[市町村区郡])/);
    groups[(label ? (label[2] || label[1]) : seed.name) + '周辺'] = g;
  });
  let clusters = Object.keys(groups).map(area => {
    const ss = groups[area];
    const c = { lat: sum(ss, s => s.lat) / ss.length, lng: sum(ss, s => s.lng) / ss.length };
    const km = haversineKm(home, c);
    return { area, spots: ss, center: c, km, oneway: estimateMinutes(km, 'car') };
  });
  // 片道時間を経路で確認（上位のみ）
  try {
    const top = clusters.slice().sort((a, b) => a.km - b.km).slice(0, 12);
    const r = await api('routes', { list: top.map(c => ({ from: { lat: home.lat, lng: home.lng }, to: c.center, mode: 'car', opt: { highway: true, toll: true } })) });
    (r.results || []).forEach((res, i) => { if (res) { top[i].oneway = res.min; top[i].roadKm = res.km; top[i].toll = res.toll; top[i].routeEstimated = !!res.estimated; } });
  } catch (e) { /* 概算のまま */ }
  const range = { day: [0, 150], one: [45, 300], multi: [90, 600] }[cond.kind];
  const within = (c, k) => c.oneway >= range[0] && c.oneway <= range[1] * k;
  let fit = clusters.filter(c => within(c, 1));
  let relaxed = false;
  if (fit.length < 3) { fit = clusters.filter(c => within(c, 1.4)); relaxed = true; }
  if (cond.moods.length) fit = fit.filter(c => c.spots.some(s => s._mood));
  const scored = fit.map(c => {
    const core = c.spots.slice().sort((a, b) => (b.priority === 'must') - (a.priority === 'must') || b._mood - a._mood || b._season - a._season || (b.stayMin || 0) - (a.stayMin || 0)).slice(0, 5);
    const must = c.spots.filter(s => s.priority === 'must').length;
    const score = must * 3 + c.spots.length + sum(c.spots, s => s._mood) * 2 + sum(c.spots, s => s._season) * 1.5;
    const cost = estimateCost(c, core, days, people);
    const stayMin = sum(core, s => s.stayMin || 60);
    let inner = 0;
    for (let k = 1; k < core.length; k++) inner += estimateMinutes(haversineKm(core[k - 1], core[k]), 'car');
    const needDays = Math.max(1, Math.ceil((stayMin + inner + c.oneway * 2) / 600));
    return Object.assign(c, { core, must, score, cost, needDays, course: modelCourse(c, core, days), relaxed, overBudget: cond.budget != null && cost.total > cond.budget });
  });
  scored.sort((a, b) => (b.must > 0) - (a.must > 0) || (a.overBudget - b.overBudget) || b.score - a.score);
  return scored.slice(0, 3);
}
function estimateCost(c, core, days, people) {
  const st = S.settings;
  const roadKm = (c.roadKm || c.km * 1.35) * 2 + 30 * days;
  const fuel = Math.round(roadKm / num(st.fuelEfficiency, 15) * num(st.fuelPrice, 170));
  const toll = c.toll != null ? c.toll * 2 : (c.oneway > 60 ? Math.round((150 + c.km * 1.35 * 0.7 * 24.6) / 10) * 10 * 2 : 0);
  const entry = sum(core, s => num(s.price, 0)) * people;
  const meals = (days === 1 ? 2 : days * 2) * num(st.mealPerPerson, 1500) * people;
  const lodging = (days - 1) * num(st.lodgingPerPerson, 10000) * people;
  const transport = fuel + toll;
  const total = transport + entry + meals + lodging;
  return { transport, fuel, toll, entry, meals, lodging, total, perPerson: Math.round(total / people) };
}
function modelCourse(c, core, days) {
  const home = S.settings.home;
  const left = core.slice();
  const order = [];
  let cur = home;
  while (left.length) {
    left.sort((a, b) => haversineKm(cur, a) - haversineKm(cur, b));
    cur = left.shift(); order.push(cur);
  }
  const per = Math.ceil(order.length / days);
  const out = [];
  for (let d = 0; d < days; d++) {
    const part = order.slice(d * per, (d + 1) * per);
    const names = part.map(s => s.name);
    if (d === 0) names.unshift('自宅');
    if (d === days - 1) names.push('自宅');
    else names.push('（宿）');
    out.push({ day: d + 1, flow: names.join(' → ') });
  }
  return out;
}
function suggestionCardHTML(r, i, cond) {
  const cost = r.cost;
  return `<div class="card sg">
    <div class="row between"><div class="h2">${['🥇', '🥈', '🥉'][i] || ''} ${esc(r.area)}</div><span class="muted small">片道 ${r.routeEstimated !== false && !r.roadKm ? '約' : ''}${fmtDuration(r.oneway)}</span></div>
    ${r.relaxed ? '<div class="muted small">※ 日数の範囲を少し広げて探しました</div>' : ''}
    <div class="b mt">核になるスポット</div>
    <div>${r.core.map(s => `<span class="tag ${s.priority === 'must' ? 'must' : ''}">${s.priority === 'must' ? '⭐' : ''}${esc(s.name)}${s._season < 0 ? '（旬外）' : ''}</span>`).join(' ')}</div>
    <div class="b mt">モデルコース</div>
    ${r.course.map(c => `<div class="small">${c.day}日目：${esc(c.flow)}</div>`).join('')}
    <div class="b mt">概算費用 <span class="h3">${fmtMoney(cost.total)}</span> <span class="muted small">（1人 ${fmtMoney(cost.perPerson)}）</span> ${r.overBudget ? '<span class="tag warn">予算オーバー</span>' : cond.budget != null ? '<span class="tag ok">予算内</span>' : ''}</div>

// ---- 14_media.js ----
// ============================================================================
// 14 メディア（v2.0）：写真・動画を Drive に保存し、旅帳は fileId とメタ情報だけを持つ
//   アップロードは旅帳PoC v0.1 の方式（実機検証済み）：GAS が Origin 付きでセッション発行 → 画面から直接 PUT
//   ・既定は「保留」（キューに入れて手動で送る）。設定で写真・動画それぞれ自動送信にできる
//   ・自動送信でも 100MB 以上は送る前に確認（M1）
//   ・ファイル本体は端末に抱えない（M2）。再読み込み後はファイルを選び直して途中から再開
// ============================================================================
const MQ_KEY = 'tabicho_media_queue_v1';
const MQ = { items: [], files: new Map(), running: false, wake: null };
const MQ_LABEL = { held: '保留中', waiting: '送信待ち', sending: '送信中', failed: '失敗', done: '完了' };

function mqLoad() {
  try { MQ.items = JSON.parse(localStorage.getItem(MQ_KEY) || '[]'); } catch (e) { MQ.items = []; }
  // 前回「送信中」のまま閉じたもの＝エラーによる中断（意図的な保留とは分ける）
  MQ.items.forEach(q => {
    if (q.state === 'sending' || q.state === 'waiting') { q.state = 'failed'; q.error = '中断されました（画面を閉じた・スリープなど）。ファイルを選び直すと途中から再開します'; }
  });
  const dayAgo = Date.now() - 24 * 3600e3;
  MQ.items = MQ.items.filter(q => !(q.state === 'done' && q.doneAt < dayAgo));
  mqSave();
}
function mqSave() { try { localStorage.setItem(MQ_KEY, JSON.stringify(MQ.items)); } catch (e) {} }
function mqCounts(tripId) {
  const c = { held: 0, waiting: 0, sending: 0, failed: 0, done: 0 };
  MQ.items.filter(q => !tripId || q.tripId === tripId).forEach(q => { c[q.state] = (c[q.state] || 0) + 1; });
  c.unsent = c.held + c.waiting;
  return c;
}
function mediaKind(f) {
  const t = String(f.type || ''), n = String(f.name || '').toLowerCase();
  if (/^video\//.test(t) || /\.(mov|mp4|m4v|hevc|avi|mkv|3gp)$/.test(n)) return 'video';
  return 'photo';
}
function fmtBytes(n) { n = Number(n) || 0; return n >= 1073741824 ? (n / 1073741824).toFixed(2) + 'GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : n >= 1024 ? Math.round(n / 1024) + 'KB' : n + 'B'; }
function fmtDurMs(ms) { if (!ms) return ''; const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + pad2(s % 60); }

// ---------------------------------------------------------------------------
// キューに追加（保留 or 自動送信）
// ---------------------------------------------------------------------------
async function addFilesToQueue(trip, files, opt) {
  opt = opt || {};
  const ms = S.settings.media || {};
  const limit = (Number(ms.confirmMB) || 100) * 1048576;
  let n = 0;
  for (const f of files) {
    const kind = mediaKind(f);
    const q = {
      qid: uid('q'), tripId: trip.id, name: f.name, size: f.size, lastModified: f.lastModified, type: f.type || '', kind,
      state: 'held', error: '', sessionUri: '', offset: 0, spotId: opt.spotId || '', itemId: opt.itemId || '', date: opt.date || '',
      addedAt: Date.now(), progress: 0
    };
    const auto = opt.sendNow != null ? opt.sendNow : (kind === 'video' ? ms.autoVideo : ms.autoPhoto);
    if (auto) {
      if (f.size >= limit && !(await confirmDialog(`「${f.name}」は ${fmtBytes(f.size)} あります。今すぐ送りますか？\n（キャンセル＝保留に入れて後で送る）`))) q.state = 'held';
      else q.state = 'waiting';
    }
    MQ.files.set(q.qid, f);
    MQ.items.push(q);
    if (mockThumbMaker) mockThumbMaker(q.qid, f);
    n++;
  }
  mqSave();
  render();
  processQueue();
  return n;
}
function mqSend(qids) {
  let needFile = 0;
  MQ.items.filter(q => qids.includes(q.qid) && (q.state === 'held' || q.state === 'failed')).forEach(q => {
    if (!MQ.files.has(q.qid)) { needFile++; return; }
    q.state = 'waiting'; q.error = '';
  });
  mqSave(); render(); processQueue();
  if (needFile) toast(needFile + '件はファイルを選び直してください（端末にファイル本体を残さない方式のため）');
}
function mqRemove(qid) { MQ.items = MQ.items.filter(q => q.qid !== qid); MQ.files.delete(qid); mqSave(); render(); }

async function processQueue() {
  if (MQ.running) return;
  MQ.running = true;
  try {
    for (;;) {
      const q = MQ.items.find(x => x.state === 'waiting' && MQ.files.has(x.qid));
      if (!q) break;
      await uploadOne(q, MQ.files.get(q.qid));
    }
  } finally { MQ.running = false; }
}
function mqUpdate(q) { mqSave(); updateQueueRow(q); updateUnsentBar(); }

// ---------------------------------------------------------------------------
// 1件のアップロード（PoC の直接 PUT を移植）
// ---------------------------------------------------------------------------
function tripFolderInfo(trip) {
  return { tripId: trip.id, folderId: trip.driveFolderId || '', year: trip.startDate ? trip.startDate.slice(0, 4) : '', region: trip.driveFolderRegion || trip.region || 'domestic', title: trip.title };
}
function rememberFolder(trip, r) {
  if (r.folderId && trip.driveFolderId !== r.folderId) {
    trip.driveFolderId = r.folderId; trip.driveFolderName = r.folderName || ''; trip.driveFolderRegion = trip.driveFolderRegion || trip.region;
    commitTrip(trip, { noRender: true });
  }
}
function xhrPutMedia(uri, body, contentRange, onProgress) {
  return new Promise((resolve) => {
    const x = new XMLHttpRequest();
    x.open('PUT', uri);
    x.setRequestHeader('Content-Range', contentRange);
    if (onProgress) x.upload.onprogress = (e) => onProgress(e.loaded);
    x.timeout = 10 * 60 * 1000;
    const done = (err) => {
      let range = ''; try { range = x.getResponseHeader('Range') || ''; } catch (e) {}
      resolve({ status: x.status, range, body: x.status && x.status !== 308 ? x.responseText : '', error: err || '' });
    };
    x.onload = () => done();
    x.onerror = () => done('network');
    x.ontimeout = () => done('timeout');
    x.onabort = () => done('abort');
    x.send(body);
  });
}
function rangeEnd(r) { const m = String(r || '').match(/bytes=0-(\d+)/); return m ? Number(m[1]) + 1 : 0; }
async function blobB64(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}
function sleepWake(ms) { return new Promise(r => { const t = setTimeout(r, ms); MQ.wake = () => { clearTimeout(t); r(); }; }); }

async function queryUploaded(q, file) {
  if (isMockUri(q.sessionUri)) return mockStatus(q, file);
  const r = await xhrPutMedia(q.sessionUri, null, 'bytes */' + file.size);
  if (r.status === 308 && r.range) return { offset: rangeEnd(r.range) };
  if (r.status === 200 || r.status === 201) { try { return { offset: file.size, file: JSON.parse(r.body) }; } catch (e) {} }
  // 画面で読めない時は GAS から確認（PoC の保険経路）
  const st = await api('mediaStatus', { sessionUri: q.sessionUri, size: file.size });
  if (st.code === 404 || st.code === 410) throw new Error('アップロードの期限が切れました。もう一度最初から送ってください');
  if (st.code === 200 || st.code === 201) return { offset: file.size, file: st.file };
  return { offset: rangeEnd(st.range) };
}

async function uploadOne(q, file) {
  const trip = S.trips[q.tripId];
  if (!trip || trip._deleted) { q.state = 'failed'; q.error = '旅が見つかりません'; mqUpdate(q); return; }
  q.state = 'sending'; q.error = ''; mqUpdate(q);
  const chunk = Math.max(1, Number((S.settings.media || {}).chunkMB) || 4) * 262144 * 4; // 256KB の倍数
  let fileObj = null, retries = 0;
  try {
    if (!q.sessionUri) {
      const r = await api('mediaSession', { folder: tripFolderInfo(trip), name: file.name, mimeType: file.type || 'application/octet-stream', size: file.size, origin: location.origin });
      q.sessionUri = r.sessionUri; q.offset = 0; rememberFolder(trip, r); mqSave();
    } else {
      const st = await queryUploaded(q, file);
      q.offset = st.offset; if (st.file) fileObj = st.file;
    }
    while (!fileObj) {
      const start = q.offset, end = Math.min(start + chunk, file.size) - 1;
      const r = isMockUri(q.sessionUri) ? await mockPut(q, file, start, end)
        : await xhrPutMedia(q.sessionUri, file.slice(start, end + 1), `bytes ${start}-${end}/${file.size}`, (n) => { q.progress = (start + n) / file.size; updateQueueRow(q); });
      if (r.status === 308) {
        q.offset = r.range ? rangeEnd(r.range) : (await queryUploaded(q, file)).offset;
        q.progress = q.offset / file.size; retries = 0; mqUpdate(q);
      } else if (r.status === 200 || r.status === 201) {
        try { fileObj = JSON.parse(r.body); } catch (e) { fileObj = (await queryUploaded(q, file)).file; }
      } else if (r.status === 0 && start === 0 && !retries && q.kind === 'photo' && file.size <= 5 * 1048576) {
        // 直接 PUT ができない時、小さい写真は GAS 経由で送る（PoC の代替路）
        const res = await api('mediaSmallUpload', { folder: tripFolderInfo(trip), name: file.name, mimeType: file.type || 'image/jpeg', b64: await blobB64(file) });
        rememberFolder(trip, res); fileObj = res.file; q.viaGas = true;
      } else {
        if (++retries > 6) throw new Error('送信できませんでした（' + (r.error || 'HTTP ' + r.status) + '）');
        q.error = `通信が切れました。再開を待っています（${retries}回目）`; mqUpdate(q);
        await sleepWake(Math.min(30000, 1500 * Math.pow(2, retries)));
        q.offset = (await queryUploaded(q, file)).offset;
        q.error = '';
      }
    }
    await registerMedia(trip, q, fileObj);
    q.state = 'done'; q.doneAt = Date.now(); q.sessionUri = ''; q.progress = 1; q.fileId = fileObj.id;
    MQ.files.delete(q.qid);
    mqUpdate(q);
    render();
  } catch (e) {
    q.state = 'failed'; q.error = e.message || String(e); mqUpdate(q);
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && MQ.wake) { const w = MQ.wake; MQ.wake = null; w(); } });
window.addEventListener('online', () => { if (MQ.wake) { const w = MQ.wake; MQ.wake = null; w(); } processQueue(); });

// 撮影日時は Drive のメタデータ（EXIF）を優先、無ければアップロード日（M3）。日程外・不明は「日付未設定」へ
async function registerMedia(trip, q, fileObj) {
  let meta = {};
  try { const r = await api('mediaMeta', { ids: [fileObj.id] }); meta = (r.meta || {})[fileObj.id] || {}; } catch (e) {}
  const taken = meta.takenAt || '';
  const date = q.date || (taken ? taken.slice(0, 10) : todayStr());
  const m = {
    id: uid('md'), fileId: fileObj.id, kind: q.kind, name: fileObj.name || q.name, size: Number(fileObj.size) || q.size,
    mimeType: fileObj.mimeType || q.type, takenAt: taken, date, dateSource: q.date ? 'manual' : taken ? 'exif' : 'upload',
    spotId: q.spotId || '', itemId: q.itemId || '', favorite: false, cover: false, comment: '', createdAt: new Date().toISOString(),
    width: meta.width || null, height: meta.height || null, durationMs: meta.durationMs || null, hasThumbnail: !!meta.hasThumbnail, videoReady: !!meta.videoReady
  };
  const t = S.trips[trip.id] || trip;
  t.media.push(m);
  commitTrip(t, { noRender: true });
}

// ---------------------------------------------------------------------------
// メディアの並び・代表写真
// ---------------------------------------------------------------------------
function mediaSorted(list) { return list.slice().sort((a, b) => ((a.takenAt || a.createdAt) < (b.takenAt || b.createdAt) ? -1 : 1)); }
function mediaByDay(trip) {
  const days = tripDays(trip);
  const by = {}; days.forEach(d => { by[d] = []; });
  const unset = [];
  trip.media.forEach(m => { if (m.date && by[m.date]) by[m.date].push(m); else unset.push(m); });
  Object.keys(by).forEach(d => { by[d] = mediaSorted(by[d]); });
  return { by, unset: mediaSorted(unset) };
}
// 代表写真：代表に設定した写真 → お気に入りの先頭 → 写真の先頭
function coverMedia(trip) {
  const photos = trip.media.filter(m => m.kind === 'photo');
  return photos.find(m => m.cover) || photos.find(m => m.favorite) || null;
}
function coverOrFirst(trip) { return coverMedia(trip) || mediaSorted(trip.media.filter(m => m.kind === 'photo'))[0] || null; }
function isImageUrl(u) { return /^https?:\/\/\S+\.(jpe?g|png|webp|gif|heic)(\?|$)/i.test(u || '') || /googleusercontent\.com\//.test(u || ''); }
function driveUrl(m) { return 'https://drive.google.com/file/d/' + encodeURIComponent(m.fileId) + '/view'; }
function previewState(m) {
  if (m.kind !== 'video') return 'ok';
  if (m.videoReady) return 'ok';
  const age = Date.now() - new Date(m.createdAt || 0).getTime();
  return age > 30 * 60 * 1000 ? 'none' : 'processing';   // ProRes 等は Drive の変換対象外で、いつまでも準備されない
}

// ---------------------------------------------------------------------------
// サムネイル（GAS が自権限で取得した base64。端末にもキャッシュしてオフラインでも見られる）
// ---------------------------------------------------------------------------
const TH = new Map();
const thumbIdb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try { const r = indexedDB.open('tabicho_thumbs', 1); r.onupgradeneeded = () => r.result.createObjectStore('t'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }
    catch (e) { res(null); }
  }));
  return {
    async get(k) { const db = await open(); if (!db) return undefined; return new Promise(res => { try { const g = db.transaction('t').objectStore('t').get(k); g.onsuccess = () => res(g.result); g.onerror = () => res(undefined); } catch (e) { res(undefined); } }); },
    async put(k, v) { const db = await open(); if (!db) return; try { db.transaction('t', 'readwrite').objectStore('t').put(v, k); } catch (e) {} }
  };
})();
function thumbKey(fileId, size) { return fileId + '@' + size; }
function mediaTileInner(m, size) {
  const k = thumbKey(m.fileId, size);
  const src = TH.get(k);
  if (src) return `<img src="${src}" alt="">`;
  if (src === '') return mediaFallback(m);
  return `<div class="mt-load" data-thumb="${esc(m.fileId)}" data-size="${size}">${m.kind === 'video' ? '🎬' : '📷'}</div>`;
}
// サムネイルが取れない時の代替表示（メディア自体は残す）
function mediaFallback(m) {
  const p = previewState(m);
  if (m.kind === 'video') return `<div class="mt-fb">🎬<small>${p === 'none' ? 'プレビュー不可' : p === 'processing' ? 'Drive で処理中' : ''}${m.durationMs ? ' ' + fmtDurMs(m.durationMs) : ''}</small><small>${esc(m.name)}</small></div>`;
  return `<div class="mt-fb">📷<small>${esc(m.name)}</small></div>`;
}
let thumbLoading = false;
async function loadThumbs(root) {
  root = root || document;
  const els = Array.from(root.querySelectorAll('[data-thumb]'));
  if (!els.length) return;
  const want = {};
  els.forEach(el => { const k = thumbKey(el.dataset.thumb, el.dataset.size); if (!TH.has(k)) (want[el.dataset.size] = want[el.dataset.size] || new Set()).add(el.dataset.thumb); });
  // まず端末のキャッシュ
  for (const size of Object.keys(want)) {
    for (const id of Array.from(want[size])) {
      const v = await thumbIdb.get(thumbKey(id, size));
      if (v) { TH.set(thumbKey(id, size), v); want[size].delete(id); }
    }
  }
  applyThumbs(root);
  if (thumbLoading) return;
  thumbLoading = true;
  try {
    for (const size of Object.keys(want)) {
      const ids = Array.from(want[size]);
      for (let i = 0; i < ids.length; i += 12) {
        const r = await api('mediaThumbs', { ids: ids.slice(i, i + 12), size: Number(size) });
        Object.keys(r.thumbs || {}).forEach(id => {
          const t = r.thumbs[id];
          TH.set(thumbKey(id, size), t.thumb || '');
          if (t.thumb) thumbIdb.put(thumbKey(id, size), t.thumb);
          updateMediaMeta(id, t.meta);
        });
        applyThumbs(document);
      }
    }
  } catch (e) { /* 取れなければ代替表示のまま */ }
  thumbLoading = false;
}
function applyThumbs(root) {
  (root || document).querySelectorAll('[data-thumb]').forEach(el => {
    const k = thumbKey(el.dataset.thumb, el.dataset.size);
    if (!TH.has(k)) return;
    const m = findMediaByFile(el.dataset.thumb);
    el.outerHTML = TH.get(k) ? `<img src="${TH.get(k)}" alt="">` : (m ? mediaFallback(m) : '<div class="mt-fb">？</div>');
  });
}
function findMediaByFile(fileId) {
  for (const t of Object.values(S.trips)) { const m = (t.media || []).find(x => x.fileId === fileId); if (m) return m; }
  return null;
}
function updateMediaMeta(fileId, meta) {
  if (!meta) return;
  for (const t of Object.values(S.trips)) {
    const m = (t.media || []).find(x => x.fileId === fileId);
    if (!m) continue;
    let ch = false;
    [['durationMs', meta.durationMs], ['videoReady', meta.videoReady], ['hasThumbnail', meta.hasThumbnail], ['width', meta.width], ['height', meta.height]].forEach(([k, v]) => {
      if (v != null && m[k] !== v) { m[k] = v; ch = true; }
    });
    if (meta.missing && !m.missing) { m.missing = true; ch = true; }
    if (ch) commitTrip(t, { silent: true });
  }
}
async function fetchBigImage(m, size) {
  size = size || 1600;
  const k = thumbKey(m.fileId, size);
  if (TH.has(k)) return TH.get(k);
  const c = await thumbIdb.get(k);
  if (c) { TH.set(k, c); return c; }
  const r = await api('mediaThumbs', { ids: [m.fileId], size });
  const t = (r.thumbs || {})[m.fileId] || {};
  TH.set(k, t.thumb || '');
  if (t.thumb) thumbIdb.put(k, t.thumb);
  updateMediaMeta(m.fileId, t.meta);
  return t.thumb || '';
}

const KANA = { 'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo','ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo','てぃ':'ti','でぃ':'di','うぃ':'wi','うぇ':'we','ゔぁ':'va',
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゃ':'ya','ゅ':'yu','ょ':'yo','ゔ':'vu' };
function kanaToRomaji(src) {
  // カタカナはひらがなにそろえる
  const s = String(src || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const two = s.substr(i, 2);
    if (KANA[two]) { out += KANA[two]; i++; continue; }
    const c = s[i];
    if (c === 'っ' || c === 'ッ') { const nx = KANA[s.substr(i + 1, 2)] || KANA[s[i + 1]] || ''; out += nx ? nx[0] : ''; continue; }
    if (c === 'ー') { const m = out.match(/[aeiou]$/); out += m ? m[0] : ''; continue; }
    out += KANA[c] != null ? KANA[c] : c;
  }
  return out;
}

  const manual = (trip.visual.dayPicks[date] || []).map(id => trip.media.find(m => m.id === id)).filter(Boolean);

function enDate(d) { const x = parseYmd(d); return MON[x.getMonth()] + ' ' + x.getDate(); }

function vImg(m, cls, slot) {

  return `<div class="vimg ${cls}" data-vimg="${esc(m.id)}" ${slot}>${m.kind === 'video' ? '<span class="vvid">▶</span>' : ''}</div>`;

function pageHTML(t, p) {

    <div class="vgrid n${n}">${Array.from({ length: n }, (_, k) => vImg(picks[k], 's' + k, `data-act="visPickDay" data-d="${p.date}" data-k="${k}"`)).join('')}</div>
    <div class="vplace">${esc(dayPlace(t, p.date))}</div><div class="vline">${esc(dayLine(t, p.date))}</div></div>`;
}
async function loadVisImages(root) {
  for (const el of Array.from(root.querySelectorAll('[data-vimg]'))) {
    const m = VIS.trip.media.find(x => x.id === el.dataset.vimg); if (!m) continue;
    try { const src = await fetchBigImage(m, 1600); if (src) el.style.backgroundImage = `url("${src}")`; else el.innerHTML = '<span class="muted">画像なし</span>'; } catch (e) {}
  }
}
ACT.visNext = () => flip(1);
ACT.visPrev = () => flip(-1);
function flip(dir) {
  const ni = VIS.i + dir;
  if (VIS.busy || ni < 0 || ni >= VIS.pages.length) return;
  VIS.busy = true;
  const pages = document.querySelectorAll('#visStage .vpage');
  if (dir > 0) { pages[VIS.i].classList.add('turning'); pages[VIS.i].classList.replace('cur', 'gone'); pages[ni].classList.replace('next', 'cur'); }
  else { pages[ni].classList.add('turning'); pages[ni].classList.replace('gone', 'cur'); pages[VIS.i].classList.replace('cur', 'next'); }
  VIS.i = ni;
  setTimeout(() => { VIS.busy = false; document.querySelectorAll('#visStage .turning').forEach(x => x.classList.remove('turning')); const nav = document.querySelector('.vis-nav span'); if (nav) nav.textContent = (VIS.i + 1) + ' / ' + VIS.pages.length;
    const [pv, nx] = document.querySelectorAll('.vis-nav .btn'); if (pv) pv.disabled = VIS.i === 0; if (nx) nx.disabled = VIS.i >= VIS.pages.length - 1; }, 650);
}
function bindSwipe(el) {
  if (!el) return;
  let x0 = null, y0 = null;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener('pointerup', e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); flip(dx < 0 ? 1 : -1); }
  });
}

// ---- Instagram モード（9:16・1080×1920 の画像に書き出し） ----
function instaPanelHTML(t) {
  const needCover = !visualCover(t);
  return `<div class="insta">${needCover ? `<div class="alert warn">表紙の写真が決まっていません（代表・お気に入りなし）。<button class="btn sm" data-act="visPickCover">表紙を選ぶ</button></div>` : ''}
    <div class="insta-previews">${VIS.pages.map((p, i) => `<canvas class="ipv" width="270" height="480" data-i="${i}"></canvas>`).join('')}</div>
    <button class="btn primary block mt" data-act="instaExport" ${needCover ? 'disabled' : ''}>📤 ${VIS.pages.length}枚を書き出す（1080×1920）</button>
    <div class="muted small">iPhone では共有シートから「画像を保存」で写真アプリに入ります</div><div id="instaOut"></div></div>`;
}
async function drawInstaPreviews() {
  await ensureFonts();
  for (const c of Array.from(document.querySelectorAll('.ipv'))) {
    const big = await renderPageCanvas(VIS.trip, VIS.pages[Number(c.dataset.i)]);
    c.getContext('2d').drawImage(big, 0, 0, c.width, c.height);
  }
}
let fontsReady = null;
function ensureFonts() {
  if (!fontsReady) fontsReady = Promise.all(['700 120px "Playfair Display"', '400 40px "Noto Serif JP"', '700 40px "Noto Sans JP"'].map(f => document.fonts && document.fonts.load ? document.fonts.load(f).catch(() => {}) : null)).catch(() => {});
  return fontsReady;
}
function loadImg(src) { return new Promise((res) => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function drawCoverFit(ctx, img, x, y, w, h) {
  if (!img) { ctx.fillStyle = '#d6d3d1'; ctx.fillRect(x, y, w, h); return; }
  const k = Math.max(w / img.width, h / img.height);
  const sw = w / k, sh = h / k;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}
function wrapText(ctx, text, maxW) {
  const words = String(text).split(/(\s+)/); const lines = []; let cur = '';
  words.forEach(w => { const t2 = cur + w; if (ctx.measureText(t2).width > maxW && cur.trim()) { lines.push(cur.trim()); cur = w.trim(); } else cur = t2; });
  if (cur.trim()) lines.push(cur.trim());
  // 1語が長すぎる時は文字で折る
  return lines.flatMap(l => { if (ctx.measureText(l).width <= maxW) return [l]; const out = []; let c = ''; for (const ch of l) { if (ctx.measureText(c + ch).width > maxW) { out.push(c); c = ch; } else c += ch; } if (c) out.push(c); return out; });
}
async function mediaImage(m) { return m ? loadImg(await fetchBigImage(m, 1600).catch(() => '')) : null; }
async function renderPageCanvas(t, p) {
  const W = 1080, H = 1920, th = VTHEME;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  if (p.type === 'cover') {
    drawCoverFit(ctx, await mediaImage(visualCover(t)), 0, 0, W, H);
    const g = ctx.createLinearGradient(0, H * 0.45, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.72)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
    ctx.font = `600 34px ${th.sans}`; ctx.letterSpacing = '8px'; ctx.fillText('TRAVEL JOURNAL', 80, 140); ctx.letterSpacing = '0px';
    let size = 150; ctx.font = `700 ${size}px ${th.serif}`;
    let lines = wrapText(ctx, displayTitleEn(t), W - 160);
    while (lines.length > 3 && size > 70) { size -= 10; ctx.font = `700 ${size}px ${th.serif}`; lines = wrapText(ctx, displayTitleEn(t), W - 160); }
    let y = H - 300 - (lines.length - 1) * size * 1.05;
    lines.forEach(l => { ctx.fillText(l, 80, y); y += size * 1.05; });
    ctx.font = `500 40px ${th.sans}`; ctx.fillText([enRange(t), t.area].filter(Boolean).join('  ・  '), 80, H - 190);
    if (t.record.comment) { ctx.font = `400 40px ${th.serif}`; wrapText(ctx, String(t.record.comment).split('\n')[0].slice(0, 60), W - 160).slice(0, 2).forEach((l, i) => ctx.fillText(l, 80, H - 120 + i * 52)); }
    return c;
  }
  ctx.fillStyle = th.paper; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = th.accent; ctx.font = `700 46px ${th.sans}`; ctx.letterSpacing = '6px'; ctx.fillText('DAY ' + p.index, 80, 150); ctx.letterSpacing = '0px';
  ctx.fillStyle = th.ink; ctx.font = `700 96px ${th.serif}`; ctx.fillText(enDate(p.date), 80, 260);
  const picks = visualDayPicks(t, p.date);
  const imgs = await Promise.all(picks.map(mediaImage));
  const X = 80, Y = 320, Wd = W - 160, Hd = 1180;
  ctx.save();
  if (imgs.length <= 1) drawCoverFit(ctx, imgs[0], X, Y, Wd, Hd);
  else if (imgs.length === 2) { drawCoverFit(ctx, imgs[0], X, Y, Wd, Hd / 2 - 12); drawCoverFit(ctx, imgs[1], X, Y + Hd / 2 + 12, Wd, Hd / 2 - 12); }
  else { drawCoverFit(ctx, imgs[0], X, Y, Wd, Hd * 0.6); const w2 = Wd / 2 - 12; drawCoverFit(ctx, imgs[1], X, Y + Hd * 0.6 + 24, w2, Hd * 0.4 - 24); drawCoverFit(ctx, imgs[2], X + w2 + 24, Y + Hd * 0.6 + 24, w2, Hd * 0.4 - 24); }
  ctx.restore();
  ctx.fillStyle = th.ink; ctx.font = `700 44px ${th.sans}`;
  wrapText(ctx, dayPlace(t, p.date), W - 160).slice(0, 2).forEach((l, i) => ctx.fillText(l, 80, 1600 + i * 58));
  ctx.fillStyle = th.sub; ctx.font = `400 42px ${th.serif}`;
  wrapText(ctx, dayLine(t, p.date), W - 160).slice(0, 2).forEach((l, i) => ctx.fillText(l, 80, 1740 + i * 58));
  ctx.fillStyle = th.accent; ctx.font = `600 30px ${th.sans}`; ctx.fillText(displayTitleEn(t), 80, 1870);
  return c;
}
function canvasBlob(c) { return new Promise(r => c.toBlob(b => r(b), 'image/jpeg', 0.92)); }
async function exportCanvases(canvases, baseName) {
  const files = [];
  for (let i = 0; i < canvases.length; i++) { const b = await canvasBlob(canvases[i]); files.push(new File([b], `${baseName}_${pad2(i + 1)}.jpg`, { type: 'image/jpeg' })); }
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files, title: baseName }); return files; } catch (e) { if (e && e.name === 'AbortError') return files; }
  }
  const out = document.getElementById('instaOut') || topModalBody();
  if (out) out.innerHTML = '<div class="muted small mt">長押しで保存、またはリンクからダウンロードできます</div>' + files.map(f => { const u = URL.createObjectURL(f); return `<a href="${u}" download="${esc(f.name)}"><img class="iout" src="${u}" alt=""></a>`; }).join('');
  return files;
}
ACT.instaExport = async (el) => {
  const t = VIS.trip;
  if (!visualCover(t)) return toast('表紙の写真を選んでください');
  el.disabled = true; el.textContent = '書き出し中…';
  try {
    await ensureFonts();
    const cs = [];
    for (const p of VIS.pages) cs.push(await renderPageCanvas(t, p));
    const files = await exportCanvases(cs, (displayTitleEn(t) || 'TRIP').replace(/\s+/g, '_'));
    toast(files.length + '枚を書き出しました');
  } catch (e) { toast('書き出しに失敗：' + e.message); }
  el.disabled = false; el.textContent = `📤 ${VIS.pages.length}枚を書き出す（1080×1920）`;
};

// 16 コレクション（v2.0）：全旅横断の1画面（統計・マップ・都道府県・年別レポート）
//   対象：旅行中・精算・記録中・完了の旅（検討中・計画中は除く。C1）
// ============================================================================
const PREFS = ['北海道', '青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県', '茨城県', '栃木県', '群馬県', '埼玉県', '千葉県', '東京都', '神奈川県', '新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県', '岐阜県', '静岡県', '愛知県', '三重県', '滋賀県', '京都府', '大阪府', '兵庫県', '奈良県', '和歌山県', '鳥取県', '島根県', '岡山県', '広島県', '山口県', '徳島県', '香川県', '愛媛県', '高知県', '福岡県', '佐賀県', '長崎県', '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県'];
const COLLECT_STATUS = ['旅行中', '精算・記録中', '完了'];

function collectionTrips() { return Object.values(S.trips).filter(t => !t._deleted && COLLECT_STATUS.includes(tripStatus(t))); }
function tripJpy(t) { const r = settleToJpy(t) || 1; return budgetSummary(t).total * r; }
function statsOf(trips) {
  const spots = new Set();
  let days = 0, km = 0, spend = 0, photos = 0, videos = 0;
  trips.forEach(t => {
    days += tripDays(t).length; km += totalDistance(t); spend += tripJpy(t);
    t.items.filter(i => i.visited).forEach(i => spots.add(i.spotId ? 's:' + i.spotId : t.id + ':' + i.id));
    t.media.forEach(m => { if (m.kind === 'video') videos++; else photos++; });
  });
  return { trips: trips.length, days, km, spend, spots: spots.size, photos, videos };
}
// 都道府県：スポット帳で「行った」になったスポットの所在地で数える（通過や旅の作成では増えない）
function visitedPlaces() {
  const pref = {}, abroad = {};
  Object.values(S.spots).filter(s => s.status === 'visited').forEach(s => {
    const p = PREFS.find(x => x === s.prefecture) || PREFS.find(x => s.prefecture && x.startsWith(s.prefecture)) || PREFS.find(x => String(s.address || '').startsWith(x));
    if (p) (pref[p] = pref[p] || []).push(s);
    else if (s.prefecture || s.address) { const k = s.prefecture || '（海外・その他）'; (abroad[k] = abroad[k] || []).push(s); }
  });
  return { pref, abroad };
}
// スポットに紐付いた写真（全旅から）。ピンのサムネイルに使う（C2）
function spotPhoto(spotId) {
  for (const t of Object.values(S.trips)) {
    const m = mediaSorted((t.media || []).filter(x => x.spotId === spotId && x.kind === 'photo')).find(x => x.favorite) || (t.media || []).find(x => x.spotId === spotId && x.kind === 'photo');
    if (m) return m;
  }
  return null;
}

function renderCollection() {
  const trips = collectionTrips();
  const st = statsOf(trips);
  const vp = visitedPlaces();
  const nPref = Object.keys(vp.pref).length;
  let h = `<div class="row between"><button class="btn sm" data-act="tab" data-tab="home">‹ ホーム</button><b class="h2">🗂 コレクション</b><span></span></div>
    <div class="muted small mt">旅行中・精算・記録中・完了の旅が対象（検討中・計画中は含めない）</div>
    <div class="card"><div class="stat-grid">
      ${[['総旅数', st.trips + '回'], ['総日数', st.days + '日'], ['総走行距離', st.km ? st.km.toLocaleString() + 'km' : '—'], ['総支出', fmtMoney(Math.round(st.spend), 'JPY')],
        ['行ったスポット', st.spots + '件'], ['都道府県', nPref + ' / 47'], ['写真', st.photos + '枚'], ['動画', st.videos + '本']].map(([k, v]) => `<div><div class="muted small">${k}</div><div class="h3">${v}</div></div>`).join('')}
    </div></div>`;
  h += `<div class="section-title">🗺 行ったスポット</div><div class="map-wrap col-map"><div id="colMap"></div></div>
    <div class="muted small">スポット帳で「行った」になったスポット。写真を紐付けたスポットはピンに写真が出ます</div>`;
  h += `<div class="section-title">🗾 都道府県の訪問状況（${nPref}/47）</div><div class="pref-grid">${PREFS.map(p => `<span class="pref ${vp.pref[p] ? 'on' : ''}" title="${vp.pref[p] ? vp.pref[p].length + '件' : ''}">${p.replace(/[都府県]$/, '')}${vp.pref[p] ? `<small>${vp.pref[p].length}</small>` : ''}</span>`).join('')}</div>`;
  const ab = Object.keys(vp.abroad);
  if (ab.length) h += `<div class="muted small mt">海外・その他：${ab.map(k => esc(k) + '（' + vp.abroad[k].length + '）').join('、')}</div>`;
  if (S.spotsState !== 'ok') h += `<div class="muted small">スポット帳を読み込むと表示されます</div>`;
  // 年別レポート
  const years = Array.from(new Set(trips.map(t => (t.startDate || '').slice(0, 4)).filter(Boolean))).sort().reverse();
  h += `<div class="section-title">📅 年別レポート</div>`;
  if (!years.length) h += emptyHTML('📅', '対象の旅がまだありません');
  years.forEach(y => {
    const ts = trips.filter(t => (t.startDate || '').startsWith(y)).sort(tripSort);
    const s = statsOf(ts);
    h += `<div class="card year"><div class="row between"><div class="h2">${y}</div><button class="btn sm" data-act="yearExport" data-y="${y}">📱 Instagram で書き出し</button></div>
      <div class="muted small">${s.trips}回 ・ ${s.days}日 ・ ${fmtMoney(Math.round(s.spend), 'JPY')} ・ ${s.km ? s.km.toLocaleString() + 'km ・ ' : ''}スポット${s.spots}件</div>
      <div class="ygrid">${ts.map(t => { const c = coverOrFirst(t); return `<button class="ytrip" data-act="tripSelect" data-id="${t.id}">${c ? mediaTileInner(c, 400) : (isImageUrl(t.coverLink) ? `<img src="${esc(t.coverLink)}" alt="">` : `<div class="mt-fb">${esc(tripEmoji(t))}</div>`)}<span>${esc(t.title)}</span></button>`; }).join('')}</div></div>`;
  });
  setTimeout(() => { drawCollectionMap(); loadThumbs(document.getElementById('page-collection')); }, 0);
  return h;
}
