<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ほしいもの帳">
<meta name="theme-color" content="#f43f5e">
<title>ほしいもの帳 v1.0</title>
<style>
  :root {
    --accent: #f43f5e;
    --accent-soft: #ffe4e8;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #18181b;
    --sub: #71717a;
    --border: #e4e4e7;
    --ok: #059669;
    --ok-bg: #d1fae5;
    --ng: #dc2626;
    --ng-bg: #fee2e2;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--text);
    max-width: 768px;
    margin: 0 auto;
    padding-bottom: calc(var(--nav-h) + 56px + env(safe-area-inset-bottom));
    font-size: 15px;
  }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; font-size: 16px; }
  .hidden { display: none !important; }

  header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; font-weight: 800; color: var(--accent); }
  .hbtn { border: none; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; }

  .page { display: none; padding: 12px 14px; }
  .page.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: var(--sub); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .pos { color: var(--ok); }
  .neg { color: var(--ng); }

  .input, select.input, textarea.input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text);
  }
  textarea.input { min-height: 72px; resize: vertical; }
  label.f { display: block; font-size: 12px; font-weight: 700; color: var(--sub); margin: 10px 0 4px; }
  .btn { border: none; border-radius: 10px; padding: 11px 14px; font-weight: 800; background: var(--accent); color: #fff; }
  .btn.sub { background: #f4f4f5; color: var(--text); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: var(--ng); }
  .btn.sm { padding: 7px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .45; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  .btns .btn { flex: 1; }

  /* toolbar */
  .search { position: relative; margin-bottom: 8px; }
  .search input { padding-left: 34px; }
  .search::before { content: "🔍"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .6; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--border); background: #fff; border-radius: 99px; padding: 6px 11px; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.tag.on { background: #3f3f46; border-color: #3f3f46; }
  .toolbar2 { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar2 select { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 14px; }
  .seg { display: flex; background: #e4e4e7; border-radius: 8px; padding: 2px; }
  .seg button { border: none; background: transparent; padding: 5px 10px; border-radius: 6px; font-size: 14px; }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .band { border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; line-height: 1.7; background: var(--accent-soft); }
  .band b { font-size: 14px; }

  /* item grid/list */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; position: relative; }
  .item .thumb { width: 100%; aspect-ratio: 1 / 1; background: #fafafa; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; }
  .item .thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .item .body { padding: 8px 10px 10px; }
  .item .name { font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
  .item .price { font-size: 16px; font-weight: 800; margin-top: 4px; }
  .item .impact { font-size: 11px; font-weight: 700; margin-top: 1px; }
  .item .catdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .item .hearts { font-size: 11px; color: var(--accent); }
  .item .more { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 16px; font-weight: 900; line-height: 1; }
  .list .item { display: flex; align-items: stretch; margin-bottom: 8px; }
  .list .item .thumb { width: 84px; min-width: 84px; aspect-ratio: auto; font-size: 30px; }
  .list .item .body { flex: 1; padding-right: 40px; }
  .list .item .name { min-height: 0; }
  .empty { text-align: center; color: var(--sub); padding: 40px 10px; font-size: 14px; line-height: 1.8; }

  .footer-total {
    position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    max-width: 768px; margin: 0 auto; z-index: 30;
    background: rgba(255,255,255,.96); border-top: 1px solid var(--border);
    padding: 9px 16px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;
  }
  .footer-total b { font-size: 16px; }
  .fab {
    position: fixed; z-index: 35; right: max(16px, calc(50% - 384px + 16px));
    bottom: calc(var(--nav-h) + 56px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 30px; font-weight: 400; line-height: 1;
    box-shadow: 0 6px 18px rgba(0,0,0,.22);
  }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    max-width: 768px; margin: 0 auto;
    background: #fff; border-top: 1px solid var(--border);
    display: flex; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button { flex: 1; border: none; background: none; color: var(--sub); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  nav button .ic { font-size: 21px; filter: grayscale(1); opacity: .6; }
  nav button.on { color: var(--accent); }
  nav button.on .ic { filter: none; opacity: 1; }

  /* sheets */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 768px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sheet-head h3 { font-size: 16px; font-weight: 800; }
  .xbtn { border: none; background: #e4e4e7; width: 30px; height: 30px; border-radius: 50%; font-size: 15px; }
  .menu-list button { display: block; width: 100%; text-align: left; border: none; background: #fff; padding: 14px; font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--border); }
  .menu-list button:first-child { border-radius: 12px 12px 0 0; }
  .menu-list button:last-child { border-radius: 0 0 12px 12px; border-bottom: none; }
  .menu-list button.danger { color: var(--ng); }

  .detail-img { width: 100%; max-height: 360px; object-fit: contain; background: #fff; border-radius: 14px; border: 1px solid var(--border); }
  .detail-ph { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 64px; background: #fff; border-radius: 14px; border: 1px solid var(--border); }
  .kv { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; font-size: 14px; }
  .kv dt { color: var(--sub); font-size: 12px; font-weight: 700; padding-top: 2px; }
  .kv dd { word-break: break-all; }
  .impact-line { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; margin: 10px 0; }

  .hearts-input { display: flex; gap: 4px; font-size: 24px; }
  .hearts-input button { border: none; background: none; padding: 0 2px; line-height: 1; color: #d4d4d8; }
  .hearts-input button.on { color: var(--accent); }
  .tagpick { display: flex; flex-wrap: wrap; gap: 6px; }
  .img-prev { width: 100%; max-height: 200px; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 6px; }
  .note { font-size: 12px; padding: 8px 10px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); margin: 8px 0; line-height: 1.6; }
  .info { font-size: 13px; padding: 9px 11px; border-radius: 10px; background: #fff; border: 1px solid var(--border); margin: 8px 0; line-height: 1.7; }

  /* calc */
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .stat:last-child { border-bottom: none; }
  .stat b { font-size: 18px; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .pick:last-child { border-bottom: none; }
  .pick input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .pick .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .pr { font-weight: 800; }
  .res { border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #fff; border: 2px solid var(--border); }
  .res.ok { border-color: var(--ok); }
  .res.ng { border-color: var(--ng); }
  .res h4 { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .res .big { font-size: 20px; font-weight: 800; }
  .res .line { font-size: 14px; margin-top: 4px; }

  /* bought */
  .brow { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .brow .d { font-size: 12px; color: var(--sub); width: 44px; flex: none; text-align: center; line-height: 1.3; }
  .brow .nm { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .catbadge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; color: #fff; margin-top: 3px; }
  .brow .pr { font-weight: 800; white-space: nowrap; }
  .sat { display: flex; gap: 0; font-size: 17px; }
  .sat button { border: none; background: none; color: #d4d4d8; padding: 0 1px; line-height: 1; }
  .sat button.on { color: var(--accent); }
  .trash { border: none; background: none; font-size: 17px; opacity: .55; padding: 4px; }

  /* settings */
  .catrow { display: grid; grid-template-columns: 44px 1fr 36px; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .catrow:last-child { border-bottom: none; }
  .catrow .icon-in { width: 44px; text-align: center; padding: 8px 2px; }
  .catrow .sub2 { grid-column: 2 / 4; display: flex; gap: 6px; align-items: center; }
  .catrow input[type=color] { width: 36px; height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: #fff; }
  .mini { border: 1px solid var(--border); background: #fff; border-radius: 8px; width: 34px; height: 34px; font-size: 14px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--border); }
  .swatches button.on { box-shadow: 0 0 0 2px var(--text); }
  .switch { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .switch input { width: 46px; height: 26px; accent-color: var(--accent); }

  /* overlay / toast / banner */
  #overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.32); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; font-weight: 800; font-size: 15px; }
  .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 70px + env(safe-area-inset-bottom)); z-index: 210; background: rgba(24,24,27,.92); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; max-width: 90vw; text-align: center; pointer-events: none; }
  #banner { position: fixed; left: 0; right: 0; top: 0; z-index: 220; max-width: 768px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 14px 12px; background: var(--ng); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #banner .t { font-weight: 800; font-size: 15px; }
  #banner .r { font-size: 13px; margin-top: 3px; line-height: 1.6; opacity: .95; }
  #banner .acts { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  #banner .acts button { border: none; border-radius: 8px; padding: 7px 12px; font-weight: 800; background: #fff; color: var(--ng); font-size: 13px; }
  #banner .acts .close { background: transparent; color: #fff; text-decoration: underline; font-weight: 600; padding: 7px 4px; }

  /* lock */
  #lock { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #lock .box { width: 100%; max-width: 340px; text-align: center; }
  #lock .logo { font-size: 54px; }
  #lock h2 { font-size: 20px; margin: 8px 0 18px; color: var(--accent); }
  #lock .err { color: var(--ng); font-size: 13px; min-height: 20px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>💝 ほしいもの帳</h1>
  <button class="hbtn" id="syncBtn" onclick="syncAll(true)">⟳ 同期</button>
</header>

<!-- タブ1 欲しい物 -->
<section class="page active" id="page-want">
  <div class="search"><input class="input" id="q" type="search" placeholder="商品名・店・メモで検索" oninput="S.f.q=this.value;renderWant()"></div>
  <div class="chips" id="catChips"></div>
  <div class="chips" id="tagChips"></div>
  <div class="toolbar2">
    <select id="sortSel" onchange="S.f.sort=this.value;saveUi();renderWant()">
      <option value="new">新しい順</option>
      <option value="old">古い順</option>
      <option value="priceDesc">価格の高い順</option>
      <option value="priceAsc">価格の安い順</option>
      <option value="desire">欲しさ順</option>
      <option value="name">名前順</option>
    </select>
    <div class="seg">
      <button id="vGrid" onclick="setView('grid')">▦</button>
      <button id="vList" onclick="setView('list')">☰</button>
    </div>
  </div>
  <div id="tagBand"></div>
  <div id="wantList"></div>
</section>

<!-- タブ2 計算 -->
<section class="page" id="page-calc">
  <div class="card" id="hhCard"></div>
  <div class="card">
    <h2><span>欲しい物から選ぶ</span>
      <span class="row"><button class="btn sm sub" onclick="calcSelectAll(true)">全部</button><button class="btn sm sub" onclick="calcSelectAll(false)">解除</button></span>
    </h2>
    <div id="calcPicks"></div>
    <div class="between" style="margin-top:10px;font-size:14px"><span id="calcCount">0件</span><b id="calcTotal" style="font-size:18px">¥0</b></div>
  </div>
  <div id="calcResult"></div>
</section>

<!-- タブ3 購入済 -->
<section class="page" id="page-bought">
  <div class="toolbar2">
    <select id="periodSel" onchange="S.period=this.value;renderBought()"></select>
  </div>
  <div id="boughtList"></div>
</section>

<!-- タブ4 設定 -->
<section class="page" id="page-settings">
  <div class="card">
    <h2>カテゴリー</h2>
    <div class="muted" style="margin-bottom:6px">アイコン・名前・色・家計簿の予算区分（budgetCat）を変更すると、その場で保存します。</div>
    <div id="catEditor"></div>
    <div class="row" style="margin-top:10px"><input class="input grow" id="newCatName" placeholder="新しいカテゴリー名"><button class="btn sm" onclick="addCategory()">追加</button></div>
    <datalist id="budgetCatList"></datalist>
  </div>

  <div class="card">
    <h2>タグ</h2>
    <div id="tagEditor"></div>
    <div class="row" style="margin-top:10px"><input class="input grow" id="newTagName" placeholder="新しいタグ名"><button class="btn sm" onclick="addTag()">作成</button></div>
  </div>

  <div class="card">
    <h2>家計簿連携</h2>
    <div class="switch"><span>連携する</span><input type="checkbox" id="hhEnabled" onchange="saveHouseholdSettings()"></div>
    <label class="f">家計簿 GAS の URL（/exec で終わるもの）</label>
    <div class="row"><input class="input grow" id="hhUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"><button class="btn sm" onclick="saveHouseholdSettings()">保存</button></div>
    <div class="info" id="hhInfo"></div>
    <div class="muted" style="line-height:1.7">家計簿の PIN は、ほしいもの帳 GAS のスクリプトプロパティ <b>HOUSEHOLD_PIN</b> で管理します（この画面には表示・入力しません）。</div>
    <div class="btns"><button class="btn ghost" onclick="refreshHousehold(true)">今すぐ家計簿の値を取得</button></div>
  </div>

  <div class="card">
    <h2>パスワード変更</h2>
    <label class="f">現在のパスワード</label><input class="input" id="pinCur" type="password" autocomplete="current-password" maxlength="64">
    <label class="f">新しいパスワード（英数字・記号 4〜64文字）</label><input class="input" id="pinNew" type="password" autocomplete="new-password" maxlength="64">
    <label class="f">新しいパスワード（確認）</label><input class="input" id="pinNew2" type="password" autocomplete="new-password" maxlength="64">
    <div class="btns"><button class="btn" onclick="changePin()">変更する</button></div>
  </div>

  <div class="card">
    <h2>CSV</h2>
    <div class="btns" style="margin-top:0">
      <button class="btn sub" onclick="exportCsv()">エクスポート</button>
      <button class="btn sub" onclick="document.getElementById('csvFile').click()">インポート</button>
    </div>
    <input type="file" id="csvFile" accept=".csv,text/csv" class="hidden" onchange="importCsv(event)">
    <div class="muted" style="margin-top:8px;line-height:1.6">インポートは追加のみ（同じ id は飛ばします）。カテゴリーは名前で対応付け、無いものは未分類。タグは「|」区切りで、無いものは作成します。</div>
  </div>

  <div class="card">
    <h2>テーマカラー</h2>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="card">
    <h2>この端末</h2>
    <div class="btns" style="margin-top:0"><button class="btn sub" onclick="lockApp()">ロックする（パスワードを忘れさせる）</button></div>
    <div class="muted" style="margin-top:8px">ほしいもの帳 v1.0</div>
  </div>
</section>

<div class="footer-total" id="footerTotal"></div>
<button class="fab" id="fab" onclick="openAdd()">＋</button>

<nav>
  <button class="on" data-tab="want" onclick="switchTab('want')"><span class="ic">💝</span>欲しい物</button>
  <button data-tab="calc" onclick="switchTab('calc')"><span class="ic">🧮</span>計算</button>
  <button data-tab="bought" onclick="switchTab('bought')"><span class="ic">🛍️</span>購入済</button>
  <button data-tab="settings" onclick="switchTab('settings')"><span class="ic">⚙️</span>設定</button>
</nav>

<div id="sheetRoot"></div>

<div id="lock" class="hidden">
  <form class="box" onsubmit="event.preventDefault();unlock()">
    <div class="logo">💝</div>
    <h2>ほしいもの帳</h2>
    <input class="input" id="pinIn" type="password" autocomplete="current-password" placeholder="パスワード" maxlength="64" style="text-align:center">
    <div class="err" id="lockErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" type="submit">ひらく</button>
  </form>
</div>

<div id="overlay" class="hidden"><div class="spinner"></div><div id="overlayLabel">保存中…</div></div>
<div id="toast" class="hidden"></div>
<div id="banner" class="hidden"></div>

<script>
// ============================================================================
// 設定
// ============================================================================
const GAS_URL = 'https://script.google.com/macros/s/XXXXXXXXXXXXXXXX/exec'; // ← デプロイ後に差し替え
const LS = {
  pin: 'wl_pin_v1', cache: 'wl_cache_v1', hh: 'wl_hh_last_v1', ui: 'wl_ui_v1',
  lastCat: 'wl_last_cat_v1', lastPay: 'wl_last_pay_v1'
};
const THEMES = ['#f43f5e', '#ec4899', '#f97316', '#eab308', '#10b981', '#0ea5e9', '#6366f1', '#8b5cf6', '#3f3f46'];

const S = {
  pin: '',
  rev: null,
  loaded: false,          // サーバーから読み込めた時だけ true（false の間は保存しない＝空上書きガード）
  items: [], categories: [], tags: [], settings: {},
  hh: null,               // 家計簿サマリー
  hhFresh: false,         // このセッションで取得に成功したか
  hhState: 'none',        // none / loading / ok / error / disabled
  hhReason: '',
  f: { q: '', cat: 'all', tags: [], sort: 'new' },
  view: 'grid',
  tab: 'want',
  calcSel: new Set(),
  period: 'all',
  pendingAdd: null
};

// ============================================================================
// 小物
// ============================================================================
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function yen(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−¥' : '¥') + Math.abs(n).toLocaleString('ja-JP'); }
function manLabel(n) { n = Number(n) || 0; return n % 10000 === 0 ? (n / 10000).toLocaleString('ja-JP') + '万円' : yen(n); }
function one(n) { return (Math.round(n * 10) / 10).toFixed(1); }
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function mdLabel(ymd) { const p = String(ymd || '').split('-'); return p.length === 3 ? Number(p[1]) + '月' + Number(p[2]) + '日' : ymd; }
function whenLabel(iso) { const d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + d.getHours() + '時'; }
function whenFull(iso) { const d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function catOf(item) { return S.categories.find(c => c.id === item.categoryId) || null; }
function catIcon(item) { const c = catOf(item); return c ? (c.icon || '📦') : '📦'; }
function tagName(id) { const t = S.tags.find(t => t.id === id); return t ? t.name : ''; }
function wantItems() { return S.items.filter(i => i.status !== 'bought'); }
function sortedCats() { return [...S.categories].sort((a, b) => (a.sort || 0) - (b.sort || 0)); }
function hearts(n, max = 5) { n = Number(n) || 0; return '♥'.repeat(n) + '<span style="color:#d4d4d8">' + '♥'.repeat(Math.max(0, max - n)) + '</span>'; }

// ============================================================================
// 通信（api 一括方式：overlay 指定時は幕＋スピナー、終了処理は必ず通す）
// ============================================================================
let overlayCount = 0;
function showOverlay(label) { overlayCount++; $('overlayLabel').textContent = label; $('overlay').classList.remove('hidden'); }
function hideOverlay() { overlayCount = Math.max(0, overlayCount - 1); if (!overlayCount) $('overlay').classList.add('hidden'); }

async function api(action, payload = {}, opts = {}) {
  if (opts.overlay) showOverlay(opts.overlay);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || 90000);
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, pin: opts.pin != null ? opts.pin : S.pin }, payload)),
      signal: ctrl.signal,
      redirect: 'follow'
    });
    if (!res.ok) return { status: 'error', reason: 'サーバーが HTTP ' + res.status + ' を返しました' };
    const txt = await res.text();
    try { return JSON.parse(txt); }
    catch (e) { return { status: 'error', reason: '応答を読めませんでした（GAS_URL・デプロイ設定を確認）' }; }
  } catch (e) {
    return { status: 'error', reason: e && e.name === 'AbortError' ? '時間切れになりました' : '通信できませんでした（電波・オフラインを確認）' };
  } finally {
    clearTimeout(timer);
    if (opts.overlay) hideOverlay();
  }
}

// ---- トースト（置き換え・約2.5秒）
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2500);
}

// ---- エラーバナー（自動で消さない。タップで閉じる）
function banner(title, reason, actions = []) {
  const b = $('banner');
  b.innerHTML = `<div class="t">⚠️ ${esc(title)}</div>${reason ? `<div class="r">${esc(reason)}</div>` : ''}
    <div class="acts">${actions.map((a, i) => `<button data-i="${i}">${esc(a.label)}</button>`).join('')}<button class="close">閉じる</button></div>`;
  b.classList.remove('hidden');
  b.onclick = ev => {
    const btn = ev.target.closest('button[data-i]');
    b.classList.add('hidden');
    if (btn) actions[Number(btn.dataset.i)].fn();
  };
}
function closeBanner() { $('banner').classList.add('hidden'); }

/** 失敗共通処理: what=何が失敗したか, r=応答, retry=再試行関数（可能な場合） */
function fail(what, r, retry) {
  const st = r && r.status;
  if (st === 'unauthorized') {
    banner(what + 'に失敗しました', (r.reason || 'パスワードが違うか、変更されています') + '。パスワードを入れ直してください。',
      [{ label: 'パスワードを入れ直す', fn: () => showLock(r.reason) }]);
  } else if (st === 'conflict') {
    banner(what + 'に失敗しました', '他の端末で更新されました。再読み込みしてください。',
      [{ label: '再読み込み', fn: () => syncAll(true) }]);
  } else if (st === 'busy') {
    banner(what + 'に失敗しました', '他の保存処理中です。少し待って再試行してください。', retry ? [{ label: '再試行', fn: retry }] : []);
  } else if (st === 'hhError') {
    const hs = r.hhStatus;
    let reason = r.reason || '家計簿 GAS でエラー';
    if (hs === 'unauthorized') reason += '。スクリプトプロパティ HOUSEHOLD_PIN を確認してください。';
    if (hs === 'conflict') reason += '。家計簿アプリ側で保存が続いている可能性があります。';
    const acts = (hs === 'busy' || hs === 'conflict' || hs === 'error') && retry ? [{ label: '再試行', fn: retry }] : [];
    if (hs === 'config') acts.push({ label: '連携設定へ', fn: () => switchTab('settings') });
    banner(what + 'に失敗しました（家計簿）', reason, acts);
  } else if (r && r.reason === 'emptyGuard') {
    banner(what + 'を中止しました', r.message || 'データが空になる保存を止めました。再読み込みしてください。', [{ label: '再読み込み', fn: () => syncAll(true) }]);
  } else {
    banner(what + 'に失敗しました', (r && (r.reason || r.message)) || '原因不明のエラー', retry ? [{ label: '再試行', fn: retry }] : []);
  }
}

// ============================================================================
// 起動・認証・同期
// ============================================================================
function init() {
  // ?add=<URL>（iOS ショートカットからの受け口）を検出し、すぐパラメータを消す（再読込で二重追加しない）
  try {
    const p = new URLSearchParams(location.search);
    const add = p.get('add');
    if (add) {
      S.pendingAdd = add;
      p.delete('add');
      const qs = p.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
    }
  } catch (e) {}

  const ui = lsGet(LS.ui, {});
  if (ui.view) S.view = ui.view;
  if (ui.sort) S.f.sort = ui.sort;
  $('sortSel').value = S.f.sort;

  // 前回データを表示（loaded は false のまま＝保存不可）
  const cache = lsGet(LS.cache, null);
  if (cache) applyData(cache);
  const hhLast = lsGet(LS.hh, null);
  if (hhLast) S.hh = hhLast;

  makeTouchIcon();
  renderAll();

  S.pin = lsGet(LS.pin, '');
  if (!S.pin) showLock();
  else startSession();
}

async function startSession() {
  const ok = await syncAll(false);
  if (!ok) return;
  refreshHousehold(false);
  if (S.pendingAdd) {
    const url = S.pendingAdd;
    S.pendingAdd = null;
    openAdd(url);
  }
}

function showLock(msg) {
  $('lock').classList.remove('hidden');
  $('lockErr').textContent = msg || '';
  $('pinIn').value = '';
  setTimeout(() => $('pinIn').focus(), 50);
}

async function unlock() {
  const pin = $('pinIn').value;
  if (pin.length < 4 || pin.length > 64) { $('lockErr').textContent = '4〜64文字で入力してください'; return; }
  const r = await api('auth', {}, { overlay: '確認中…', pin });
  if (r.status === 'ok') {
    S.pin = pin;
    lsSet(LS.pin, pin);
    $('lock').classList.add('hidden');
    closeBanner();
    startSession();
  } else if (r.status === 'unauthorized') {
    $('lockErr').textContent = r.reason || 'パスワードが違います';
  } else {
    $('lockErr').textContent = r.reason || '接続できませんでした';
  }
}

function lockApp() {
  if (!confirm('この端末のパスワードを消してロックします。よろしいですか？')) return;
  S.pin = '';
  try { localStorage.removeItem(LS.pin); } catch (e) {}
  showLock();
}

function applyData(d) {
  S.items = (d.items || []).map(i => Object.assign({}, i, { tags: Array.isArray(i.tags) ? i.tags : [] }));
  S.categories = d.categories || [];
  S.tags = d.tags || [];
  S.settings = {};
  (d.settings || []).forEach(r => { S.settings[r.key] = r.value; });
  applyTheme(S.settings.themeColor);
}

function settingsRows(map) { return Object.keys(map).map(k => ({ key: k, value: map[k] == null ? '' : String(map[k]) })); }

function cacheLocal() {
  lsSet(LS.cache, { items: S.items, categories: S.categories, tags: S.tags, settings: settingsRows(S.settings) });
}

async function syncAll(manual) {
  const r = await api('loadAll', {}, { overlay: '同期中…' });
  if (r.status === 'ok') {
    applyData(r);
    S.rev = r.rev;
    S.loaded = true;
    cacheLocal();
    renderAll();
    if (manual) { toast('同期しました'); refreshHousehold(false); }
    return true;
  }
  if (r.status === 'unauthorized') { showLock(r.reason); return false; }
  fail('同期', r, () => syncAll(manual));
  return false;
}

/** 保存（対象シートだけ全件上書き）。成功時のみ手元に反映。失敗時は入力を残す */
async function saveSheets(next, label) {
  if (!S.loaded) {
    banner(label + 'の保存を中止しました', 'まだサーバーからデータを読み込めていません（空データで上書きしないため）。',
      [{ label: '同期する', fn: () => syncAll(true) }]);
    return false;
  }
  const payload = { baseRev: S.rev };
  if (next.items) payload.items = next.items;
  if (next.categories) payload.categories = next.categories;
  if (next.tags) payload.tags = next.tags;
  if (next.settings) payload.settings = settingsRows(next.settings);
  const r = await api('save', payload, { overlay: '保存中…' });
  if (r.status === 'saved') {
    S.rev = r.rev;
    if (next.items) S.items = next.items;
    if (next.categories) S.categories = next.categories;
    if (next.tags) S.tags = next.tags;
    if (next.settings) { S.settings = next.settings; applyTheme(S.settings.themeColor); }
    cacheLocal();
    renderAll();
    toast(label + 'を保存しました');
    return true;
  }
  fail(label + 'の保存', r, () => saveSheets(next, label));
  return false;
}

// ============================================================================
// 家計簿サマリー
// ============================================================================
async function refreshHousehold(withOverlay) {
  S.hhState = 'loading';
  renderHh();
  const r = await api('hhSummary', {}, withOverlay ? { overlay: '同期中…' } : {});
  if (r.status === 'ok') {
    S.hh = r.summary;
    S.hhFresh = true;
    S.hhState = 'ok';
    S.hhReason = '';
    lsSet(LS.hh, r.summary);
    if (withOverlay) toast('家計簿の値を取得しました');
  } else {
    S.hhFresh = false;
    S.hhState = r.status === 'disabled' ? 'disabled' : 'error';
    S.hhReason = r.reason || '';
    if (r.last && (!S.hh || new Date(r.last.fetchedAt) > new Date(S.hh.fetchedAt))) { S.hh = r.last; lsSet(LS.hh, r.last); }
    if (r.status === 'unauthorized') { showLock(r.reason); }
    else if (withOverlay) fail('家計簿の値の取得', r, () => refreshHousehold(true));
  }
  renderAll();
}

/** 今の家計簿値で計算してよいか（カード等のラベル無し表示はこのセッションで取得成功した時だけ） */
function hhLive() { return S.hhFresh && S.hh; }

// ---- 計算（§4）
function calcA(h, total) {
  const before = h.varRest;
  const after = before - total;
  const days = Math.max(1, h.daysLeft || 1);
  return { before, after, over: after < 0 ? -after : 0, dayBefore: Math.floor(before / days), dayAfter: Math.floor(after / days) };
}
function calcB(h, total) {
  const after = Math.max(0, h.defenseFund - total);
  const delay = h.basePace > 0 ? total / h.basePace : 0;
  return { before: h.defenseFund, after, toTarget: h.toTarget, delay };
}
function effBudgetOf(h, budgetCat) { return h.effBudgets && h.effBudgets[budgetCat] != null ? Number(h.effBudgets[budgetCat]) : 0; }

// ============================================================================
// 描画
// ============================================================================
function renderAll() {
  renderWant();
  renderHh();
  renderCalc();
  renderBought();
  renderSettings();
  renderFooter();
}

function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + tab));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('fab').classList.toggle('hidden', tab !== 'want');
  renderFooter();
  window.scrollTo(0, 0);
}

function setView(v) { S.view = v; saveUi(); renderWant(); }
function saveUi() { lsSet(LS.ui, { view: S.view, sort: S.f.sort }); }

function filteredWant() {
  const q = S.f.q.trim().toLowerCase();
  let list = wantItems().filter(i => {
    if (S.f.cat === 'none') { if (catOf(i)) return false; }
    else if (S.f.cat !== 'all' && i.categoryId !== S.f.cat) return false;
    if (S.f.tags.length && !S.f.tags.every(t => (i.tags || []).includes(t))) return false;
    if (q) {
      const hay = [i.name, i.shop, i.memo, (catOf(i) || {}).name, ...(i.tags || []).map(tagName)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const s = S.f.sort;
  list.sort((a, b) => {
    if (s === 'old') return String(a.createdAt).localeCompare(String(b.createdAt));
    if (s === 'priceDesc') return (b.price || 0) - (a.price || 0);
    if (s === 'priceAsc') return (a.price || 0) - (b.price || 0);
    if (s === 'desire') return (b.desire || 0) - (a.desire || 0) || String(b.createdAt).localeCompare(String(a.createdAt));
    if (s === 'name') return String(a.name).localeCompare(String(b.name), 'ja');
    return String(b.createdAt).localeCompare(String(a.createdAt));
  });
  return list;
}

function isFiltered() { return S.f.q.trim() || S.f.cat !== 'all' || S.f.tags.length; }

function renderWant() {
  // カテゴリー
  const want = wantItems();
  const hasNone = want.some(i => !catOf(i));
  let ch = `<button class="chip ${S.f.cat === 'all' ? 'on' : ''}" onclick="S.f.cat='all';renderWant();renderFooter()">すべて</button>`;
  sortedCats().forEach(c => {
    ch += `<button class="chip ${S.f.cat === c.id ? 'on' : ''}" onclick="S.f.cat='${c.id}';renderWant();renderFooter()">${esc(c.icon || '')} ${esc(c.name)}</button>`;
  });
  if (hasNone) ch += `<button class="chip ${S.f.cat === 'none' ? 'on' : ''}" onclick="S.f.cat='none';renderWant();renderFooter()">未分類</button>`;
  $('catChips').innerHTML = ch;
  // タグ
  S.f.tags = S.f.tags.filter(t => S.tags.some(x => x.id === t));
  $('tagChips').innerHTML = S.tags.map(t =>
    `<button class="chip tag ${S.f.tags.includes(t.id) ? 'on' : ''}" onclick="toggleTagFilter('${t.id}')"># ${esc(t.name)}</button>`).join('');
  $('tagChips').classList.toggle('hidden', !S.tags.length);
  $('vGrid').classList.toggle('on', S.view === 'grid');
  $('vList').classList.toggle('on', S.view === 'list');

  const list = filteredWant();
  // タグ絞り込み時の影響帯（A と B の両方を表示）
  const band = $('tagBand');
  if (S.f.tags.length && hhLive() && list.length) {
    const total = list.reduce((a, i) => a + (Number(i.price) || 0), 0);
    const A = calcA(S.hh, total), B = calcB(S.hh, total);
    band.innerHTML = `<div class="band">
      <div>絞り込み ${list.length}件 <b>${yen(total)}</b></div>
      <div>今買うと 今月の残り ${yen(A.before)} → <b class="${A.after < 0 ? 'neg' : 'pos'}">${yen(A.after)}</b>${A.over ? ` <span class="neg">（${yen(A.over)} 超過）</span>` : ''}</div>
      <div>残高 ${yen(B.before)} → <b>${yen(B.after)}</b>、${manLabel(S.hh.target)}到達が約 <b>${one(B.delay)}</b> ヶ月遅れる</div>
    </div>`;
  } else band.innerHTML = '';

  const box = $('wantList');
  if (!list.length) {
    box.className = '';
    box.innerHTML = `<div class="empty">${want.length ? '条件に合う商品がありません' : 'まだ何もありません。<br>右下の「＋」から追加できます'}</div>`;
    return;
  }
  box.className = S.view === 'grid' ? 'grid' : 'list';
  const live = hhLive();
  box.innerHTML = list.map(i => {
    const c = catOf(i);
    let impact = '';
    if (live) {
      const before = S.hh.varRest, after = before - (Number(i.price) || 0);
      impact = `<div class="impact ${after < 0 ? 'neg' : 'pos'}">${yen(before)} → ${yen(after)}</div>`;
    }
    const img = i.imageUrl
      ? `<img src="${esc(i.imageUrl)}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.replaceWith(document.createTextNode('${esc(catIcon(i))}'))">`
      : esc(catIcon(i));
    return `<div class="item" onclick="openDetail('${i.id}')">
      <div class="thumb">${img}</div>
      <div class="body">
        <div class="name">${esc(i.name || '(名前なし)')}</div>
        <div class="price">${i.price ? yen(i.price) : '<span class="muted">価格未入力</span>'}</div>
        ${impact}
        <div class="muted" style="margin-top:3px">${c ? `<span class="catdot" style="background:${esc(c.color)}"></span>${esc(c.name)}` : '未分類'}
          ${i.desire ? ` <span class="hearts">${'♥'.repeat(i.desire)}</span>` : ''}</div>
      </div>
      <button class="more" onclick="event.stopPropagation();openItemMenu('${i.id}')">…</button>
    </div>`;
  }).join('');
}

function toggleTagFilter(id) {
  const k = S.f.tags.indexOf(id);
  if (k >= 0) S.f.tags.splice(k, 1); else S.f.tags.push(id);
  renderWant();
  renderFooter();
}

function renderFooter() {
  const ft = $('footerTotal');
  if (S.tab === 'want') {
    const all = wantItems();
    const allSum = all.reduce((a, i) => a + (Number(i.price) || 0), 0);
    if (isFiltered()) {
      const l = filteredWant();
      const sum = l.reduce((a, i) => a + (Number(i.price) || 0), 0);
      ft.innerHTML = `<span>絞り込み ${l.length}件 <span class="muted">／全体 ${yen(allSum)}</span></span><b>${yen(sum)}</b>`;
    } else ft.innerHTML = `<span>全 ${all.length}件</span><b>${yen(allSum)}</b>`;
    ft.classList.remove('hidden');
  } else if (S.tab === 'bought') {
    const l = boughtInPeriod();
    const sum = l.reduce((a, i) => a + (Number(i.boughtPrice) || Number(i.price) || 0), 0);
    ft.innerHTML = `<span>${S.period === 'all' ? 'すべての期間' : periodLabel(S.period)} ${l.length}件</span><b>${yen(sum)}</b>`;
    ft.classList.remove('hidden');
  } else ft.classList.add('hidden');
}

// ---- 計算タブ
function renderHh() {
  const box = $('hhCard');
  const h = S.hh;
  const enabled = S.settings.householdEnabled === '1';
  let head = `<h2><span>家計簿の現在値</span><button class="btn sm ghost" onclick="refreshHousehold(true)">⟳ 再読込</button></h2>`;
  if (S.hhState === 'loading') head += `<div class="muted" style="margin-bottom:6px">家計簿から取得中…</div>`;
  if (!h) {
    if (!enabled || S.hhState === 'disabled') {
      box.innerHTML = head + `<div class="note">家計簿連携がOFFです。設定タブで家計簿 GAS の URL を登録し、連携をONにすると「今買うと」の計算ができます。</div>
        <button class="btn sub" onclick="switchTab('settings')">連携の設定へ</button>`;
    } else {
      box.innerHTML = head + `<div class="note">家計簿の値をまだ取得できていません。${esc(S.hhReason)}<br>連携の設定（URL・HOUSEHOLD_PIN）を確認してください。</div>
        <button class="btn sub" onclick="switchTab('settings')">連携の設定へ</button>`;
    }
    $('hhInfo') && renderHhInfo();

  }
  let warn = '';
  if (!S.hhFresh && S.hhState !== 'loading') {
    warn = `<div class="note">家計簿の値が取得できません（${whenLabel(h.fetchedAt)} 時点の値を表示中）${S.hhReason ? '<br>理由: ' + esc(S.hhReason) : ''}</div>`;
  }
  const A = calcA(h, 0);
  box.innerHTML = head + warn + `
    <div class="stat"><span>今月の変動費残金</span><b class="${h.varRest < 0 ? 'neg' : ''}">${yen(h.varRest)}</b></div>
    <div class="muted" style="text-align:right">予算 ${yen(h.varBudget)} − 使用 ${yen(h.varSpent)}</div>
    <div class="stat"><span>今日の1日予算</span><b>${yen(A.dayBefore)}</b></div>
    <div class="muted" style="text-align:right">残り${h.daysLeft}日で割った額</div>
    <div class="stat"><span>防衛資金枠</span><b>${yen(h.defenseFund)}</b></div>
    ${h.balanceSource === 'log' ? '<div class="muted" style="text-align:right">ログ算出残高で計算中</div>' : ''}
    <div class="stat"><span>${manLabel(h.target)}まであと</span><b>${yen(h.toTarget)}</b></div>
    <div class="muted" style="margin-top:6px">取得時刻: ${whenFull(h.fetchedAt)}</div>`;
  renderHhInfo();
}

function renderCalc() {
  const want = wantItems().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  [...S.calcSel].forEach(id => { if (!want.some(i => i.id === id)) S.calcSel.delete(id); });
  const h = S.hh;
  const picks = $('calcPicks');
  if (!want.length) picks.innerHTML = '<div class="muted">欲しい物がまだありません</div>';
  else picks.innerHTML = want.map(i => {
    let cls = '';
    if (h) cls = (h.varRest - (Number(i.price) || 0)) >= 0 ? 'pos' : 'neg';
    return `<label class="pick"><input type="checkbox" ${S.calcSel.has(i.id) ? 'checked' : ''} onchange="toggleCalc('${i.id}',this.checked)">
      <span class="nm">${esc(catIcon(i))} ${esc(i.name)}</span><span class="pr ${cls}">${yen(i.price)}</span></label>`;
  }).join('');
  const sel = want.filter(i => S.calcSel.has(i.id));
  const total = sel.reduce((a, i) => a + (Number(i.price) || 0), 0);
  $('calcCount').textContent = sel.length + '件 選択中';
  $('calcTotal').textContent = yen(total);

  const res = $('calcResult');
  if (!sel.length) { res.innerHTML = ''; return; }
  if (!h) { res.innerHTML = '<div class="note">家計簿の値が無いため「今買うと」は表示できません。連携を設定してください。</div>'; return; }
  const A = calcA(h, total), B = calcB(h, total);
  const stale = !S.hhFresh ? `<div class="note">${whenLabel(h.fetchedAt)} 時点の家計簿の値で計算しています</div>` : '';
  let html = stale + `
    <div class="res ${A.after < 0 ? 'ng' : 'ok'}">
      <h4>基準A　今月の変動費残金</h4>
      <div class="big">${yen(A.before)} → <span class="${A.after < 0 ? 'neg' : 'pos'}">${yen(A.after)}</span></div>
      ${A.over ? `<div class="line neg"><b>${yen(A.over)} 超過</b></div>` : ''}
      <div class="line">今日の1日予算 ${yen(A.dayBefore)} → <b class="${A.dayAfter < 0 ? 'neg' : ''}">${yen(A.dayAfter)}</b></div>
    </div>
    <div class="res">
      <h4>基準B　防衛資金</h4>
      <div class="big">残高 ${yen(B.before)} → ${yen(B.after)}</div>
      ${h.balanceSource === 'log' ? '<div class="line muted">ログ算出残高で計算中</div>' : ''}
      <div class="line">${manLabel(h.target)}まであと ${yen(B.toTarget)}</div>
      <div class="line">${manLabel(h.target)}到達が約 <b>${one(B.delay)}</b> ヶ月遅れる</div>
    </div>`;
  // 基準C
  const catIds = [...new Set(sel.map(i => i.categoryId || ''))];
  let cHtml = '';
  if (catIds.length === 1) {
    const c = catOf(sel[0]);
    cHtml = cLine(c, total);
  } else {
    cHtml = sel.map(i => `<div class="line"><span class="muted">${esc(i.name)}</span><br>${cLine(catOf(i), Number(i.price) || 0)}</div>`).join('');
  }
  html += `<div class="res"><h4>基準C　カテゴリー予算</h4>${cHtml}</div>`;
  res.innerHTML = html;
}

function cLine(cat, amount) {
  const h = S.hh;
  if (!cat) return '<div class="line muted">未分類のため予算区分がありません</div>';
  if (!cat.budgetCat) return `<div class="line muted">「${esc(cat.name)}」に家計簿の予算区分が未設定です</div>`;
  const eff = effBudgetOf(h, cat.budgetCat);
  if (!eff) return `<div class="line">『${esc(cat.budgetCat)}』予算なし</div>`;
  return `<div class="line">『${esc(cat.budgetCat)}』の月予算 ${yen(eff)} の約 <b>${one(amount / eff)}</b> ヶ月分</div>`;
}

function toggleCalc(id, on) { if (on) S.calcSel.add(id); else S.calcSel.delete(id); renderCalc(); }
function calcSelectAll(on) { S.calcSel = new Set(on ? wantItems().map(i => i.id) : []); renderCalc(); }

function boughtItems() { return S.items.filter(i => i.status === 'bought').sort((a, b) => String(b.boughtAt).localeCompare(String(a.boughtAt))); }
function boughtInPeriod() { const l = boughtItems(); return S.period === 'all' ? l : l.filter(i => String(i.boughtAt).slice(0, 7) === S.period); }
function periodLabel(ym) { const p = ym.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }

function renderBought() {
  const all = boughtItems();
  const months = [...new Set(all.map(i => String(i.boughtAt).slice(0, 7)).filter(Boolean))].sort().reverse();
  if (S.period !== 'all' && !months.includes(S.period)) S.period = 'all';
  $('periodSel').innerHTML = `<option value="all">すべての期間</option>` + months.map(m => `<option value="${m}" ${S.period === m ? 'selected' : ''}>${periodLabel(m)}</option>`).join('');

    return `<div class="brow" onclick="openDetail('${i.id}')">
      <div class="d">${d.length === 3 ? `${Number(d[1])}/${Number(d[2])}<br><span style="font-size:10px">${d[0]}</span>` : ''}</div>
      <div class="grow">
        <div class="nm">${esc(i.name)}</div>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          ${c ? `<span class="catbadge" style="background:${esc(c.color)}">${esc(c.icon || '')} ${esc(c.name)}</span>` : '<span class="catbadge" style="background:#a1a1aa">未分類</span>'}

async function setSatisfaction(id, n) {
  const it = S.items.find(i => i.id === id);
  if (!it) return;
  const v = it.satisfaction === n ? 0 : n;
  const next = S.items.map(i => i.id === id ? Object.assign({}, i, { satisfaction: v }) : i);
  await saveSheets({ items: next }, '満足度');
}

function openSheet(html, onClose) {
  const root = $('sheetRoot');
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(bg); });
  bg._onClose = onClose;
  root.appendChild(bg);
  return bg;
}
function closeSheet(el) {
  const bg = el ? (el.classList && el.classList.contains('sheet-bg') ? el : el.closest('.sheet-bg')) : $('sheetRoot').lastElementChild;
  if (!bg) return;
  if (bg._onClose) bg._onClose();
  bg.remove();
}
function closeAllSheets() { $('sheetRoot').innerHTML = ''; }
function sheetHead(title) { return `<div class="sheet-head"><h3>${esc(title)}</h3><button class="xbtn" onclick="closeSheet(this)">✕</button></div>`; }

function openAdd(prefillUrl) {
  if (!S.loaded) { banner('追加できません', 'まだサーバーからデータを読み込めていません。', [{ label: '同期する', fn: () => syncAll(true) }]); return; }
  const bg = openSheet(sheetHead('欲しい物を追加') + `
    <label class="f">商品ページの URL</label>
    <div class="row"><input class="input grow" id="addUrl" type="url" inputmode="url" placeholder="https://..." autocomplete="off"></div>
    <div class="btns">
      <button class="btn sub" onclick="pasteUrl()">📋 貼り付け</button>
      <button class="btn" onclick="readUrl(this)">読み取る</button>
    </div>
    <div class="btns"><button class="btn ghost" onclick="closeSheet(this);openEditor(null,{})">✍️ 手入力で追加</button></div>
    <div class="muted" style="margin-top:12px;line-height:1.6">iOS ショートカットからは「?add=URL」付きで開くと、ここを飛ばして読み取りを始めます。</div>`);
  if (prefillUrl) {
    $('addUrl').value = prefillUrl;
    readUrl(bg.querySelector('.sheet'));
  } else setTimeout(() => { const el = $('addUrl'); el && el.focus(); }, 80);
}

async function pasteUrl() {
  try {
    const t = await navigator.clipboard.readText();
    const m = String(t || '').match(/https?:\/\/\S+/);
    if (m) $('addUrl').value = m[0];
    else toast('クリップボードに URL がありません');
  } catch (e) { toast('貼り付けできませんでした。入力欄に長押しで貼り付けてください'); }
}

async function readUrl(el) {
  const raw = ($('addUrl').value || '').trim();
  const m = raw.match(/https?:\/\/\S+/);
  if (!m) { toast('URL を入力してください'); return; }
  const url = m[0];
  const r = await api('fetchUrl', { url }, { overlay: '読み取り中…', timeout: 60000 });
  closeSheet(el);
  if (r.status === 'ok') {
    openEditor(null, { url: r.item.url, name: r.item.name, price: r.item.price, imageUrl: r.item.imageUrl, shop: r.item.shop }, r.partial ? r.note : '');
  } else if (r.status === 'unauthorized') {
    fail('URL の読み取り', r);
  } else {
    // 失敗で終わらせず、手入力の確認カードに落とす
    openEditor(null, { url, shop: guessShop(url) }, '読み取れませんでした（' + (r.reason || 'エラー') + '）。名前と価格を入力してください');
  }
}

function guessShop(url) {
  const h = (String(url).match(/^https?:\/\/([^\/?#:]+)/i) || [])[1] || '';
  if (/amazon\.co\.jp$|^amzn\./.test(h)) return 'Amazon';
  if (/rakuten\.co\.jp$/.test(h)) return '楽天市場';
  if (/shopping\.yahoo\.co\.jp$/.test(h)) return 'Yahoo!ショッピング';
  return h.replace(/^www\./, '');
}

}
function edRenderTags() {
  const all = S.tags.map(t => ({ id: t.id, name: t.name })).concat(ED.newTags);
  $('edTags').innerHTML = all.length ? all.map(t => `<button class="chip tag ${ED.tags.includes(t.id) ? 'on' : ''}" onclick="edToggleTag('${t.id}')"># ${esc(t.name)}</button>`).join('') : '<span class="muted">タグはまだありません</span>';
}
function edToggleTag(id) { const k = ED.tags.indexOf(id); if (k >= 0) ED.tags.splice(k, 1); else ED.tags.push(id); edRenderTags(); }
function edAddTag() {
  const name = $('edNewTag').value.trim();
  if (!name) return;
  const exist = S.tags.find(t => t.name === name) || ED.newTags.find(t => t.name === name);
  const id = exist ? exist.id : uid('t');

  if (!ED.tags.includes(id)) ED.tags.push(id);

}
function edRenderDesire() {
  $('edDesire').innerHTML = [1, 2, 3, 4, 5].map(n => `<button class="${n <= ED.desire ? 'on' : ''}" onclick="ED.desire=(ED.desire===${n}?0:${n});edRenderDesire()">♥</button>`).join('');
}

async function saveEditor(el, cont) {
  const name = $('edName').value.trim();
  const priceRaw = $('edPrice').value.trim();
  if (!name) { toast('商品名を入力してください'); return; }
  const price = Math.round(Number(priceRaw) || 0);
  if (priceRaw && (!(price >= 0) || price > 1e9)) { toast('価格を確認してください'); return; }
  const it = {
    id: ED.id || uid('i'),
    name, price,
    url: $('edUrl').value.trim(),
    imageUrl: $('edImgUrl').value.trim(),
    shop: $('edShop').value.trim(),
    categoryId: $('edCat').value,
    tags: ED.tags.filter(t => S.tags.some(x => x.id === t) || ED.newTags.some(x => x.id === t)),
    desire: ED.desire || 0,
    memo: $('edMemo').value,
    status: ED.status || 'want',
    createdAt: ED.createdAt || new Date().toISOString(),
    boughtAt: ED.boughtAt || '', boughtPrice: ED.boughtPrice || 0, satisfaction: ED.satisfaction || 0,
    householdLogId: ED.householdLogId || ''
  };
  const nextItems = ED.isNew ? S.items.concat([it]) : S.items.map(i => i.id === it.id ? it : i);
  const usedNew = ED.newTags.filter(t => it.tags.includes(t.id));
  const next = { items: nextItems };
  if (usedNew.length) next.tags = S.tags.concat(usedNew);
  const ok = await saveSheets(next, '「' + shortName(name) + '」');
  if (!ok) return; // 入力内容は残す
  if (ED.isNew) lsSet(LS.lastCat, it.categoryId || '');
  closeSheet(el);
  ED = null;
  if (cont) openAdd();
}

function shortName(s) { s = String(s || ''); return s.length > 16 ? s.slice(0, 16) + '…' : s; }

function openPurchase(id) {

  if (!i) return;
  const c = catOf(i);
  const enabled = S.settings.householdEnabled === '1';
  const canHh = enabled && hhLive() && (S.hh.payMethods || []).length;
  PU = { id, budgetCat: c && c.budgetCat ? c.budgetCat : '', usageCat: c ? c.name : '' };
  const lastPay = lsGet(LS.lastPay, '');
  let hhBlock = '';
  if (canHh) {
    const methods = S.hh.payMethods;
    const defM = methods.some(m => m.name === lastPay) ? lastPay : methods[0].name;
    hhBlock = `
      <div class="switch" style="margin-top:10px"><span style="font-weight:700">家計簿に登録する</span><input type="checkbox" id="puReg" checked onchange="puToggle()"></div>
      <div id="puHh">
        <label class="f">支払い方法</label>
        <select class="input" id="puMethod" onchange="puPreview()">${methods.map(m => `<option ${m.name === defM ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
        <div class="info" id="puPrev"></div>
      </div>`;
  } else if (enabled) {
    hhBlock = `<div class="note">家計簿の値を取得できていないため、家計簿の明細は作りません（購入済への移動だけ行います）。</div>`;
  }
  openSheet(sheetHead('買った！') + `
    <div style="font-weight:700;line-height:1.4">${esc(i.name)}</div>
    <label class="f">実購入額（円）</label><input class="input" id="puPrice" type="number" inputmode="numeric" min="1" value="${i.price || ''}">
    <label class="f">購入日</label><input class="input" id="puDate" type="date" value="${todayStr()}" onchange="puPreview()">
    ${hhBlock}
    <div class="btns"><button class="btn" onclick="confirmPurchase(this)">購入済にする</button></div>`);
  if (canHh) puPreview();
}

function puToggle() { $('puHh').classList.toggle('hidden', !$('puReg').checked); }

let puSeq = 0;
async function puPreview() {
  const box = $('puPrev');
  if (!box) return;
  const bc = PU.budgetCat;
  const head = bc ? `家計簿では「<b>${esc(bc)}</b>」に入ります` : `<span class="neg">この商品のカテゴリーに家計簿の予算区分がありません。カテゴリーを設定するか、登録のチェックを外してください。</span>`;
  const name = $('puMethod').value;
  const m = (S.hh.payMethods || []).find(x => x.name === name);
  const date = $('puDate').value;
  box.innerHTML = head + '<br>引落予定: 計算中…';
  if (!m || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { box.innerHTML = head; return; }
  const seq = ++puSeq;
  const r = await api('hhPreview', { method: m, date });
  if (seq !== puSeq || !$('puPrev')) return;
  box.innerHTML = head + '<br>' + (r.status === 'ok' ? `引落予定 <b>${mdLabel(r.payDate)}</b>` : '引落予定: 計算できませんでした');
}

async function confirmPurchase(el) {
  const it = S.items.find(x => x.id === PU.id);
  if (!it) return;
  const price = Math.round(Number($('puPrice').value) || 0);
  const date = $('puDate').value;
  if (!(price > 0)) { toast('実購入額を入力してください'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('購入日を入力してください'); return; }
  const reg = $('puReg') && $('puReg').checked;
  let household = null;
  if (reg) {
    if (!PU.budgetCat) { toast('予算区分が無いため家計簿に登録できません'); return; }
    const method = $('puMethod').value;
    household = { method, date, amount: price, memo: it.name, usageCat: PU.usageCat, budgetCat: PU.budgetCat };
    lsSet(LS.lastPay, method);
  }
  if (!S.loaded) { fail('購入の確定', { status: 'error', reason: 'まだデータを読み込めていません' }); return; }
  const updated = Object.assign({}, it, { status: 'bought', boughtAt: date, boughtPrice: price, satisfaction: it.satisfaction || 0, householdLogId: '' });
  const nextItems = S.items.map(i => i.id === it.id ? updated : i);
  const r = await api('purchase', { baseRev: S.rev, items: nextItems, itemId: it.id, household }, { overlay: household ? '家計簿に登録中…' : '保存中…', timeout: 120000 });
  if (r.status === 'saved') {
    updated.householdLogId = r.logId ? String(r.logId) : '';
    S.items = nextItems.map(i => i.id === it.id ? updated : i);
    S.rev = r.rev;
    S.calcSel.delete(it.id);
    cacheLocal();
    closeSheet(el);
    renderAll();
    toast('「' + shortName(it.name) + '」を購入済にしました' + (r.logId ? '（家計簿に登録）' : ''));
    if (r.logId) refreshHousehold(false); // 家計簿の残金が変わるので取り直す
    return;
  }
  // 明細作成に失敗 → 購入確定も中断（シートは開いたまま、入力は残す）
  fail('購入の確定', r, () => confirmPurchase(el));
}

// ============================================================================
// 削除
// ============================================================================
function deleteItem(id) {
  const it = S.items.find(x => x.id === id);
  if (!it) return;
  if (it.status === 'bought' && it.householdLogId) {
    openSheet(sheetHead('購入済を削除') + `
      <div style="line-height:1.7;margin-bottom:10px">「${esc(it.name)}」を削除します。<br><b>家計簿の明細も消しますか？</b><br><span class="muted">明細 id ${esc(it.householdLogId)}</span></div>
      <div class="menu-list">
        <button class="danger" onclick="closeSheet(this);doDelete('${id}',true)">家計簿の明細も消す</button>
        <button onclick="closeSheet(this);doDelete('${id}',false)">ほしいもの帳だけ消す（家計簿は残す）</button>
        <button onclick="closeSheet(this)">キャンセル</button>
      </div>`);
  } else {
    if (!confirm('「' + it.name + '」を削除しますか？')) return;
    doDelete(id, false);
  }
}

async function doDelete(id, withLog) {
  const it = S.items.find(x => x.id === id);
  if (!it) return;
  if (!S.loaded) { fail('削除', { status: 'error', reason: 'まだデータを読み込めていません' }); return; }
  const nextItems = S.items.filter(i => i.id !== id);
  const r = await api('deleteItem', { baseRev: S.rev, items: nextItems, deleteLogId: withLog ? it.householdLogId : '' },
    { overlay: withLog ? '家計簿から削除中…' : '保存中…', timeout: 120000 });
  if (r.status === 'saved') {
    S.items = nextItems;
    S.rev = r.rev;
    S.calcSel.delete(id);
    cacheLocal();
    renderAll();
    let msg = '「' + shortName(it.name) + '」を削除しました';
    if (withLog) msg += r.hhNote === 'notFound' ? '（家計簿の明細は既にありませんでした）' : '（家計簿の明細も削除）';
    toast(msg);
    if (withLog) refreshHousehold(false);
    return;
  }
  fail('削除', r, () => doDelete(id, withLog));
}

// ============================================================================
// 設定
// ============================================================================
function renderSettings() {
  // カテゴリー
  const cats = sortedCats();
  const bcs = new Set(cats.map(c => c.budgetCat).filter(Boolean));
  if (S.hh && S.hh.effBudgets) Object.keys(S.hh.effBudgets).forEach(k => bcs.add(k));
  $('budgetCatList').innerHTML = [...bcs].sort().map(b => `<option value="${esc(b)}">`).join('');
  $('catEditor').innerHTML = cats.length ? cats.map((c, idx) => `
    <div class="catrow">
      <input class="input icon-in" value="${esc(c.icon)}" maxlength="4" onchange="updateCat('${c.id}','icon',this.value)">
      <input class="input" value="${esc(c.name)}" onchange="updateCat('${c.id}','name',this.value)">
      <input type="color" value="${esc(normColor(c.color))}" onchange="updateCat('${c.id}','color',this.value)">
      <div class="sub2">
        <input class="input grow" list="budgetCatList" value="${esc(c.budgetCat)}" placeholder="家計簿の予算区分" onchange="updateCat('${c.id}','budgetCat',this.value)" style="font-size:14px;padding:7px 10px">
        <button class="mini" ${idx === 0 ? 'disabled' : ''} onclick="moveCat('${c.id}',-1)">↑</button>
        <button class="mini" ${idx === cats.length - 1 ? 'disabled' : ''} onclick="moveCat('${c.id}',1)">↓</button>
        <button class="mini" onclick="deleteCat('${c.id}')">🗑</button>
      </div>
    </div>`).join('') : '<div class="muted">カテゴリーがありません</div>';

  // タグ
  $('tagEditor').innerHTML = S.tags.length ? S.tags.map(t => `
    <div class="row" style="padding:5px 0">
      <input class="input grow" value="${esc(t.name)}" onchange="renameTag('${t.id}',this.value)">
      <span class="muted" style="width:44px;text-align:right">${S.items.filter(i => (i.tags || []).includes(t.id)).length}件</span>
      <button class="mini" onclick="deleteTag('${t.id}')">🗑</button>
    </div>`).join('') : '<div class="muted">タグはまだありません</div>';

  // 家計簿連携
  if (document.activeElement !== $('hhUrl')) $('hhUrl').value = S.settings.householdUrl || '';
  $('hhEnabled').checked = S.settings.householdEnabled === '1';
  renderHhInfo();

  // テーマ
  const cur = (S.settings.themeColor || THEMES[0]).toLowerCase();
  $('swatches').innerHTML = THEMES.map(t => `<button class="${t === cur ? 'on' : ''}" style="background:${t}" onclick="setTheme('${t}')"></button>`).join('') +
    `<input type="color" value="${esc(normColor(cur))}" onchange="setTheme(this.value)" style="width:34px;height:34px;border:none;background:none;padding:0">`;
}

function renderHhInfo() {
  const el = $('hhInfo');
  if (!el) return;
  const h = S.hh;
  let s = '最終取得: ' + (h ? whenFull(h.fetchedAt) : '—');
  if (S.hhState === 'ok') s += '　<span class="pos">✓ 取得OK</span>';
  else if (S.hhState === 'error') s += '<br><span class="neg">取得できません: ' + esc(S.hhReason) + '</span>';
  else if (S.hhState === 'disabled') s += '<br>連携OFF';
  else if (S.hhState === 'loading') s += '<br>取得中…';
  el.innerHTML = s;
}

function normColor(c) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#a1a1aa'; }
function cloneArr(a) { return a.map(x => Object.assign({}, x)); }

async function updateCat(id, key, val) {
  val = String(val).trim();
  if (key === 'name' && !val) { toast('名前は空にできません'); renderSettings(); return; }
  const next = cloneArr(S.categories).map(c => c.id === id ? Object.assign(c, { [key]: val }) : c);
  const ok = await saveSheets({ categories: next }, 'カテゴリー');
  if (!ok) renderSettings();
}

async function addCategory() {
  const name = $('newCatName').value.trim();
  if (!name) return;
  if (S.categories.some(c => c.name === name)) { toast('同じ名前のカテゴリーがあります'); return; }
  const maxSort = S.categories.reduce((m, c) => Math.max(m, Number(c.sort) || 0), 0);
  const color = THEMES[Math.floor(Math.random() * THEMES.length)];
  const next = cloneArr(S.categories).concat([{ id: uid('c'), name, icon: '📦', color, sort: maxSort + 1, budgetCat: '変動費（通販・買い物）' }]);
  if (await saveSheets({ categories: next }, 'カテゴリー「' + name + '」')) $('newCatName').value = '';
}

async function moveCat(id, dir) {
  const cats = sortedCats().map(c => Object.assign({}, c));
  const k = cats.findIndex(c => c.id === id);
  const j = k + dir;
  if (k < 0 || j < 0 || j >= cats.length) return;
  [cats[k], cats[j]] = [cats[j], cats[k]];
  cats.forEach((c, i) => { c.sort = i + 1; });
  await saveSheets({ categories: cats }, '並び順');
}

async function deleteCat(id) {
  const c = S.categories.find(x => x.id === id);
  if (!c) return;
  const n = S.items.filter(i => i.categoryId === id).length;
  if (!confirm(`カテゴリー「${c.name}」を削除しますか？` + (n ? `\n${n}件の商品は未分類になります。` : ''))) return;
  const next = { categories: cloneArr(S.categories).filter(x => x.id !== id) };
  if (n) next.items = S.items.map(i => i.categoryId === id ? Object.assign({}, i, { categoryId: '' }) : i);
  if (S.f.cat === id) S.f.cat = 'all';
  await saveSheets(next, 'カテゴリーの削除');
}

async function addTag() {
  const name = $('newTagName').value.trim();
  if (!name) return;
  if (S.tags.some(t => t.name === name)) { toast('同じ名前のタグがあります'); return; }
  if (await saveSheets({ tags: cloneArr(S.tags).concat([{ id: uid('t'), name }]) }, 'タグ「' + name + '」')) $('newTagName').value = '';
}

async function renameTag(id, name) {
  name = String(name).trim();
  if (!name) { toast('名前は空にできません'); renderSettings(); return; }
  const ok = await saveSheets({ tags: cloneArr(S.tags).map(t => t.id === id ? Object.assign(t, { name }) : t) }, 'タグ名');
  if (!ok) renderSettings();
}

async function deleteTag(id) {
  const t = S.tags.find(x => x.id === id);
  if (!t) return;
  const n = S.items.filter(i => (i.tags || []).includes(id)).length;
  if (!confirm(`タグ「${t.name}」を削除しますか？` + (n ? `\n${n}件の商品から外れます。` : ''))) return;
  const next = { tags: cloneArr(S.tags).filter(x => x.id !== id) };
  if (n) next.items = S.items.map(i => (i.tags || []).includes(id) ? Object.assign({}, i, { tags: i.tags.filter(x => x !== id) }) : i);
  await saveSheets(next, 'タグの削除');
}

async function saveHouseholdSettings() {
  const url = $('hhUrl').value.trim();
  const enabled = $('hhEnabled').checked;
  if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
    if (!confirm('Google Apps Script の URL ではないようです。このまま保存しますか？')) { renderSettings(); return; }
  }
  if (enabled && !url) { toast('家計簿 GAS の URL を入力してください'); $('hhEnabled').checked = false; return; }
  const next = Object.assign({}, S.settings, { householdUrl: url, householdEnabled: enabled ? '1' : '0' });
  const ok = await saveSheets({ settings: next }, '家計簿連携の設定');
  if (!ok) { renderSettings(); return; }
  S.hhFresh = false;
  if (enabled) refreshHousehold(true);
  else { S.hhState = 'disabled'; renderAll(); }
}

async function setTheme(color) {
  applyTheme(color);
  const ok = await saveSheets({ settings: Object.assign({}, S.settings, { themeColor: color }) }, 'テーマカラー');
  if (!ok) applyTheme(S.settings.themeColor);
}

function applyTheme(color) {
  if (!/^#[0-9a-f]{6}$/i.test(color || '')) color = THEMES[0];
  const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.12)`);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', color);
}

async function changePin() {
  const cur = $('pinCur').value, n1 = $('pinNew').value, n2 = $('pinNew2').value;
  if (!cur) { toast('現在のパスワードを入力してください'); return; }
  if (!/^[\x21-\x7E]{4,64}$/.test(n1)) { toast('新しいパスワードは英数字・記号で4〜64文字です'); return; }
  if (n1 !== n2) { toast('確認用が一致しません'); return; }
  const r = await api('changePin', { newPin: n1 }, { overlay: '保存中…', pin: cur });
  if (r.status === 'ok') {
    S.pin = n1;
    lsSet(LS.pin, n1);
    $('pinCur').value = $('pinNew').value = $('pinNew2').value = '';
    toast('パスワードを変更しました');
  } else if (r.status === 'unauthorized') {
    banner('パスワード変更に失敗しました', '現在のパスワードが違います。');
  } else fail('パスワード変更', r, changePin);
}

// ---- CSV
const CSV_COLS = ['id', 'name', 'price', 'url', 'imageUrl', 'shop', 'category', 'tags', 'desire', 'memo', 'status', 'createdAt', 'boughtAt', 'boughtPrice', 'satisfaction', 'householdLogId'];
function csvCell(v) { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv() {
  const lines = [CSV_COLS.join(',')];
  S.items.forEach(i => {
    const row = Object.assign({}, i, { category: (catOf(i) || {}).name || '', tags: (i.tags || []).map(tagName).filter(Boolean).join('|') });
    lines.push(CSV_COLS.map(c => csvCell(row[c])).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hoshiimono_' + todayStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('CSV を書き出しました（' + S.items.length + '件）');
}

function parseCsv(text) {
  const rows = []; let row = []; let cell = ''; let q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

async function importCsv(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const text = await file.text();
  const rows = parseCsv(text);
  if (rows.length < 2) { toast('データがありません'); return; }
  const head = rows[0].map(h => h.trim());
  const ix = k => head.indexOf(k);
  if (ix('name') < 0) { banner('CSV を読み込めませんでした', '1行目に name 列が必要です（エクスポートした形式を使ってください）'); return; }
  const tags = cloneArr(S.tags);
  const existIds = new Set(S.items.map(i => i.id));
  const add = [];
  rows.slice(1).forEach(r => {
    const g = k => (ix(k) >= 0 ? (r[ix(k)] || '').trim() : '');
    const name = g('name');
    if (!name) return;
    let id = g('id');
    if (id && existIds.has(id)) return;
    if (!id) id = uid('i');
    existIds.add(id);
    const cat = S.categories.find(c => c.name === g('category'));
    const tagIds = g('tags').split('|').map(s => s.trim()).filter(Boolean).map(n => {
      let t = tags.find(x => x.name === n);
      if (!t) { t = { id: uid('t'), name: n }; tags.push(t); }
      return t.id;
    });
    const status = g('status') === 'bought' ? 'bought' : 'want';
    add.push({
      id, name, price: Math.round(Number(g('price').replace(/[^\d.]/g, '')) || 0), url: g('url'), imageUrl: g('imageUrl'), shop: g('shop'),
      categoryId: cat ? cat.id : '', tags: tagIds, desire: Math.min(5, Number(g('desire')) || 0), memo: g('memo'), status,
      createdAt: g('createdAt') || new Date().toISOString(), boughtAt: status === 'bought' ? g('boughtAt') : '',
      boughtPrice: Number(g('boughtPrice')) || 0, satisfaction: Math.min(5, Number(g('satisfaction')) || 0), householdLogId: g('householdLogId')
    });
  });
  if (!add.length) { toast('追加できる行がありません（同じ id は飛ばします）'); return; }
  if (!confirm(add.length + '件を追加します。よろしいですか？')) return;
  const next = { items: S.items.concat(add) };
  if (tags.length !== S.tags.length) next.tags = tags;
  await saveSheets(next, 'CSV の' + add.length + '件');
}

// ---- ホーム画面アイコン（PNG を生成）
function makeTouchIcon() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#f43f5e';
    x.fillRect(0, 0, 180, 180);
    x.font = '110px sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('💝', 90, 98);
    const l = document.createElement('link');
    l.rel = 'apple-touch-icon';
    l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  } catch (e) {}
}
